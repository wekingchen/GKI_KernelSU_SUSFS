name: "pandora OS4 Rust provenance compare (temporary, read-only)"
on:
  push:
    branches: ["pandora-406-rust-source-provenance"]
    paths: [".github/workflows/pandora-406-rust-provenance-probe.yml"]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: "Download pinned verified R62 evidence and GKI candidate"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r62" "$RUNNER_TEMP/new"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd
          gh release download pandora-os4-lkg-gen5 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Xiaomi17Pro-pandora-OS4-Gen5-ORIGINAL-evidence.tar.zst' --dir "$RUNNER_TEMP/r62"
          echo 'd53626c9258708f24d3de65fe7167a7f3ac8c2560359138a764a7b7f907d80b4  '"$RUNNER_TEMP/r62/Xiaomi17Pro-pandora-OS4-Gen5-ORIGINAL-evidence.tar.zst" | sha256sum -c -
          gh release download pandora-os4-ota-candidate-OS4.0.6.0.XBLCNXM --repo "$GITHUB_REPOSITORY" \
            --pattern 'Module.symvers' --pattern 'final.config' --pattern 'build-metadata.txt' --dir "$RUNNER_TEMP/new"
          echo '242f6b3668e6f895c894bfbd35096c2f408a1b546b3cd0649bae4ed1d99dce25  '"$RUNNER_TEMP/new/Module.symvers" | sha256sum -c -
          tar -I zstd -tf "$RUNNER_TEMP/r62/Xiaomi17Pro-pandora-OS4-Gen5-ORIGINAL-evidence.tar.zst" > "$RUNNER_TEMP/r62/file-list.txt"
          echo '=== AVAILABLE VERIFIED R62 EVIDENCE FILES ==='
          grep -Ei 'symvers|rust.binder|metadata|config|manifest|build-info|\.ko' "$RUNNER_TEMP/r62/file-list.txt" | head -n 70 || true
          echo '=== R62 EVIDENCE COUNTS ==='
          wc -l "$RUNNER_TEMP/r62/file-list.txt"
          grep -ci 'symvers' "$RUNNER_TEMP/r62/file-list.txt" || true
          grep -ci 'rust.binder' "$RUNNER_TEMP/r62/file-list.txt" || true
          echo '=== CANDIDATE RUST EXPORTS ==='
          grep -Ec $'^0x[0-9a-f]+\\t_R[^\\t]+\\tvmlinux' "$RUNNER_TEMP/new/Module.symvers" || true
          echo 'READ ONLY, NO BOOT, NO UPLOAD OF PRIVATE DEVICE EVIDENCE' >> "$GITHUB_STEP_SUMMARY"
      - name: "Compare R62 verified symbols with 4.0.6 stock Binder CRCs"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -I zstd -xOf "$RUNNER_TEMP/r62/Xiaomi17Pro-pandora-OS4-Gen5-ORIGINAL-evidence.tar.zst" './Module.symvers' > "$RUNNER_TEMP/r62/Module.symvers"
          tar -I zstd -xOf "$RUNNER_TEMP/r62/Xiaomi17Pro-pandora-OS4-Gen5-ORIGINAL-evidence.tar.zst" './final.config' > "$RUNNER_TEMP/r62/final.config"
          tar -I zstd -xOf "$RUNNER_TEMP/r62/Xiaomi17Pro-pandora-OS4-Gen5-ORIGINAL-evidence.tar.zst" './build-metadata.txt' > "$RUNNER_TEMP/r62/build-metadata.txt"
          mkdir -p "$RUNNER_TEMP/abi"
          gh run download 44897936109 --repo "$GITHUB_REPOSITORY" --name pandora-406-full-vendorboot-gate-readonly --dir "$RUNNER_TEMP/abi"
          python3 - <<'PY'
          import collections,json,os,pathlib,re
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          report=json.loads((root/"abi/ota-abi-report-with-early.json").read_text())
          missing=report["unresolved_kernel_imports"]
          rust=[x for x in missing if "rust_binder.ko:" in x]
          if len(missing)!=71 or len(rust)!=71:raise ValueError("unexpected original missing symbol evidence")
          def exports(p):
              out={}
              total=0
              for line in p.read_text().splitlines():
                  x=line.split()
                  if len(x)<3 or x[2]!="vmlinux":continue
                  try: crc=int(x[0],16)
                  except: continue
                  total+=1
                  out[x[1]]=crc
              return out,total
          r62,r62_total=exports(root/"r62/Module.symvers")
          new,new_total=exports(root/"new/Module.symvers")
          found=[x.rsplit(":",1)[-1] for x in rust if x.rsplit(":",1)[-1] in r62]
          missing_r62=[x.rsplit(":",1)[-1] for x in rust if x.rsplit(":",1)[-1] not in r62]
          xconf={}
          for key in ("CONFIG_RUST","CONFIG_RUST_IS_AVAILABLE","CONFIG_EXTENDED_MODVERSIONS","CONFIG_ANDROID_BINDER_IPC"):
              a=(root/"r62/final.config").read_text()
              b=(root/"new/final.config").read_text()
              xconf[key]={"r62":next((s for s in a.splitlines() if s.startswith(key+"=")),None),
                          "new":next((s for s in b.splitlines() if s.startswith(key+"=")),None)}
          metadata=(root/"r62/build-metadata.txt").read_text().splitlines()
          interesting=[s for s in metadata if any(z in s.lower() for z in ("gki","commit","rust","clang","source_","kernel_release"))]
          out={"diagnostic":"READ_ONLY_R62_VERIFIED_VS_NEW_GKI",
               "verified_r62_vmlinux_export_count":r62_total,
               "new_gki_vmlinux_export_count":new_total,
               "verified_r62_mangled_export_count":sum(x.startswith("_R") for x in r62),
               "new_gki_mangled_export_count":sum(x.startswith("_R") for x in new),
               "rust_binder_stock_missing_in_new":len(rust),
               "rust_binder_symbols_present_in_verified_r62":len(found),
               "rust_binder_symbols_missing_in_verified_r62":len(missing_r62),
               "matched_in_verified_r62_names":found[:30],
               "not_found_in_verified_r62_names":missing_r62[:15],
               "config":xconf,"metadata":interesting[:32],
               "r62_same_rust_export_names_in_new":sum(x in new for x in r62 if x.startswith("_R"))}
          (root/"r62/verified-r62-vs-new-gki.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({k:v for k,v in out.items() if k not in ("matched_in_verified_r62_names","not_found_in_verified_r62_names")},ensure_ascii=False,indent=2))
          print("R62_FOUND_STOCK_RUST_SYMBOL_EXAMPLES",found[:8])
          print("R62_MISSING_STOCK_RUST_SYMBOL_EXAMPLES",missing_r62[:8])
          PY
      - name: "Inspect verified AnyKernel3 module packaging and pinned GKI Rust Binder Kconfig"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends unzip curl >/dev/null
          gh release download pandora-os4-lkg-gen5 --repo "$GITHUB_REPOSITORY" --pattern 'Xiaomi17Pro-pandora-OS4-Gen5-ORIGINAL-USER-VERIFIED-AnyKernel3.zip' --dir "$RUNNER_TEMP/r62"
          echo 'a88839c3f153b51cf6e8e254ecb9e47a4aacfa14b0c717c07df8de543b8afe4b  '"$RUNNER_TEMP/r62/Xiaomi17Pro-pandora-OS4-Gen5-ORIGINAL-USER-VERIFIED-AnyKernel3.zip" | sha256sum -c -
          unzip -Z -1 "$RUNNER_TEMP/r62/Xiaomi17Pro-pandora-OS4-Gen5-ORIGINAL-USER-VERIFIED-AnyKernel3.zip" > "$RUNNER_TEMP/r62/anykernel3-files.txt"
          echo '=== ANYKERNEL FILES ==='
          cat "$RUNNER_TEMP/r62/anykernel3-files.txt" | head -n 55
          echo '=== ANYKERNEL MODULE/INSTALL ROUTING ==='
          grep -Ei '(\.ko$|rust|binder|module|system_dlkm|vendor_dlkm)' "$RUNNER_TEMP/r62/anykernel3-files.txt" | head -n 70 || true
          curl -fsSL --retry 3 'https://android.googlesource.com/kernel/common/+/refs/tags/android16-6.12-2026-03_r74/drivers/android/binder/Kconfig?format=TEXT' -o "$RUNNER_TEMP/r62/rust-binder-kconfig.b64"
          base64 -d "$RUNNER_TEMP/r62/rust-binder-kconfig.b64" > "$RUNNER_TEMP/r62/rust-binder-Kconfig"
          curl -fsSL --retry 3 'https://android.googlesource.com/kernel/common/+/refs/tags/android16-6.12-2026-03_r74/drivers/android/binder/Makefile?format=TEXT' | base64 -d > "$RUNNER_TEMP/r62/rust-binder-Makefile"
          echo '=== GKI BINDER KCONFIG ==='
          head -n 130 "$RUNNER_TEMP/r62/rust-binder-Kconfig"
          echo '=== GKI BINDER MAKEFILE ==='
          head -n 110 "$RUNNER_TEMP/r62/rust-binder-Makefile"
          echo 'READ ONLY: neither original R62 installer nor GKI files were modified' >> "$GITHUB_STEP_SUMMARY"
      - name: "Inspect OEM Binder module metadata and stock boot command line"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stock"
          gh release download pandora-os4-stock-input --repo "$GITHUB_REPOSITORY" \
            --pattern 'pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip' --dir "$RUNNER_TEMP/stock"
          echo 'bebb8754c16dd30c724fdba3687694e615e03342d6f5f55918cd06f1dca8cbb8  '"$RUNNER_TEMP/stock/pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,io,os,pathlib,struct,tempfile,zipfile,subprocess,json
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          x=root/"stock/pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip"
          with zipfile.ZipFile(x) as f:
              boot=f.read("boot.img")
              vb=f.read("vendor_boot.img")
              oem=zipfile.ZipFile(io.BytesIO(f.read("oem-modules.zip")))
              files=[n for n in oem.namelist() if n.endswith("/rust_binder.ko")]
              if len(files)!=1:raise ValueError("unexpected Binder module inventory")
              raw=oem.read(files[0])
          print("RUST_BINDER_ZIP_ENTRY",files[0],"bytes",len(raw),"sha256",hashlib.sha256(raw).hexdigest())
          # No writes to any phone, only ephemeral temporary file.
          with tempfile.NamedTemporaryFile(suffix=".ko") as tmp:
              tmp.write(raw);tmp.flush()
              for args in (["readelf","-p",".comment",tmp.name],["readelf","-n",tmp.name],
                           ["readelf","-p",".modinfo",tmp.name]):
                  p=subprocess.run(args,capture_output=True,text=True)
                  print("METADATA_COMMAND",args[:-1],"exit",p.returncode)
                  print(p.stdout[:2400].replace("\x00"," "))
          boot_cmdline=boot[44:44+1536].split(b"\x00",1)[0].decode("utf8","replace")
          vendor_cmdline=vb[28:28+2048].split(b"\x00",1)[0].decode("utf8","replace")
          print("BOOT_HEADER_CMDLINE_BINDER", [s for s in boot_cmdline.split() if "binder" in s.lower()])
          print("VENDOR_BOOT_CMDLINE_BINDER",[s for s in vendor_cmdline.split() if "binder" in s.lower()])
          if vb[:8]!=b"VNDRBOOT":raise ValueError("invalid stock vendorboot")
          page,rs,head,dtb_size,table_size,bc_size=(struct.unpack_from("<I",vb,12)[0],
              struct.unpack_from("<I",vb,24)[0],struct.unpack_from("<I",vb,2096)[0],
              struct.unpack_from("<I",vb,2100)[0],struct.unpack_from("<I",vb,2112)[0],
              struct.unpack_from("<I",vb,2124)[0])
          align=lambda a:(a+page-1)//page*page
          bc_at=align(align(align(head)+rs)+dtb_size)+align(table_size)
          bc=vb[bc_at:bc_at+bc_size].decode("utf8","replace")
          print("VENDOR_BOOT_BOOTCONFIG_BYTES",bc_size,"BINDER_LINES",[l for l in bc.splitlines() if "binder" in l.lower()])
          out=dict(boot_header_binder=[s for s in boot_cmdline.split() if "binder" in s.lower()],
                   vendor_header_binder=[s for s in vendor_cmdline.split() if "binder" in s.lower()],
                   stock_vendor_bootconfig_binder=[l for l in bc.splitlines() if "binder" in l.lower()],
                   rust_binder_oem_module_sha256=hashlib.sha256(raw).hexdigest())
          (root/"r62/binder-boot-conditions.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - name: "Inspect real verified R62 build's Rust Binder module evidence"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r62-artifact"
          gh run download 43551917368 --repo "$GITHUB_REPOSITORY" \
            --name pandora-OS4-R62-CUSTOM-run-43551917368 --dir "$RUNNER_TEMP/r62-artifact"
          echo '=== R62 ARTIFACT RUST RELEVANT FILES ==='
          find "$RUNNER_TEMP/r62-artifact" -maxdepth 3 -type f | sed "s#$RUNNER_TEMP/r62-artifact/##" | grep -Ei 'rust|binder|symvers|metadata|config|\\.ko|archive' | head -n 70 || true
          echo '=== R62 ARTIFACT FILE COUNT ==='
          find "$RUNNER_TEMP/r62-artifact" -type f | wc -l
          module="$(find "$RUNNER_TEMP/r62-artifact" -type f -name 'rust_binder*.ko' -print -quit)"
          if [[ -n "$module" ]]; then
            readelf -p .comment "$module" | head -n 15
            readelf -p .modinfo "$module" | grep -Ei 'vermagic|name|scmversion|depends' | head -n 20 || true
            echo 'R62_RUST_BINDER_SHA256'
            sha256sum "$module"
            echo 'R62_RUST_BINDER_UNDEFINED_RUST_NAMES_SAMPLE'
            readelf -W -s "$module" | grep -E '_R' | grep -E 'UND' | head -n 14 || true
          else
            echo 'R62_RUST_BINDER_KO_NOT_DIRECT_ARTIFACT'
          fi
      - name: "Compare verified R62 rustc build signature"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/r62/Xiaomi17Pro-pandora-OS4-Gen5-ORIGINAL-evidence.tar.zst"
          echo '=== VERIFIED R62 FULL INVENTORY ==='
          cat "$RUNNER_TEMP/r62/file-list.txt"
          if grep -qE 'vmlinux[.]zst' "$RUNNER_TEMP/r62/file-list.txt"; then
            tar -I zstd -xOf "$archive" './vmlinux.zst' | zstd -dc > "$RUNNER_TEMP/r62/vmlinux"
            readelf -p .comment "$RUNNER_TEMP/r62/vmlinux" | grep -Ei 'rustc|Android Rust|clang' | head -n 12 || true
            strings "$RUNNER_TEMP/r62/vmlinux" | grep -E 'Android Rust Toolchain version|rustc version 1.82.0' | head -n 8 || true
          else
            echo 'VERIFIED_R62_VMLINUX_NOT_IN_ARCHIVE'
          fi
      - name: "Store file inventory only"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pandora-406-r62-verified-evidence-inventory
          path: |
            ${{ runner.temp }}/r62/file-list.txt
            ${{ runner.temp }}/r62/verified-r62-vs-new-gki.json
            ${{ runner.temp }}/r62/binder-boot-conditions.json
          retention-days: 14
          if-no-files-found: warn
