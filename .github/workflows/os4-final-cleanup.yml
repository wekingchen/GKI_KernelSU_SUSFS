name: "一次性仓库收尾：清理失效 Actions 与实验分支"

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/os4-final-cleanup.yml"

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: "删除已无对应 yml 的历史运行记录"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          PRESERVE_IDS="41068829461 41072834543"
          deleted=0
          preserved=0
          skipped_active=0

          while IFS=$'\t' read -r id status path; do
            [[ -n "$id" ]] || continue
            if grep -qw "$id" <<<"$PRESERVE_IDS"; then
              echo "[保留 LKG 证据] run=$id path=$path"
              preserved=$((preserved + 1))
              continue
            fi
            if [[ "$status" != "completed" ]]; then
              skipped_active=$((skipped_active + 1))
              continue
            fi
            if [[ "$path" == .github/workflows/* && ! -f "$path" ]]; then
              echo "[删除失效运行] run=$id path=$path"
              gh api -X DELETE "repos/$REPO/actions/runs/$id"
              deleted=$((deleted + 1))
            fi
          done < <(
            gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .status, .path] | @tsv'
          )

          echo "DELETED_RUNS=$deleted" >> "$GITHUB_ENV"
          echo "PRESERVED_LKG_RUNS=$preserved" >> "$GITHUB_ENV"
          echo "SKIPPED_ACTIVE_RUNS=$skipped_active" >> "$GITHUB_ENV"

      - name: "删除已合并的 OS4 实验分支"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          for branch in \
            "os4/pandora-6.12.69-adaptation-20261029" \
            "os4/pandora-6.12.69-os3-parity-20261030" \
            "cleanup/os4-full-parity-lkg-20261030"; do
            if gh api "repos/$REPO/branches/$branch" >/dev/null 2>&1; then
              echo "[删除分支] $branch"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            else
              echo "[已不存在] $branch"
            fi
          done

      - name: "摘要"
        shell: bash
        run: |
          {
            echo "## 仓库收尾清理"
            echo
            echo "- 删除失效 workflow runs: ${DELETED_RUNS:-0}"
            echo "- 保留最终 LKG 证据 runs: ${PRESERVED_LKG_RUNS:-0}"
            echo "- 跳过仍在运行的 runs: ${SKIPPED_ACTIVE_RUNS:-0}"
            echo "- 已处理 OS4 实验/cleanup 分支"
          } >> "$GITHUB_STEP_SUMMARY"
