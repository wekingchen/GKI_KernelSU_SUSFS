name: "小米17 Pro OS4 / 自定义内核"

on:
  workflow_dispatch:
    inputs:
      root_mode:
        description: "Root / SUSFS 模式"
        required: true
        type: choice
        options:
          - bakasu-susfs
          - bakasu
          - none
        default: bakasu-susfs
      susfs_extra_features:
        description: "SUSFS 扩展功能（SPOOF/HIDE/OPEN_REDIRECT/SUS_MAP，推荐）"
        required: true
        type: boolean
        default: true
      use_nomount:
        description: "NoMount VFS 注入"
        required: true
        type: boolean
        default: true
      droidspaces:
        description: "DroidSpaces 完整支持（含安全 PIDs 方案 / namespace / Macvlan / IPv6 NAT）"
        required: true
        type: choice
        options:
          - "on"
          - "off"
        default: "on"
      droidspaces_ntsync:
        description: "NTSync（Wine/Windows 同步，可独立于 DroidSpaces 开启）"
        required: true
        type: boolean
        default: true
      use_bbg:
        description: "Baseband Guard（BBG）"
        required: true
        type: boolean
        default: true
      use_rekernel:
        description: "Re-Kernel 11.7 + Generic Netlink"
        required: true
        type: boolean
        default: true
      use_networking:
        description: "网络增强（BBR/IPSet/FQ/FQ_CODEL/CAKE/WireGuard/CIFS）"
        required: true
        type: boolean
        default: true
      use_cve:
        description: "CVE-2026-43499 / CVE-2026-53163 修复链审计/必要时回补"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: xiaomi-os4-pandora-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-upstreams:
    name: "解析本次最新稳定上游快照"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      bakasu_kind: ${{ steps.resolve.outputs.bakasu_kind }}
      bakasu_ref: ${{ steps.resolve.outputs.bakasu_ref }}
      bakasu_version: ${{ steps.resolve.outputs.bakasu_version }}
      bakasu_commit: ${{ steps.resolve.outputs.bakasu_commit }}
      susfs_kind: ${{ steps.resolve.outputs.susfs_kind }}
      susfs_ref: ${{ steps.resolve.outputs.susfs_ref }}
      susfs_version: ${{ steps.resolve.outputs.susfs_version }}
      susfs_commit: ${{ steps.resolve.outputs.susfs_commit }}
      nomount_kind: ${{ steps.resolve.outputs.nomount_kind }}
      nomount_ref: ${{ steps.resolve.outputs.nomount_ref }}
      nomount_version: ${{ steps.resolve.outputs.nomount_version }}
      nomount_commit: ${{ steps.resolve.outputs.nomount_commit }}
      droidspaces_kind: ${{ steps.resolve.outputs.droidspaces_kind }}
      droidspaces_ref: ${{ steps.resolve.outputs.droidspaces_ref }}
      droidspaces_version: ${{ steps.resolve.outputs.droidspaces_version }}
      droidspaces_commit: ${{ steps.resolve.outputs.droidspaces_commit }}
      ntsync_kind: ${{ steps.resolve.outputs.ntsync_kind }}
      ntsync_ref: ${{ steps.resolve.outputs.ntsync_ref }}
      ntsync_version: ${{ steps.resolve.outputs.ntsync_version }}
      ntsync_commit: ${{ steps.resolve.outputs.ntsync_commit }}
      bbg_kind: ${{ steps.resolve.outputs.bbg_kind }}
      bbg_ref: ${{ steps.resolve.outputs.bbg_ref }}
      bbg_version: ${{ steps.resolve.outputs.bbg_version }}
      bbg_commit: ${{ steps.resolve.outputs.bbg_commit }}
      rekernel_kind: ${{ steps.resolve.outputs.rekernel_kind }}
      rekernel_ref: ${{ steps.resolve.outputs.rekernel_ref }}
      rekernel_version: ${{ steps.resolve.outputs.rekernel_version }}
      rekernel_commit: ${{ steps.resolve.outputs.rekernel_commit }}
      match_lkg: ${{ steps.resolve.outputs.match_lkg }}
      changed_components: ${{ steps.resolve.outputs.changed_components }}
      snapshot_sha256: ${{ steps.resolve.outputs.snapshot_sha256 }}
    steps:
      - name: "检出仓库"
        uses: actions/checkout@v7

      - name: "解析各组件最新稳定版本"
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/resolved-upstreams.env"
          bash scripts/xiaomi-os4/resolve-stable-upstreams.sh "$OUT"
          source "$OUT"

          emit() {
            local key="$1" value="$2"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          }

          emit bakasu_kind "$RESOLVED_BAKASU_KIND"
          emit bakasu_ref "$RESOLVED_BAKASU_REF"
          emit bakasu_version "$RESOLVED_BAKASU_VERSION"
          emit bakasu_commit "$RESOLVED_BAKASU_COMMIT"
          emit susfs_kind "$RESOLVED_SUSFS_KIND"
          emit susfs_ref "$RESOLVED_SUSFS_REF"
          emit susfs_version "$RESOLVED_SUSFS_VERSION"
          emit susfs_commit "$RESOLVED_SUSFS_COMMIT"
          emit nomount_kind "$RESOLVED_NOMOUNT_KIND"
          emit nomount_ref "$RESOLVED_NOMOUNT_REF"
          emit nomount_version "$RESOLVED_NOMOUNT_VERSION"
          emit nomount_commit "$RESOLVED_NOMOUNT_COMMIT"
          emit droidspaces_kind "$RESOLVED_DROIDSPACES_KIND"
          emit droidspaces_ref "$RESOLVED_DROIDSPACES_REF"
          emit droidspaces_version "$RESOLVED_DROIDSPACES_VERSION"
          emit droidspaces_commit "$RESOLVED_DROIDSPACES_COMMIT"
          emit ntsync_kind "$RESOLVED_NTSYNC_KIND"
          emit ntsync_ref "$RESOLVED_NTSYNC_REF"
          emit ntsync_version "$RESOLVED_NTSYNC_VERSION"
          emit ntsync_commit "$RESOLVED_NTSYNC_COMMIT"
          emit bbg_kind "$RESOLVED_BBG_KIND"
          emit bbg_ref "$RESOLVED_BBG_REF"
          emit bbg_version "$RESOLVED_BBG_VERSION"
          emit bbg_commit "$RESOLVED_BBG_COMMIT"
          emit rekernel_kind "$RESOLVED_REKERNEL_KIND"
          emit rekernel_ref "$RESOLVED_REKERNEL_REF"
          emit rekernel_version "$RESOLVED_REKERNEL_VERSION"
          emit rekernel_commit "$RESOLVED_REKERNEL_COMMIT"
          emit match_lkg "$UPSTREAMS_MATCH_LKG"
          emit changed_components "$CHANGED_COMPONENTS"
          emit snapshot_sha256 "$UPSTREAM_SET_SHA256"

          {
            echo "## 本次上游稳定快照"
            echo
            echo "| 组件 | 稳定来源 | 本次版本 | SHA |"
            echo "|---|---|---|---|"
            echo "| BakaSU | branch | $RESOLVED_BAKASU_VERSION | $RESOLVED_BAKASU_COMMIT |"
            echo "| SUSFS | branch | $RESOLVED_SUSFS_VERSION | $RESOLVED_SUSFS_COMMIT |"
            echo "| NoMount | release | $RESOLVED_NOMOUNT_VERSION | $RESOLVED_NOMOUNT_COMMIT |"
            echo "| DroidSpaces | release | $RESOLVED_DROIDSPACES_VERSION | $RESOLVED_DROIDSPACES_COMMIT |"
            echo "| NTSync patch | branch | $RESOLVED_NTSYNC_VERSION | $RESOLVED_NTSYNC_COMMIT |"
            echo "| Baseband Guard | release | $RESOLVED_BBG_VERSION | $RESOLVED_BBG_COMMIT |"
            echo "| Re-Kernel | release | $RESOLVED_REKERNEL_VERSION | $RESOLVED_REKERNEL_COMMIT |"
            echo
            echo "- Snapshot SHA256: $UPSTREAM_SET_SHA256"
            echo "- 与当前 LKG 组件集完全一致: $UPSTREAMS_MATCH_LKG"
            echo "- 已变化组件: ${CHANGED_COMPONENTS:-无}"
          } >> "$GITHUB_STEP_SUMMARY"


  build:
    name: "pandora / OS4 R62 / 自定义功能"
    needs: resolve-upstreams
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: "检出仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "载入已验证 OS4 基线"
        shell: bash
        run: |
          set -euo pipefail
          source .github/config/pandora-os4-full-parity-lkg.env
          for v in LKG_DEVICE LKG_SYSTEM_BUILD LKG_KERNEL_RELEASE LKG_IMAGE_SHA256 \
                   LKG_SYMVERS_SHA256 LKG_FASTBOOT_BOOT_SHA256 LKG_FINAL_CONFIG_SHA256 \
                   LKG_IMAGE_SIZE LKG_IMAGE_BUILD_ID_PAYLOAD_OFFSET \
                   LKG_IMAGE_MODULE_CERT_OFFSET LKG_IMAGE_MODULE_CERT_LENGTH \
                   LKG_IMAGE_NORMALIZED_SHA256 LKG_MODULE_SIGNING_CERT_SHA256 \
                   LKG_BOOT_FIXTURE_GIT_BLOB_SHA1 LKG_ABI_LOCK_BASE_EXPORTS \
                   LKG_ABI_LOCK_SHA256 LKG_ABI_ALLOWED_NEW_EXPORTS; do
            printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
          done

      - name: "显示本次选择"
        shell: bash
        run: |
          cat <<'EOF'
          设备：Xiaomi 17 Pro / pandora
          系统：OS4.0.5.0.XBLCNXM
          Root：${{ inputs.root_mode }}
          SUSFS 扩展：${{ inputs.susfs_extra_features }}
          NoMount：${{ inputs.use_nomount }}
          DroidSpaces：${{ inputs.droidspaces }}
          NTSync：${{ inputs.droidspaces_ntsync }}
          BBG：${{ inputs.use_bbg }}
          Re-Kernel：${{ inputs.use_rekernel }}
          网络增强：${{ inputs.use_networking }}
          CVE 修复链：${{ inputs.use_cve }}
          BakaSU：${{ needs.resolve-upstreams.outputs.bakasu_version }} @ ${{ needs.resolve-upstreams.outputs.bakasu_commit }}
          SUSFS：${{ needs.resolve-upstreams.outputs.susfs_version }} @ ${{ needs.resolve-upstreams.outputs.susfs_commit }}
          NoMount：${{ needs.resolve-upstreams.outputs.nomount_version }} @ ${{ needs.resolve-upstreams.outputs.nomount_commit }}
          DroidSpaces：${{ needs.resolve-upstreams.outputs.droidspaces_version }} @ ${{ needs.resolve-upstreams.outputs.droidspaces_commit }}
          NTSync：${{ needs.resolve-upstreams.outputs.ntsync_version }} @ ${{ needs.resolve-upstreams.outputs.ntsync_commit }}
          BBG：${{ needs.resolve-upstreams.outputs.bbg_version }} @ ${{ needs.resolve-upstreams.outputs.bbg_commit }}
          Re-Kernel：${{ needs.resolve-upstreams.outputs.rekernel_version }} @ ${{ needs.resolve-upstreams.outputs.rekernel_commit }}
          EOF

      - name: "检查上游更新与功能漂移"
        shell: bash
        run: |
          set -euo pipefail
          REPORT="${{ runner.temp }}/xiaomi-os4-upstream-drift.txt"
          if ! bash scripts/xiaomi-os4/check-upstream-drift.sh "$REPORT"; then
            echo "::warning::上游状态检查暂时失败；不阻断本次固定 LKG 构建。"
          fi
          if [[ -s "$REPORT" ]]; then
            cat "$REPORT"
            {
              echo "## 上游状态"
              echo
              sed "s/^/- /" "$REPORT"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "静态安全门禁"
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/xiaomi-os4/build-r62-features.sh
          bash -n scripts/xiaomi-os4/apply-os3-parity-extras.sh
          bash -n scripts/xiaomi-os4/apply-os4-selected-extras.sh
          bash -n scripts/xiaomi-os4/package-validated-anykernel3.sh
          bash -n scripts/xiaomi-os4/check-upstream-drift.sh
          bash -n scripts/xiaomi-os4/fetch-compatible-bakasu-manager.sh
          bash -n scripts/xiaomi-os4/resolve-stable-upstreams.sh
          python3 -m py_compile \
            scripts/xiaomi-os4/susfs-task-mmu-compat.py \
            scripts/xiaomi-os4/repack-fastboot-boot-v4-from-fixture.py \
            scripts/xiaomi-os4/verify-lkg-image-equivalence.py \
            scripts/xiaomi-os4/describe-image-reproducibility.py
          ! grep -R -nE 'fastboot[[:space:]]+flash|dd[[:space:]].*of=/dev/block' \
            scripts/xiaomi-os4/package-validated-anykernel3.sh \
            scripts/xiaomi-os4/repack-fastboot-boot-v4-from-fixture.py

      - name: "清理 Runner 空间"
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: "安装构建依赖"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git jq libdw-dev \
            libelf-dev libssl-dev patch perl python3 rsync tar unzip xz-utils \
            zip zstd dwarves

      - name: "恢复固定 R62 源码缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/common-r62.git
          key: xiaomi-pandora-os4-common-e2b8ca7c8d05-v1

      - name: "恢复固定 r536225 工具链"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/toolchain-r536225
          key: xiaomi-pandora-os4-toolchain-r536225-verified-v1

      - name: "恢复 OS4 编译缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/ccache-r62
          key: xiaomi-pandora-os4-ccache-r62-custom-${{ needs.resolve-upstreams.outputs.snapshot_sha256 }}-${{ hashFiles('scripts/xiaomi-os4/build-r62-features.sh', 'scripts/xiaomi-os4/apply-os3-parity-extras.sh', 'scripts/xiaomi-os4/apply-os4-selected-extras.sh', 'scripts/xiaomi-os4/susfs-task-mmu-compat.py', '.github/config/xiaomi-sm8850-os4-6.12.69.env', 'security_patch/**') }}
          restore-keys: |
            xiaomi-pandora-os4-ccache-r62-lkg-
            xiaomi-pandora-os4-ccache-r62-parity-
            xiaomi-pandora-os4-ccache-r62-

      - name: "核对固定 boot fixture / ABI lock"
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE=".github/config/pandora-os4-r62-tested-boot-v4-fixture.json"
          actual_blob="$(git hash-object "$FIXTURE")"
          [[ "$actual_blob" == "$LKG_BOOT_FIXTURE_GIT_BLOB_SHA1" ]] || {
            echo "::error::boot fixture drift: $actual_blob"
            exit 1
          }
          test -s "$LKG_ABI_ALLOWED_NEW_EXPORTS"
          [[ "$(sort -u "$LKG_ABI_ALLOWED_NEW_EXPORTS" | wc -l)" -eq 51 ]] || {
            echo "::error::ABI allowed-new-export list drift"
            exit 1
          }

      - name: "按选择构建 OS4 内核"
        shell: bash
        env:
          XIAOMI_OS4_SELECTABLE_BUILD: "1"
          XIAOMI_OS4_ROOT_MODE: ${{ inputs.root_mode }}
          XIAOMI_OS4_SUSFS_EXTRA_FEATURES: ${{ inputs.susfs_extra_features && '1' || '0' }}
          XIAOMI_OS4_USE_NOMOUNT: ${{ inputs.use_nomount && '1' || '0' }}
          XIAOMI_OS4_DROIDSPACES: ${{ inputs.droidspaces == 'on' && '1' || '0' }}
          XIAOMI_OS4_USE_NTSYNC: ${{ inputs.droidspaces_ntsync && '1' || '0' }}
          XIAOMI_OS4_USE_BBG: ${{ inputs.use_bbg && '1' || '0' }}
          XIAOMI_OS4_USE_REKERNEL: ${{ inputs.use_rekernel && '1' || '0' }}
          XIAOMI_OS4_USE_NETWORKING: ${{ inputs.use_networking && '1' || '0' }}
          XIAOMI_OS4_USE_CVE: ${{ inputs.use_cve && '1' || '0' }}
          OS4_BAKASU_COMMIT: ${{ needs.resolve-upstreams.outputs.bakasu_commit }}
          OS4_BAKASU_REF: ${{ needs.resolve-upstreams.outputs.bakasu_ref }}
          OS4_BAKASU_REF_KIND: ${{ needs.resolve-upstreams.outputs.bakasu_kind }}
          OS4_SUSFS_COMMIT: ${{ needs.resolve-upstreams.outputs.susfs_commit }}
          OS4_SUSFS_BRANCH: ${{ needs.resolve-upstreams.outputs.susfs_ref }}
          OS4_SUSFS_REF_KIND: ${{ needs.resolve-upstreams.outputs.susfs_kind }}
          OS4_NOMOUNT_COMMIT: ${{ needs.resolve-upstreams.outputs.nomount_commit }}
          OS4_NOMOUNT_REF: ${{ needs.resolve-upstreams.outputs.nomount_ref }}
          OS4_NOMOUNT_REF_KIND: ${{ needs.resolve-upstreams.outputs.nomount_kind }}
          OS4_DROIDSPACES_COMMIT: ${{ needs.resolve-upstreams.outputs.droidspaces_commit }}
          OS4_DROIDSPACES_REF: ${{ needs.resolve-upstreams.outputs.droidspaces_ref }}
          OS4_DROIDSPACES_REF_KIND: ${{ needs.resolve-upstreams.outputs.droidspaces_kind }}
          OS4_NTSYNC_PATCH_COMMIT: ${{ needs.resolve-upstreams.outputs.ntsync_commit }}
          OS4_NTSYNC_PATCH_REF: ${{ needs.resolve-upstreams.outputs.ntsync_ref }}
          OS4_NTSYNC_REF_KIND: ${{ needs.resolve-upstreams.outputs.ntsync_kind }}
          OS4_BBG_COMMIT: ${{ needs.resolve-upstreams.outputs.bbg_commit }}
          OS4_BBG_REF: ${{ needs.resolve-upstreams.outputs.bbg_ref }}
          OS4_BBG_REF_KIND: ${{ needs.resolve-upstreams.outputs.bbg_kind }}
          OS4_REKERNEL_COMMIT: ${{ needs.resolve-upstreams.outputs.rekernel_commit }}
          OS4_REKERNEL_REF: ${{ needs.resolve-upstreams.outputs.rekernel_ref }}
          OS4_REKERNEL_REF_KIND: ${{ needs.resolve-upstreams.outputs.rekernel_kind }}
        run: |
          set -euo pipefail
          bash scripts/xiaomi-os4/build-r62-features.sh

      - name: "KMI / ABI 固定锁门禁"
        shell: bash
        run: |
          set -euo pipefail
          CUR="${{ runner.temp }}/xiaomi-os4-integrated/results/Module.symvers"
          OUT="${{ runner.temp }}/xiaomi-os4-integrated/results/abi-lock-check.txt"
          python3 - "$CUR" "$LKG_ABI_ALLOWED_NEW_EXPORTS" "$LKG_ABI_LOCK_BASE_EXPORTS" "$LKG_ABI_LOCK_SHA256" "$OUT" <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          cur_path, allow_path, expected_count, expected_sha, out_path = sys.argv[1:]
          allowed = {
              line.strip()
              for line in Path(allow_path).read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          entries = {}
          for line in Path(cur_path).read_text(errors="replace").splitlines():
              parts = line.split()
              if len(parts) >= 2:
                  crc, symbol = parts[0], parts[1]
                  if symbol not in allowed:
                      entries[symbol] = crc

          canonical = "".join(f"{symbol}\t{entries[symbol]}\n" for symbol in sorted(entries))
          actual_sha = hashlib.sha256(canonical.encode()).hexdigest()
          actual_count = len(entries)
          expected_count = int(expected_count)

          report = [
              f"ABI_LOCK_ALLOWED_NEW_EXPORTS={len(allowed)}",
              f"ABI_LOCK_BASE_EXPORTS_EXPECTED={expected_count}",
              f"ABI_LOCK_BASE_EXPORTS_ACTUAL={actual_count}",
              f"ABI_LOCK_SHA256_EXPECTED={expected_sha}",
              f"ABI_LOCK_SHA256_ACTUAL={actual_sha}",
          ]
          Path(out_path).write_text("\n".join(report) + "\n")
          print("\n".join(report))
          if actual_count != expected_count or actual_sha != expected_sha:
              raise SystemExit("ABI lock mismatch: baseline exports/CRCs changed")
          print("ABI_LOCK=PASS")
          PY

      - name: "识别变体并生成 fastboot boot 测试镜像"
        shell: bash
        run: |
          set -euo pipefail
          RES="${{ runner.temp }}/xiaomi-os4-integrated/results"
          OUT="${{ runner.temp }}/custom-out"
          mkdir -p "$OUT"

          python3 scripts/xiaomi-os4/describe-image-reproducibility.py "$RES/Image" \
            --output-env "$OUT/image-reproducibility.env"
          source "$OUT/image-reproducibility.env"

          IMAGE_SHA="$(sha256sum "$RES/Image" | awk '{print $1}')"
          SYMVERS_SHA="$(sha256sum "$RES/Module.symvers" | awk '{print $1}')"
          CONFIG_SHA="$(sha256sum "$RES/final.config" | awk '{print $1}')"
          RELEASE="$(sed -n 's/^KERNEL_RELEASE=//p' "$RES/build-metadata.txt")"
          FULL_SELECTION="$(sed -n 's/^EXACT_LKG_SELECTION=//p' "$RES/build-metadata.txt")"
          BAKASU_COMMIT="$(sed -n 's/^BAKASU_COMMIT=//p' "$RES/build-metadata.txt")"
          BAKASU_TREE_EQ="$(sed -n 's/^BAKASU_KERNEL_TREE_EQUIVALENT=//p' "$RES/build-metadata.txt")"
          [[ -n "$RELEASE" && ( "$FULL_SELECTION" == "0" || "$FULL_SELECTION" == "1" ) ]] || {
            echo "::error::无法识别构建变体"; exit 1;
          }
          [[ -n "$BAKASU_COMMIT" && ( "$BAKASU_TREE_EQ" == "0" || "$BAKASU_TREE_EQ" == "1" ) ]] || {
            echo "::error::无法识别 BakaSU main 身份"; exit 1;
          }

          BYTE_EXACT_LKG=0
          LKG_EQUIVALENCE="NOT_APPLICABLE"
          if [[ "$FULL_SELECTION" == "1" ]]; then
            [[ "$SYMVERS_SHA" == "$LKG_SYMVERS_SHA256" ]] || {
              echo "::error::默认 Full Parity 的 Module.symvers 漂移"; exit 1;
            }
            [[ "$CONFIG_SHA" == "$LKG_FINAL_CONFIG_SHA256" ]] || {
              echo "::error::默认 Full Parity 的 final.config 漂移"; exit 1;
            }
            [[ "$RELEASE" == "$LKG_KERNEL_RELEASE" ]] || {
              echo "::error::默认 Full Parity kernel release 漂移"; exit 1;
            }

            python3 scripts/xiaomi-os4/verify-lkg-image-equivalence.py "$RES/Image" \
              --expected-size "$LKG_IMAGE_SIZE" \
              --build-id-payload-offset "$LKG_IMAGE_BUILD_ID_PAYLOAD_OFFSET" \
              --cert-offset "$LKG_IMAGE_MODULE_CERT_OFFSET" \
              --cert-length "$LKG_IMAGE_MODULE_CERT_LENGTH" \
              --expected-normalized-sha256 "$LKG_IMAGE_NORMALIZED_SHA256" \
              | tee "$OUT/lkg-image-equivalence.txt"
            LKG_EQUIVALENCE=PASS

            if [[ "$IMAGE_SHA" == "$LKG_IMAGE_SHA256" ]]; then
              BYTE_EXACT_LKG=1
              BOOT_NAME="pandora-OS4-R62-FULL-PARITY-LKG-FASTBOOT-BOOT-ONLY.img"
            else
              BOOT_NAME="pandora-OS4-R62-FULL-PARITY-REBUILD-run-${GITHUB_RUN_ID}-FASTBOOT-BOOT-ONLY.img"
            fi
          else
            BOOT_NAME="pandora-OS4-R62-CUSTOM-run-${GITHUB_RUN_ID}-FASTBOOT-BOOT-ONLY.img"
          fi

          REPACK_ARGS=(
            .github/config/pandora-os4-r62-tested-boot-v4-fixture.json
            "$RES/Image"
            "$OUT/$BOOT_NAME"
            --expected-image-sha256 "$IMAGE_SHA"
            --expected-release "$RELEASE"
            --expected-build "$LKG_SYSTEM_BUILD"
          )
          if [[ "$BYTE_EXACT_LKG" == "1" ]]; then
            REPACK_ARGS+=(--expected-output-sha256 "$LKG_FASTBOOT_BOOT_SHA256")
          fi
          python3 scripts/xiaomi-os4/repack-fastboot-boot-v4-from-fixture.py "${REPACK_ARGS[@]}" \
            | tee "$OUT/fastboot-repack-report.txt"

          BOOT_SHA="$(sha256sum "$OUT/$BOOT_NAME" | awk '{print $1}')"

          {
            echo "ACTUAL_IMAGE_SHA256=$IMAGE_SHA"
            echo "ACTUAL_IMAGE_SIZE=$IMAGE_SIZE"
            echo "ACTUAL_IMAGE_BUILD_ID_PAYLOAD_OFFSET=$IMAGE_BUILD_ID_PAYLOAD_OFFSET"
            echo "ACTUAL_IMAGE_MODULE_CERT_OFFSET=$IMAGE_MODULE_CERT_OFFSET"
            echo "ACTUAL_IMAGE_MODULE_CERT_LENGTH=$IMAGE_MODULE_CERT_LENGTH"
            echo "ACTUAL_IMAGE_NORMALIZED_SHA256=$NORMALIZED_IMAGE_SHA256"
            echo "ACTUAL_MODULE_SIGNING_CERT_SHA256=$MODULE_SIGNING_CERT_SHA256"
            echo "ACTUAL_SYMVERS_SHA256=$SYMVERS_SHA"
            echo "ACTUAL_CONFIG_SHA256=$CONFIG_SHA"
            echo "ACTUAL_KERNEL_RELEASE=$RELEASE"
            echo "ACTUAL_BAKASU_COMMIT=$BAKASU_COMMIT"
            echo "ACTUAL_BAKASU_KERNEL_TREE_EQUIVALENT=$BAKASU_TREE_EQ"
            echo "FULL_PARITY_SELECTION=$FULL_SELECTION"
            echo "LKG_NORMALIZED_EQUIVALENCE=$LKG_EQUIVALENCE"
            echo "BYTE_EXACT_LKG=$BYTE_EXACT_LKG"
            echo "BOOT_NAME=$BOOT_NAME"
            echo "BOOT_SHA256=$BOOT_SHA"
          } >> "$GITHUB_ENV"

      - name: "生成 AnyKernel3（按验证等级标记）"
        shell: bash
        run: |
          set -euo pipefail
          RES="${{ runner.temp }}/xiaomi-os4-integrated/results"
          OUT="${{ runner.temp }}/custom-out"

          if [[ "$BYTE_EXACT_LKG" == "1" ]]; then
            AK3_MODE="validated-lkg"
          elif [[ "$FULL_PARITY_SELECTION" == "1" ]]; then
            AK3_MODE="full-parity-rebuild"
          else
            AK3_MODE="custom"
          fi

          XIAOMI_AK3_MODE="$AK3_MODE" \
          XIAOMI_AK3_RELEASE="$ACTUAL_KERNEL_RELEASE" \
            bash scripts/xiaomi-os4/package-validated-anykernel3.sh "$RES/Image" "$OUT" \
              | tee "$OUT/package-report.txt"

          ANYKERNEL3_PATH="$(find "$OUT" -maxdepth 1 -type f -name '*AnyKernel3.zip' -print -quit)"
          [[ -n "$ANYKERNEL3_PATH" && -s "$ANYKERNEL3_PATH" ]] || {
            echo "::error::AnyKernel3 package missing"
            exit 1
          }
          ANYKERNEL3_NAME="$(basename "$ANYKERNEL3_PATH")"
          ANYKERNEL3_SHA="$(sha256sum "$ANYKERNEL3_PATH" | awk '{print $1}')"

          {
            echo "ANYKERNEL3_MODE=$AK3_MODE"
            echo "ANYKERNEL3_NAME=$ANYKERNEL3_NAME"
            echo "ANYKERNEL3_SHA256=$ANYKERNEL3_SHA"
          } >> "$GITHUB_ENV"

      - name: "整理产物与选择清单"
        shell: bash
        run: |
          set -euo pipefail
          RES="${{ runner.temp }}/xiaomi-os4-integrated/results"
          OUT="${{ runner.temp }}/custom-out"
          cp "$RES/Image" "$OUT/Image"
          cp "$RES/Module.symvers" "$OUT/Module.symvers"
          cp "$RES/final.config" "$OUT/final.config"
          cp "$RES/build-metadata.txt" "$OUT/build-metadata.txt"
          cp "$RES/abi-lock-check.txt" "$OUT/abi-lock-check.txt"
          cp "$RES/os3-parity-source.env" "$OUT/" 2>/dev/null || true
          cp "$RES/os3-parity-config-result.txt" "$OUT/" 2>/dev/null || true
          cp "$RES/os4-selected-source.env" "$OUT/" 2>/dev/null || true
          cp "$RES/os4-selected-config-result.txt" "$OUT/" 2>/dev/null || true
          cat > "$OUT/resolved-upstreams.env" <<'EOF'
          RESOLVED_BAKASU_KIND=${{ needs.resolve-upstreams.outputs.bakasu_kind }}
          RESOLVED_BAKASU_REF=${{ needs.resolve-upstreams.outputs.bakasu_ref }}
          RESOLVED_BAKASU_VERSION=${{ needs.resolve-upstreams.outputs.bakasu_version }}
          RESOLVED_BAKASU_COMMIT=${{ needs.resolve-upstreams.outputs.bakasu_commit }}
          RESOLVED_SUSFS_KIND=${{ needs.resolve-upstreams.outputs.susfs_kind }}
          RESOLVED_SUSFS_REF=${{ needs.resolve-upstreams.outputs.susfs_ref }}
          RESOLVED_SUSFS_VERSION=${{ needs.resolve-upstreams.outputs.susfs_version }}
          RESOLVED_SUSFS_COMMIT=${{ needs.resolve-upstreams.outputs.susfs_commit }}
          RESOLVED_NOMOUNT_KIND=${{ needs.resolve-upstreams.outputs.nomount_kind }}
          RESOLVED_NOMOUNT_REF=${{ needs.resolve-upstreams.outputs.nomount_ref }}
          RESOLVED_NOMOUNT_VERSION=${{ needs.resolve-upstreams.outputs.nomount_version }}
          RESOLVED_NOMOUNT_COMMIT=${{ needs.resolve-upstreams.outputs.nomount_commit }}
          RESOLVED_DROIDSPACES_KIND=${{ needs.resolve-upstreams.outputs.droidspaces_kind }}
          RESOLVED_DROIDSPACES_REF=${{ needs.resolve-upstreams.outputs.droidspaces_ref }}
          RESOLVED_DROIDSPACES_VERSION=${{ needs.resolve-upstreams.outputs.droidspaces_version }}
          RESOLVED_DROIDSPACES_COMMIT=${{ needs.resolve-upstreams.outputs.droidspaces_commit }}
          RESOLVED_NTSYNC_KIND=${{ needs.resolve-upstreams.outputs.ntsync_kind }}
          RESOLVED_NTSYNC_REF=${{ needs.resolve-upstreams.outputs.ntsync_ref }}
          RESOLVED_NTSYNC_VERSION=${{ needs.resolve-upstreams.outputs.ntsync_version }}
          RESOLVED_NTSYNC_COMMIT=${{ needs.resolve-upstreams.outputs.ntsync_commit }}
          RESOLVED_BBG_KIND=${{ needs.resolve-upstreams.outputs.bbg_kind }}
          RESOLVED_BBG_REF=${{ needs.resolve-upstreams.outputs.bbg_ref }}
          RESOLVED_BBG_VERSION=${{ needs.resolve-upstreams.outputs.bbg_version }}
          RESOLVED_BBG_COMMIT=${{ needs.resolve-upstreams.outputs.bbg_commit }}
          RESOLVED_REKERNEL_KIND=${{ needs.resolve-upstreams.outputs.rekernel_kind }}
          RESOLVED_REKERNEL_REF=${{ needs.resolve-upstreams.outputs.rekernel_ref }}
          RESOLVED_REKERNEL_VERSION=${{ needs.resolve-upstreams.outputs.rekernel_version }}
          RESOLVED_REKERNEL_COMMIT=${{ needs.resolve-upstreams.outputs.rekernel_commit }}
          UPSTREAMS_MATCH_LKG=${{ needs.resolve-upstreams.outputs.match_lkg }}
          CHANGED_COMPONENTS=${{ needs.resolve-upstreams.outputs.changed_components }}
          UPSTREAM_SET_SHA256=${{ needs.resolve-upstreams.outputs.snapshot_sha256 }}
EOF

          {
            echo "DEVICE=pandora"
            echo "SYSTEM_BUILD=OS4.0.5.0.XBLCNXM"
            echo "REQUEST_ROOT_MODE=${{ inputs.root_mode }}"
            echo "REQUEST_SUSFS_EXTRA=${{ inputs.susfs_extra_features }}"
            echo "REQUEST_NOMOUNT=${{ inputs.use_nomount }}"
            echo "REQUEST_DROIDSPACES=${{ inputs.droidspaces }}"
            echo "REQUEST_NTSYNC=${{ inputs.droidspaces_ntsync }}"
            echo "REQUEST_BBG=${{ inputs.use_bbg }}"
            echo "REQUEST_REKERNEL=${{ inputs.use_rekernel }}"
            echo "REQUEST_NETWORKING=${{ inputs.use_networking }}"
            echo "REQUEST_CVE=${{ inputs.use_cve }}"
            echo "UPSTREAM_SET_SHA256=${{ needs.resolve-upstreams.outputs.snapshot_sha256 }}"
            echo "UPSTREAMS_MATCH_LKG=${{ needs.resolve-upstreams.outputs.match_lkg }}"
            echo "UPSTREAM_CHANGED_COMPONENTS=${{ needs.resolve-upstreams.outputs.changed_components }}"
            echo "BAKASU_MAIN_COMMIT=$ACTUAL_BAKASU_COMMIT"
            echo "BAKASU_KERNEL_TREE_EQUIVALENT=$ACTUAL_BAKASU_KERNEL_TREE_EQUIVALENT"
            echo "KERNEL_RELEASE=$ACTUAL_KERNEL_RELEASE"
            echo "IMAGE_SHA256=$ACTUAL_IMAGE_SHA256"
            echo "IMAGE_SIZE=$ACTUAL_IMAGE_SIZE"
            echo "IMAGE_BUILD_ID_PAYLOAD_OFFSET=$ACTUAL_IMAGE_BUILD_ID_PAYLOAD_OFFSET"
            echo "IMAGE_MODULE_CERT_OFFSET=$ACTUAL_IMAGE_MODULE_CERT_OFFSET"
            echo "IMAGE_MODULE_CERT_LENGTH=$ACTUAL_IMAGE_MODULE_CERT_LENGTH"
            echo "IMAGE_NORMALIZED_SHA256=$ACTUAL_IMAGE_NORMALIZED_SHA256"
            echo "MODULE_SIGNING_CERT_SHA256=$ACTUAL_MODULE_SIGNING_CERT_SHA256"
            echo "CONFIG_SHA256=$ACTUAL_CONFIG_SHA256"
            echo "SYMVERS_SHA256=$ACTUAL_SYMVERS_SHA256"
            echo "FASTBOOT_BOOT=$BOOT_NAME"
            echo "FASTBOOT_BOOT_SHA256=$BOOT_SHA256"
            echo "FULL_PARITY_SELECTION=$FULL_PARITY_SELECTION"
            echo "LKG_NORMALIZED_EQUIVALENCE=$LKG_NORMALIZED_EQUIVALENCE"
            echo "BYTE_EXACT_LKG=$BYTE_EXACT_LKG"
            echo "ANYKERNEL3_MODE=$ANYKERNEL3_MODE"
            echo "ANYKERNEL3=$ANYKERNEL3_NAME"
            echo "ANYKERNEL3_SHA256=$ANYKERNEL3_SHA256"
            if [[ "$BYTE_EXACT_LKG" == "1" ]]; then
              echo "SAFETY=VERIFIED_BYTE_EXACT_LKG"
            elif [[ "$FULL_PARITY_SELECTION" == "1" ]]; then
              echo "SAFETY=VERIFIED_FULL_PARITY_REBUILD"
            else
              echo "SAFETY=CUSTOM_UNVERIFIED_PERSISTENT_PACKAGE"
            fi
          } > "$OUT/selection-manifest.txt"

          (
            cd "$OUT"
            sha256sum Image Module.symvers "$BOOT_NAME" "$ANYKERNEL3_NAME" > SHA256SUMS.txt
          )

      - name: "上传自定义构建"
        uses: actions/upload-artifact@v6
        with:
          name: pandora-OS4-R62-CUSTOM-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/custom-out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: "构建摘要"
        shell: bash
        run: |
          {
            echo "## Xiaomi 17 Pro OS4 自定义内核"
            echo
            echo "- Kernel: `$ACTUAL_KERNEL_RELEASE`"
            echo "- 上游快照 SHA256: \`${{ needs.resolve-upstreams.outputs.snapshot_sha256 }}\`"
            echo "- 相比当前 LKG 已变化组件: \`${{ needs.resolve-upstreams.outputs.changed_components }}\`"
            echo "- BakaSU: \`$ACTUAL_BAKASU_COMMIT\`"
            echo "- BakaSU kernel/ tree 与已验证参考相同: \`$ACTUAL_BAKASU_KERNEL_TREE_EQUIVALENT\`"
            echo "- Image SHA256: `$ACTUAL_IMAGE_SHA256`"
            echo "- normalized Image SHA256: `$ACTUAL_IMAGE_NORMALIZED_SHA256`"
            echo "- fastboot boot SHA256: `$BOOT_SHA256`"
            echo "- AnyKernel3: `$ANYKERNEL3_NAME`"
            echo "- AnyKernel3 SHA256: `$ANYKERNEL3_SHA256`"
            echo "- 是否仍符合已验证 Full Parity LKG 身份: \`$FULL_PARITY_SELECTION\`"
            echo "- normalized LKG 等价校验: `$LKG_NORMALIZED_EQUIVALENCE`"
            echo "- 是否字节级等于历史 LKG: `$BYTE_EXACT_LKG`"
            echo
            if [[ "$BYTE_EXACT_LKG" == "1" ]]; then
              echo "本次构建字节级等于历史真机 LKG，已生成已验证 AnyKernel3。"
            elif [[ "$FULL_PARITY_SELECTION" == "1" ]]; then
              echo "默认 Full Parity 配置、ABI 与 normalized Image 均与 LKG 等价，且该重建路径已完成 Xiaomi 17 Pro OS4 真机临时启动验证。"
              echo "**已生成可持久化使用的 Full Parity AnyKernel3。**"
            else
              echo "**已按选择生成 CUSTOM-UNVERIFIED AnyKernel3；该精确功能组合尚未完成真机启动验证，请保留已知可启动 boot 作为恢复基线。**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


  bakasu-manager:
    name: "BakaSU Manager / 与本次稳定快照内核同提交"
    needs: resolve-upstreams
    if: ${{ inputs.root_mode != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: "检出仓库"
        uses: actions/checkout@v7

      - name: "安装 Manager 获取依赖"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl git jq unzip

      - name: "获取与本次 BakaSU main 完全同提交的 Manager"
        id: manager
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/xiaomi-os4/fetch-compatible-bakasu-manager.sh \
            "${{ runner.temp }}/bakasu-manager" \
            "${{ needs.resolve-upstreams.outputs.bakasu_commit }}"

      - name: "Manager 获取失败提示"
        if: steps.manager.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::BakaSU Manager 获取失败；内核构建与 AnyKernel3 不受影响。"
          {
            echo "## BakaSU Manager"
            echo
            echo "Manager 获取失败；本次仍可使用内核 / AnyKernel3 产物。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "上传 BakaSU Manager"
        if: steps.manager.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: BakaSU-Manager-pandora-OS4-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bakasu-manager/*.apk
            ${{ runner.temp }}/bakasu-manager/manager-metadata.txt
            ${{ runner.temp }}/bakasu-manager/MANAGER-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: "BakaSU Manager 摘要"
        if: steps.manager.outcome == 'success'
        shell: bash
        run: |
          OUT="${{ runner.temp }}/bakasu-manager"
          {
            echo "## BakaSU Manager"
            echo
            sed "s/^/- /" "$OUT/manager-metadata.txt"
            sed "s/^/- SHA256: /" "$OUT/MANAGER-SHA256SUMS.txt"
            echo
            echo "Manager 与本次内核使用同一个 BakaSU main 提交，不允许版本错位。"
          } >> "$GITHUB_STEP_SUMMARY"
