name: "小米17 Pro OS4 / 自定义内核"

on:
  workflow_dispatch:
    inputs:
      root_mode:
        description: "Root / SUSFS 模式"
        required: true
        type: choice
        options:
          - bakasu-susfs
          - bakasu
          - none
        default: bakasu-susfs
      susfs_extra_features:
        description: "SUSFS 扩展功能（SPOOF/HIDE/OPEN_REDIRECT/SUS_MAP，推荐）"
        required: true
        type: boolean
        default: true
      use_nomount:
        description: "NoMount VFS 注入"
        required: true
        type: boolean
        default: true
      droidspaces:
        description: "DroidSpaces 完整支持（含安全 PIDs 方案 / namespace / Macvlan / IPv6 NAT）"
        required: true
        type: choice
        options:
          - "on"
          - "off"
        default: "on"
      droidspaces_ntsync:
        description: "NTSync（Wine/Windows 同步，可独立于 DroidSpaces 开启）"
        required: true
        type: boolean
        default: true
      use_bbg:
        description: "Baseband Guard（BBG）"
        required: true
        type: boolean
        default: true
      use_rekernel:
        description: "Re-Kernel 11.7 + Generic Netlink"
        required: true
        type: boolean
        default: true
      use_networking:
        description: "网络增强（BBR/IPSet/FQ/FQ_CODEL/CAKE/WireGuard/CIFS）"
        required: true
        type: boolean
        default: true
      use_cve:
        description: "CVE-2026-43499 / CVE-2026-53163 修复链审计/必要时回补"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: xiaomi-os4-pandora-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "pandora / OS4 R62 / 自定义功能"
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: "检出仓库"
        uses: actions/checkout@v7

      - name: "载入已验证 OS4 基线"
        shell: bash
        run: |
          set -euo pipefail
          source .github/config/pandora-os4-full-parity-lkg.env
          for v in LKG_DEVICE LKG_SYSTEM_BUILD LKG_KERNEL_RELEASE LKG_IMAGE_SHA256 \
                   LKG_SYMVERS_SHA256 LKG_FASTBOOT_BOOT_SHA256 LKG_FINAL_CONFIG_SHA256 \
                   LKG_IMAGE_SIZE LKG_IMAGE_BUILD_ID_PAYLOAD_OFFSET \
                   LKG_IMAGE_MODULE_CERT_OFFSET LKG_IMAGE_MODULE_CERT_LENGTH \
                   LKG_IMAGE_NORMALIZED_SHA256 LKG_MODULE_SIGNING_CERT_SHA256 \
                   LKG_BOOT_FIXTURE_GIT_BLOB_SHA1 LKG_ABI_LOCK_BASE_EXPORTS \
                   LKG_ABI_LOCK_SHA256 LKG_ABI_ALLOWED_NEW_EXPORTS; do
            printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
          done

      - name: "显示本次选择"
        shell: bash
        run: |
          cat <<'EOF'
          设备：Xiaomi 17 Pro / pandora
          系统：OS4.0.5.0.XBLCNXM
          Root：${{ inputs.root_mode }}
          SUSFS 扩展：${{ inputs.susfs_extra_features }}
          NoMount：${{ inputs.use_nomount }}
          DroidSpaces：${{ inputs.droidspaces }}
          NTSync：${{ inputs.droidspaces_ntsync }}
          BBG：${{ inputs.use_bbg }}
          Re-Kernel：${{ inputs.use_rekernel }}
          网络增强：${{ inputs.use_networking }}
          CVE 修复链：${{ inputs.use_cve }}
          EOF

      - name: "静态安全门禁"
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/xiaomi-os4/build-r62-features.sh
          bash -n scripts/xiaomi-os4/apply-os3-parity-extras.sh
          bash -n scripts/xiaomi-os4/apply-os4-selected-extras.sh
          bash -n scripts/xiaomi-os4/package-validated-anykernel3.sh
          python3 -m py_compile \
            scripts/xiaomi-os4/susfs-task-mmu-compat.py \
            scripts/xiaomi-os4/repack-fastboot-boot-v4-from-fixture.py \
            scripts/xiaomi-os4/verify-lkg-image-equivalence.py
          ! grep -R -nE 'fastboot[[:space:]]+flash|dd[[:space:]].*of=/dev/block' \
            scripts/xiaomi-os4/package-validated-anykernel3.sh \
            scripts/xiaomi-os4/repack-fastboot-boot-v4-from-fixture.py

      - name: "清理 Runner 空间"
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: "安装构建依赖"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git jq libdw-dev \
            libelf-dev libssl-dev patch perl python3 rsync tar unzip xz-utils \
            zip zstd dwarves

      - name: "恢复固定 R62 源码缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/common-r62.git
          key: xiaomi-pandora-os4-common-e2b8ca7c8d05-v1

      - name: "恢复固定 r536225 工具链"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/toolchain-r536225
          key: xiaomi-pandora-os4-toolchain-r536225-verified-v1

      - name: "恢复 OS4 编译缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/ccache-r62
          key: xiaomi-pandora-os4-ccache-r62-custom-${{ hashFiles('scripts/xiaomi-os4/build-r62-features.sh', 'scripts/xiaomi-os4/apply-os3-parity-extras.sh', 'scripts/xiaomi-os4/apply-os4-selected-extras.sh', 'scripts/xiaomi-os4/susfs-task-mmu-compat.py', '.github/config/xiaomi-sm8850-os4-6.12.69.env', 'security_patch/**') }}
          restore-keys: |
            xiaomi-pandora-os4-ccache-r62-lkg-
            xiaomi-pandora-os4-ccache-r62-parity-
            xiaomi-pandora-os4-ccache-r62-

      - name: "核对固定 boot fixture / ABI lock"
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE=".github/config/pandora-os4-r62-tested-boot-v4-fixture.json"
          actual_blob="$(git hash-object "$FIXTURE")"
          [[ "$actual_blob" == "$LKG_BOOT_FIXTURE_GIT_BLOB_SHA1" ]] || {
            echo "::error::boot fixture drift: $actual_blob"
            exit 1
          }
          test -s "$LKG_ABI_ALLOWED_NEW_EXPORTS"
          [[ "$(sort -u "$LKG_ABI_ALLOWED_NEW_EXPORTS" | wc -l)" -eq 51 ]] || {
            echo "::error::ABI allowed-new-export list drift"
            exit 1
          }

      - name: "按选择构建 OS4 内核"
        shell: bash
        env:
          XIAOMI_OS4_SELECTABLE_BUILD: "1"
          XIAOMI_OS4_ROOT_MODE: ${{ inputs.root_mode }}
          XIAOMI_OS4_SUSFS_EXTRA_FEATURES: ${{ inputs.susfs_extra_features && '1' || '0' }}
          XIAOMI_OS4_USE_NOMOUNT: ${{ inputs.use_nomount && '1' || '0' }}
          XIAOMI_OS4_DROIDSPACES: ${{ inputs.droidspaces == 'on' && '1' || '0' }}
          XIAOMI_OS4_USE_NTSYNC: ${{ inputs.droidspaces_ntsync && '1' || '0' }}
          XIAOMI_OS4_USE_BBG: ${{ inputs.use_bbg && '1' || '0' }}
          XIAOMI_OS4_USE_REKERNEL: ${{ inputs.use_rekernel && '1' || '0' }}
          XIAOMI_OS4_USE_NETWORKING: ${{ inputs.use_networking && '1' || '0' }}
          XIAOMI_OS4_USE_CVE: ${{ inputs.use_cve && '1' || '0' }}
        run: |
          set -euo pipefail
          bash scripts/xiaomi-os4/build-r62-features.sh

      - name: "KMI / ABI 固定锁门禁"
        shell: bash
        run: |
          set -euo pipefail
          CUR="${{ runner.temp }}/xiaomi-os4-integrated/results/Module.symvers"
          OUT="${{ runner.temp }}/xiaomi-os4-integrated/results/abi-lock-check.txt"
          python3 - "$CUR" "$LKG_ABI_ALLOWED_NEW_EXPORTS" "$LKG_ABI_LOCK_BASE_EXPORTS" "$LKG_ABI_LOCK_SHA256" "$OUT" <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          cur_path, allow_path, expected_count, expected_sha, out_path = sys.argv[1:]
          allowed = {
              line.strip()
              for line in Path(allow_path).read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          entries = {}
          for line in Path(cur_path).read_text(errors="replace").splitlines():
              parts = line.split()
              if len(parts) >= 2:
                  crc, symbol = parts[0], parts[1]
                  if symbol not in allowed:
                      entries[symbol] = crc

          canonical = "".join(f"{symbol}\t{entries[symbol]}\n" for symbol in sorted(entries))
          actual_sha = hashlib.sha256(canonical.encode()).hexdigest()
          actual_count = len(entries)
          expected_count = int(expected_count)

          report = [
              f"ABI_LOCK_ALLOWED_NEW_EXPORTS={len(allowed)}",
              f"ABI_LOCK_BASE_EXPORTS_EXPECTED={expected_count}",
              f"ABI_LOCK_BASE_EXPORTS_ACTUAL={actual_count}",
              f"ABI_LOCK_SHA256_EXPECTED={expected_sha}",
              f"ABI_LOCK_SHA256_ACTUAL={actual_sha}",
          ]
          Path(out_path).write_text("\n".join(report) + "\n")
          print("\n".join(report))
          if actual_count != expected_count or actual_sha != expected_sha:
              raise SystemExit("ABI lock mismatch: baseline exports/CRCs changed")
          print("ABI_LOCK=PASS")
          PY

      - name: "识别变体并生成 fastboot boot 测试镜像"
        shell: bash
        run: |
          set -euo pipefail
          RES="${{ runner.temp }}/xiaomi-os4-integrated/results"
          OUT="${{ runner.temp }}/custom-out"
          mkdir -p "$OUT"

          IMAGE_SHA="$(sha256sum "$RES/Image" | awk '{print $1}')"
          SYMVERS_SHA="$(sha256sum "$RES/Module.symvers" | awk '{print $1}')"
          CONFIG_SHA="$(sha256sum "$RES/final.config" | awk '{print $1}')"
          RELEASE="$(sed -n 's/^KERNEL_RELEASE=//p' "$RES/build-metadata.txt")"
          FULL_SELECTION="$(sed -n 's/^EXACT_LKG_SELECTION=//p' "$RES/build-metadata.txt")"
          [[ -n "$RELEASE" && ( "$FULL_SELECTION" == "0" || "$FULL_SELECTION" == "1" ) ]] || {
            echo "::error::无法识别构建变体"; exit 1;
          }

          BYTE_EXACT_LKG=0
          LKG_EQUIVALENCE="NOT_APPLICABLE"
          if [[ "$FULL_SELECTION" == "1" ]]; then
            [[ "$SYMVERS_SHA" == "$LKG_SYMVERS_SHA256" ]] || {
              echo "::error::默认 Full Parity 的 Module.symvers 漂移"; exit 1;
            }
            [[ "$CONFIG_SHA" == "$LKG_FINAL_CONFIG_SHA256" ]] || {
              echo "::error::默认 Full Parity 的 final.config 漂移"; exit 1;
            }
            [[ "$RELEASE" == "$LKG_KERNEL_RELEASE" ]] || {
              echo "::error::默认 Full Parity kernel release 漂移"; exit 1;
            }

            python3 scripts/xiaomi-os4/verify-lkg-image-equivalence.py "$RES/Image" \
              --expected-size "$LKG_IMAGE_SIZE" \
              --build-id-payload-offset "$LKG_IMAGE_BUILD_ID_PAYLOAD_OFFSET" \
              --cert-offset "$LKG_IMAGE_MODULE_CERT_OFFSET" \
              --cert-length "$LKG_IMAGE_MODULE_CERT_LENGTH" \
              --expected-normalized-sha256 "$LKG_IMAGE_NORMALIZED_SHA256" \
              | tee "$OUT/lkg-image-equivalence.txt"
            LKG_EQUIVALENCE=PASS

            if [[ "$IMAGE_SHA" == "$LKG_IMAGE_SHA256" ]]; then
              BYTE_EXACT_LKG=1
              BOOT_NAME="pandora-OS4-R62-FULL-PARITY-LKG-FASTBOOT-BOOT-ONLY.img"
            else
              BOOT_NAME="pandora-OS4-R62-FULL-PARITY-REBUILD-run-${GITHUB_RUN_ID}-FASTBOOT-BOOT-ONLY.img"
            fi
          else
            BOOT_NAME="pandora-OS4-R62-CUSTOM-run-${GITHUB_RUN_ID}-FASTBOOT-BOOT-ONLY.img"
          fi

          REPACK_ARGS=(
            .github/config/pandora-os4-r62-tested-boot-v4-fixture.json
            "$RES/Image"
            "$OUT/$BOOT_NAME"
            --expected-image-sha256 "$IMAGE_SHA"
            --expected-release "$RELEASE"
            --expected-build "$LKG_SYSTEM_BUILD"
          )
          if [[ "$BYTE_EXACT_LKG" == "1" ]]; then
            REPACK_ARGS+=(--expected-output-sha256 "$LKG_FASTBOOT_BOOT_SHA256")
          fi
          python3 scripts/xiaomi-os4/repack-fastboot-boot-v4-from-fixture.py "${REPACK_ARGS[@]}" \
            | tee "$OUT/fastboot-repack-report.txt"

          BOOT_SHA="$(sha256sum "$OUT/$BOOT_NAME" | awk '{print $1}')"

          {
            echo "ACTUAL_IMAGE_SHA256=$IMAGE_SHA"
            echo "ACTUAL_SYMVERS_SHA256=$SYMVERS_SHA"
            echo "ACTUAL_CONFIG_SHA256=$CONFIG_SHA"
            echo "ACTUAL_KERNEL_RELEASE=$RELEASE"
            echo "FULL_PARITY_SELECTION=$FULL_SELECTION"
            echo "LKG_NORMALIZED_EQUIVALENCE=$LKG_EQUIVALENCE"
            echo "BYTE_EXACT_LKG=$BYTE_EXACT_LKG"
            echo "BOOT_NAME=$BOOT_NAME"
            echo "BOOT_SHA256=$BOOT_SHA"
          } >> "$GITHUB_ENV"

      - name: "持久化包保护门禁"
        shell: bash
        run: |
          set -euo pipefail
          RES="${{ runner.temp }}/xiaomi-os4-integrated/results"
          OUT="${{ runner.temp }}/custom-out"
          if [[ "$BYTE_EXACT_LKG" == "1" ]]; then
            bash scripts/xiaomi-os4/package-validated-anykernel3.sh "$RES/Image" "$OUT" \
              | tee "$OUT/package-report.txt"
          elif [[ "$FULL_PARITY_SELECTION" == "1" ]]; then
            echo "Full Parity 功能/ABI/配置与 LKG 等价，但本次模块签名证书与 GNU build-id 为新生成值。"
            echo "在新的 normalized-equivalent Image 完成一次真机 fastboot boot 验证前，不生成持久化 AnyKernel3。"
          else
            echo "自定义组合尚未真机验证：不生成 AnyKernel3。"
          fi

      - name: "整理产物与选择清单"
        shell: bash
        run: |
          set -euo pipefail
          RES="${{ runner.temp }}/xiaomi-os4-integrated/results"
          OUT="${{ runner.temp }}/custom-out"
          cp "$RES/Image" "$OUT/Image"
          cp "$RES/Module.symvers" "$OUT/Module.symvers"
          cp "$RES/final.config" "$OUT/final.config"
          cp "$RES/build-metadata.txt" "$OUT/build-metadata.txt"
          cp "$RES/abi-lock-check.txt" "$OUT/abi-lock-check.txt"
          cp "$RES/os3-parity-source.env" "$OUT/" 2>/dev/null || true
          cp "$RES/os3-parity-config-result.txt" "$OUT/" 2>/dev/null || true
          cp "$RES/os4-selected-source.env" "$OUT/" 2>/dev/null || true
          cp "$RES/os4-selected-config-result.txt" "$OUT/" 2>/dev/null || true

          {
            echo "DEVICE=pandora"
            echo "SYSTEM_BUILD=OS4.0.5.0.XBLCNXM"
            echo "REQUEST_ROOT_MODE=${{ inputs.root_mode }}"
            echo "REQUEST_SUSFS_EXTRA=${{ inputs.susfs_extra_features }}"
            echo "REQUEST_NOMOUNT=${{ inputs.use_nomount }}"
            echo "REQUEST_DROIDSPACES=${{ inputs.droidspaces }}"
            echo "REQUEST_NTSYNC=${{ inputs.droidspaces_ntsync }}"
            echo "REQUEST_BBG=${{ inputs.use_bbg }}"
            echo "REQUEST_REKERNEL=${{ inputs.use_rekernel }}"
            echo "REQUEST_NETWORKING=${{ inputs.use_networking }}"
            echo "REQUEST_CVE=${{ inputs.use_cve }}"
            echo "KERNEL_RELEASE=$ACTUAL_KERNEL_RELEASE"
            echo "IMAGE_SHA256=$ACTUAL_IMAGE_SHA256"
            echo "SYMVERS_SHA256=$ACTUAL_SYMVERS_SHA256"
            echo "FASTBOOT_BOOT=$BOOT_NAME"
            echo "FASTBOOT_BOOT_SHA256=$BOOT_SHA256"
            echo "FULL_PARITY_SELECTION=$FULL_PARITY_SELECTION"
            echo "LKG_NORMALIZED_EQUIVALENCE=$LKG_NORMALIZED_EQUIVALENCE"
            echo "BYTE_EXACT_LKG=$BYTE_EXACT_LKG"
            if [[ "$BYTE_EXACT_LKG" == "1" ]]; then
              echo "PERSISTENT_PACKAGE=VERIFIED_LKG_ANYKERNEL3_INCLUDED"
              echo "SAFETY=VERIFIED_PERSISTENT_LKG"
            elif [[ "$FULL_PARITY_SELECTION" == "1" ]]; then
              echo "PERSISTENT_PACKAGE=NOT_GENERATED"
              echo "SAFETY=FULL_PARITY_EQUIVALENT_FASTBOOT_TEST_ONLY"
            else
              echo "PERSISTENT_PACKAGE=NOT_GENERATED"
              echo "SAFETY=CUSTOM_FASTBOOT_TEST_ONLY"
            fi
          } > "$OUT/selection-manifest.txt"

          (
            cd "$OUT"
            sha256sum Image Module.symvers "$BOOT_NAME" > SHA256SUMS.txt
            if [[ -f Xiaomi17Pro-pandora-OS4.0.5.0-R62-FULL-PARITY-AnyKernel3.zip ]]; then
              sha256sum Xiaomi17Pro-pandora-OS4.0.5.0-R62-FULL-PARITY-AnyKernel3.zip >> SHA256SUMS.txt
            fi
          )

      - name: "上传自定义构建"
        uses: actions/upload-artifact@v6
        with:
          name: pandora-OS4-R62-CUSTOM-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/custom-out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: "构建摘要"
        shell: bash
        run: |
          {
            echo "## Xiaomi 17 Pro OS4 自定义内核"
            echo
            echo "- Kernel: `$ACTUAL_KERNEL_RELEASE`"
            echo "- Image SHA256: `$ACTUAL_IMAGE_SHA256`"
            echo "- fastboot boot SHA256: `$BOOT_SHA256`"
            echo "- 是否为 Full Parity 默认功能组合: `$FULL_PARITY_SELECTION`"
            echo "- normalized LKG 等价校验: `$LKG_NORMALIZED_EQUIVALENCE`"
            echo "- 是否字节级等于历史 LKG: `$BYTE_EXACT_LKG`"
            echo
            if [[ "$BYTE_EXACT_LKG" == "1" ]]; then
              echo "本次构建字节级等于已验证持久化 LKG，并包含 AnyKernel3。"
            elif [[ "$FULL_PARITY_SELECTION" == "1" ]]; then
              echo "默认 Full Parity 的配置、ABI 与除自动模块签名证书/build-id 外的 Image 内容均与 LKG 等价。"
              echo "**当前仍只生成 fastboot boot 测试镜像；完成一次真机验证后再开放该重建路径的持久化包。**"
            else
              echo "**自定义组合尚未真机验证，只生成 fastboot boot 测试镜像，不生成持久化 AnyKernel3。**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
