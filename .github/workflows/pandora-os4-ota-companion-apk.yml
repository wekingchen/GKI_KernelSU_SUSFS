name: "小米17 Pro OS4 / OTA 采集助手 APK（独立实验）"

on:
  push:
    branches:
      - pandora-os4-ota-companion
    paths:
      - "tools/pandora-ota-companion/**"
      - ".github/workflows/pandora-os4-ota-companion-apk.yml"
  workflow_dispatch:

concurrency:
  group: pandora-ota-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v3
      - name: 安装 Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: 编译 Debug APK
        working-directory: tools/pandora-ota-companion
        run: gradle --no-daemon :app:assembleDebug
      - name: 上传未验证 APK
        uses: actions/upload-artifact@v4
        with:
          name: pandora-os4-ota-companion-UNVERIFIED
          path: tools/pandora-ota-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
