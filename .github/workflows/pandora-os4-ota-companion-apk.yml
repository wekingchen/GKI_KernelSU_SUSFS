name: "小米17 Pro OS4 / OTA 采集助手 APK（独立实验）"

on:
  push:
    branches:
      - pandora-os4-ota-companion
    paths:
      - "tools/pandora-ota-companion/**"
      - ".github/workflows/pandora-os4-ota-companion-apk.yml"
  workflow_dispatch:

concurrency:
  group: pandora-ota-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: 配置 Android SDK（使用 Runner 预装工具）
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDK=/usr/local/lib/android/sdk
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager" || test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" || \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
      - name: OTA 采集包格式与失败关闭测试
        working-directory: tools/pandora-ota-companion
        run: python3 -m unittest -v test_normalize_mobile_capture.py
      - name: 接入脚本 Bash 语法审计
        run: bash -n tools/pandora-ota-companion/mobile-intake.sh
      - name: 编译 Debug APK
        working-directory: tools/pandora-ota-companion
        run: gradle --no-daemon :app:assembleDebug
      - name: 上传未验证 APK
        uses: actions/upload-artifact@v4
        with:
          name: pandora-os4-ota-companion-UNVERIFIED
          path: tools/pandora-ota-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: 检测是否配置长期更新签名
        env:
          KEYSTORE_B64: ${{ secrets.PANDORA_OTA_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PANDORA_OTA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PANDORA_OTA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PANDORA_OTA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pandora-ota-stable.p12"
            chmod 600 "$RUNNER_TEMP/pandora-ota-stable.p12"
            echo "PANDORA_OTA_STORE_FILE=$RUNNER_TEMP/pandora-ota-stable.p12" >> "$GITHUB_ENV"
            echo "PANDORA_OTA_HAS_STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "PANDORA_OTA_HAS_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::notice::未配置正式签名四项 Secrets，只输出实验性 Debug APK；Debug 签名可能随 Runner 变化"
          fi
      - name: 编译稳定签名 APK
        if: env.PANDORA_OTA_HAS_STABLE_SIGNING == 'true'
        env:
          PANDORA_OTA_STORE_PASSWORD: ${{ secrets.PANDORA_OTA_STORE_PASSWORD }}
          PANDORA_OTA_KEY_ALIAS: ${{ secrets.PANDORA_OTA_KEY_ALIAS }}
          PANDORA_OTA_KEY_PASSWORD: ${{ secrets.PANDORA_OTA_KEY_PASSWORD }}
        working-directory: tools/pandora-ota-companion
        run: gradle --no-daemon :app:assembleRelease
      - name: 核对稳定 APK 签名证书指纹与 v2/v3 签名
        if: env.PANDORA_OTA_HAS_STABLE_SIGNING == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=tools/pandora-ota-companion/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/pandora-apk-signature.txt"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/pandora-apk-signature.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/pandora-apk-signature.txt" | tr "A-F" "a-f")"
          EXPECTED="6a465b38eaadaca90f9186634f416a16c03eeff6056813e5ae906c0aecab732f"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::APK 签名指纹与已备份的长期密钥不符，禁止发布"
            exit 1
          fi
          echo "::notice::稳定签名已验证，证书 SHA-256: $ACTUAL"
      - name: 删除 Runner 上的临时签名密钥
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pandora-ota-stable.p12"
      - name: 上传可长期覆盖升级的稳定签名 APK
        if: env.PANDORA_OTA_HAS_STABLE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pandora-os4-ota-companion-STABLE-SIGNED
          path: tools/pandora-ota-companion/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
