name: "小米17 Pro OS4 / DroidSpaces PIDs 保持 net_prio KMI 身份实验（不可刷机）"

on:
  push:
    branches:
      - "os4/pandora-6.12.69-adaptation-20261029"
    paths:
      - ".github/workflows/xiaomi-sm8850-os4-droidspaces-pids-kmi-repurpose.yml"
      - "scripts/xiaomi-os4/build-r62-features.sh"
      - ".github/config/xiaomi-sm8850-os4-6.12.69.env"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: xiaomi-os4-r62-droidspaces-pids-kmi-repurpose
  cancel-in-progress: true

env:
  FEATURE_BASE_RUN_ID: "40896020115"
  FEATURE_BASE_ARTIFACT: "NOFLASH-pandora-OS4-R62-BakaSU-SUSFS-NoMount-ABI"
  FEATURE_BASE_SYMVERS_SHA256: "69dc25f5e78bb1b03332c0a8cf0169e239e1efbd51c04a7469aea95430f89b2f"

jobs:
  pids-kmi-repurpose:
    name: "保留 net_prio KMI 外观，仅将内部实现替换为 PIDs"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "检出 OS4 隔离分支"
        uses: actions/checkout@v7

      - name: "安全与语法检查"
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "os4/pandora-6.12.69-adaptation-20261029"
          bash -n scripts/xiaomi-os4/build-r62-features.sh
          ! grep -Eq 'fastboot[[:space:]]+flash|AnyKernel3.zip' scripts/xiaomi-os4/build-r62-features.sh
          echo "本实验只做 ABI / KMI 研究；不会生成 boot.img。"

      - name: "清理 Runner 预装冗余工具"
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: "安装构建依赖"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache \
            cpio curl flex git jq libdw-dev libelf-dev libssl-dev patch perl python3 \
            rsync tar unzip xz-utils zip zstd dwarves

      - name: "恢复固定 Google R62 源码缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/common-r62.git
          key: xiaomi-pandora-os4-common-e2b8ca7c8d05-v1

      - name: "恢复已验证 Android r536225 Clang/Rust 工具链"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/toolchain-r536225
          key: xiaomi-pandora-os4-toolchain-r536225-verified-v1

      - name: "复用 R62 功能内核热缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/ccache-r62
          key: xiaomi-pandora-os4-ccache-r62-dspids-kmi-${{ github.sha }}
          restore-keys: |
            xiaomi-pandora-os4-ccache-r62-dspids-slot-
            xiaomi-pandora-os4-ccache-r62-dspids-
            xiaomi-pandora-os4-ccache-r62-features-
            xiaomi-pandora-os4-ccache-r62-

      - name: "构建 KMI 外观不变的 net_prio→PIDs 实现候选"
        shell: bash
        env:
          XIAOMI_OS4_PIDS_REPURPOSE_NET_PRIO: "1"
        run: |
          set -euo pipefail
          bash scripts/xiaomi-os4/build-r62-features.sh

      - name: "下载已真机验证功能基线 #4"
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.FEATURE_BASE_ARTIFACT }}
          run-id: ${{ env.FEATURE_BASE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/feature-base

      - name: "确认最终 Kconfig 与 #4 完全一致"
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ runner.temp }}/feature-base/final.config"
          NEW="${{ runner.temp }}/xiaomi-os4-integrated/results/final.config"
          test -s "$BASE" && test -s "$NEW"
          grep -qx '# CONFIG_CGROUP_PIDS is not set' "$NEW"
          grep -qx 'CONFIG_CGROUP_NET_PRIO=y' "$NEW"
          grep -qx 'CONFIG_CGROUP_NET_CLASSID=y' "$NEW"
          grep -qx 'CONFIG_SOCK_CGROUP_DATA=y' "$NEW"
          grep -qx 'BUILD_KIND=R62_BAKASU_SUSFS_NOMOUNT_DROIDSPACES_PIDS_NETPRIO_KMI_REPURPOSE_ANALYSIS' "${{ runner.temp }}/xiaomi-os4-integrated/results/build-metadata.txt"

          python3 - "$BASE" "$NEW" "${{ runner.temp }}/xiaomi-os4-integrated/results/pids-kmi-config-diff.txt" <<'PY'
          from pathlib import Path
          import sys
          a=Path(sys.argv[1]).read_text().splitlines()
          b=Path(sys.argv[2]).read_text().splitlines()
          def norm(lines):
              return {x for x in lines if not x.startswith('CONFIG_LOCALVERSION=')}
          only_a=sorted(norm(a)-norm(b))
          only_b=sorted(norm(b)-norm(a))
          out=["ONLY_BASE:"]+only_a+["","ONLY_KMI_REPURPOSE:"]+only_b
          Path(sys.argv[3]).write_text("\n".join(out)+"\n")
          print("\n".join(out))
          if only_a or only_b:
              raise SystemExit("Kconfig must be byte-semantically identical except LOCALVERSION")
          PY

      - name: "比较导出 ABI 与符号集合"
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ runner.temp }}/feature-base/Module.symvers"
          NEW="${{ runner.temp }}/xiaomi-os4-integrated/results/Module.symvers"
          OUT="${{ runner.temp }}/xiaomi-os4-integrated/results/pids-kmi-abi-diff.txt"
          test -s "$BASE" && test -s "$NEW"
          printf '%s  %s\n' "$FEATURE_BASE_SYMVERS_SHA256" "$BASE" | sha256sum -c -

          awk -F '\t' '
            NR==FNR {
              if ($3=="vmlinux") { base[$2]=$1; base_count++ }
              next
            }
            $3=="vmlinux" {
              if ($2 in base) {
                matched++
                if ($1 != base[$2]) {
                  conflicts++
                  if (conflicts <= 200) print "CRC_CHANGED " $2 " old=" base[$2] " new=" $1
                }
                delete base[$2]
              } else {
                added++
                print "NEW_EXPORT " $2 " crc=" $1
              }
            }
            END {
              for (name in base) {
                missing++
                print "MISSING_EXPORT " name
              }
              print "BASE_VMLINUX_EXPORTS=" base_count
              print "MATCHED_SYMBOL_NAMES=" matched
              print "NEW_EXPORTS=" (added+0)
              print "MISSING_EXPORTS=" (missing+0)
              print "CRC_CONFLICTS=" (conflicts+0)
            }
          ' "$BASE" "$NEW" | tee "$OUT"

          conflicts="$(sed -n 's/^CRC_CONFLICTS=//p' "$OUT")"
          added="$(sed -n 's/^NEW_EXPORTS=//p' "$OUT")"
          missing="$(sed -n 's/^MISSING_EXPORTS=//p' "$OUT")"
          [[ -n "$conflicts" && -n "$added" && -n "$missing" ]] || {
            echo "::error::ABI summary missing"; exit 1;
          }

          {
            if (( conflicts == 0 && added == 0 && missing == 0 )); then
              echo "ABI_LAYOUT_RESULT=ZERO_DIFF"
              echo "SAFE_TO_FASTBOOT_BOOT=NO"
              echo "REASON=KMI surface is preserved, but runtime semantics and OEM net_prio dependency still require separate audit"
            else
              echo "ABI_LAYOUT_RESULT=FAILED"
              echo "SAFE_TO_FASTBOOT_BOOT=NO"
              echo "REASON=KMI-preserving repurpose still changes exported ABI"
            fi
          } | tee "${{ runner.temp }}/xiaomi-os4-integrated/results/pids-kmi-safety.txt"

          if (( conflicts != 0 || added != 0 || missing != 0 )); then
            exit 1
          fi

      - name: "记录实验结论"
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/xiaomi-os4-integrated/results"
          {
            echo "## DroidSpaces PIDs / net_prio KMI 身份保留实验"
            echo
            echo "保留 CONFIG 与导出 KMI 外观，只替换 net_prio slot 内部实现；无论结果如何都不批准真机。"
            for f in pids-kmi-config-diff.txt pids-kmi-abi-diff.txt pids-kmi-safety.txt; do
              [[ -s "$OUT/$f" ]] && { echo '~~~text'; cat "$OUT/$f"; echo '~~~'; }
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "上传 ABI 实验素材"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: NOFLASH-pandora-OS4-R62-DroidSpaces-PIDs-netprio-KMI-repurpose
          path: |
            ${{ runner.temp }}/xiaomi-os4-integrated/results/Image
            ${{ runner.temp }}/xiaomi-os4-integrated/results/Module.symvers
            ${{ runner.temp }}/xiaomi-os4-integrated/results/final.config
            ${{ runner.temp }}/xiaomi-os4-integrated/results/build-metadata.txt
            ${{ runner.temp }}/xiaomi-os4-integrated/results/pids-kmi-config-diff.txt
            ${{ runner.temp }}/xiaomi-os4-integrated/results/pids-kmi-abi-diff.txt
            ${{ runner.temp }}/xiaomi-os4-integrated/results/pids-kmi-safety.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
