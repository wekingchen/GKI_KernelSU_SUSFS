name: "临时清理：已合并的新 OTA AnyKernel3 开发分支"
on:
  push:
    paths:
      - ".github/workflows/xiaomi-os4-temp-ak3-cleanup-20261101.yml"
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "严格核对 PR 与待删分支 SHA"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/38" --jq '.merged')" == true ]] || exit 1
          ref="os4-ota-custom-anykernel3-20261101"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq '.object.sha')"
          [[ "$sha" == "4ac4c18e355c633f95a757727faa2c3ea828b6db" ]] || {
            echo "::error::临时分支 SHA 改变，拒绝删除"; exit 1;
          }
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" >/dev/null
          echo "临时分支已核对 SHA 并删除：$ref" >> "$GITHUB_STEP_SUMMARY"
