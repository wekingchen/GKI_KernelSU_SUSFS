name: "One-time OS4 SUSFS #28 full-build verification"
on:
  push:
    branches: [fix/pandora-os4-susfs-unused-20261111]
    paths: [.github/workflows/pandora-os4-susfs-build-verification-once.yml]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS' && github.ref == 'refs/heads/fix/pandora-os4-susfs-unused-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "Dispatch exact #28 default feature selection on isolated branch only"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="fix/pandora-os4-susfs-unused-20261111"
          [[ "$GITHUB_SHA" == "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)" ]]
          gh workflow run xiaomi-sm8850-os4-custom.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" \
            -f root_mode=bakasu-susfs \
            -f susfs_extra_features=true \
            -f use_nomount=true \
            -f droidspaces=on \
            -f droidspaces_ntsync=true \
            -f use_bbg=true \
            -f use_rekernel=true \
            -f use_networking=true \
            -f use_cve=true
          echo "Triggered OS4 custom rebuild with the same 9 selected/default features as failed #28; LKG and dev untouched." >> "$GITHUB_STEP_SUMMARY"
