name: "小米17 Pro OS4 / OTA 助手 Android 模拟器验证"

on:
  pull_request:
    branches: [dev]
    paths:
      - "tools/pandora-ota-companion/**"
      - ".github/workflows/pandora-os4-ota-companion-emulator.yml"
  push:
    branches: [pandora-os4-ota-companion, dev]
    paths:
      - "tools/pandora-ota-companion/**"
      - ".github/workflows/pandora-os4-ota-companion-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pandora-ota-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: 启用 KVM 加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: 启动 Android 15 模拟器并执行设备端仪器测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          disable-animations: true
          working-directory: tools/pandora-ota-companion
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p app/build/reports/androidTests/preview
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.wekingchen.pandoraota
            adb shell am start -n com.wekingchen.pandoraota/.MainActivity
            sleep 4
            adb exec-out screencap -p > app/build/reports/androidTests/preview/workbench.png
            test -s app/build/reports/androidTests/preview/workbench.png

            SIZE_LINE="$(adb shell wm size | tr -d '\r' | tail -n1)"
            DIMENSIONS="$(printf '%s' "$SIZE_LINE" | cut -d: -f2 | tr -d ' ')"
            WIDTH="$(printf '%s' "$DIMENSIONS" | cut -dx -f1)"
            HEIGHT="$(printf '%s' "$DIMENSIONS" | cut -dx -f2)"
            test -n "$WIDTH" && test -n "$HEIGHT"
            NAV_Y=$((HEIGHT - 150))

            # Bottom navigation thirds: Records, then Settings.
            adb shell input tap $((WIDTH / 2)) "$NAV_Y"
            sleep 2
            adb exec-out screencap -p > app/build/reports/androidTests/preview/records.png
            test -s app/build/reports/androidTests/preview/records.png

            adb shell input tap $((WIDTH * 5 / 6)) "$NAV_Y"
            sleep 2
            adb exec-out screencap -p > app/build/reports/androidTests/preview/settings.png
            test -s app/build/reports/androidTests/preview/settings.png
      - name: 保存模拟器测试报告（失败也收集）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandora-ota-android-emulator-report-${{ github.run_id }}
          path: |
            tools/pandora-ota-companion/app/build/reports/androidTests/connected/
            tools/pandora-ota-companion/app/build/outputs/androidTest-results/connected/
            tools/pandora-ota-companion/app/build/reports/androidTests/preview/
          if-no-files-found: warn
          retention-days: 14
