name: "小米17 Pro OS4 / 检查新固件 xm.zip（只读）"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiaomi-os4-stock-intake
  cancel-in-progress: true

env:
  STOCK_INPUT_RELEASE_TAG: pandora-os4-stock-input

jobs:
  inspect:
    name: "下载固定 Release 的 xm.zip → 只读识别版本与 boot"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: "下载唯一的 *xm.zip"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/stock"
          gh release download "$STOCK_INPUT_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*xm.zip' \
            --dir "${{ runner.temp }}/stock"
          mapfile -t ZIPS < <(find "${{ runner.temp }}/stock" -maxdepth 1 -type f -name '*xm.zip' -print)
          [[ "${#ZIPS[@]}" -eq 1 ]] || {
            echo "::error::固定 Release 中必须且只能有一个 *xm.zip，当前找到 ${#ZIPS[@]} 个。"
            exit 1
          }
          echo "STOCK_ZIP=${ZIPS[0]}" >> "$GITHUB_ENV"

      - name: "识别并提取 boot"
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t BOOT_MEMBERS < <(unzip -Z1 "$STOCK_ZIP" | awk 'tolower($0) ~ /(^|\/)boot(_[^\/]*)?\.img$/ {print}')
          [[ "${#BOOT_MEMBERS[@]}" -eq 1 ]] || {
            echo "::error::xm.zip 中必须且只能有一个 boot*.img，当前找到 ${#BOOT_MEMBERS[@]} 个。"
            exit 1
          }
          BOOT_MEMBER="${BOOT_MEMBERS[0]}"
          echo "BOOT_MEMBER=$BOOT_MEMBER" >> "$GITHUB_ENV"
          unzip -p "$STOCK_ZIP" "$BOOT_MEMBER" > "${{ runner.temp }}/boot.img"
          README_MEMBER="$(unzip -Z1 "$STOCK_ZIP" | awk 'tolower($0) ~ /(^|\/)readme\.txt$/ {print; exit}')"
          if [[ -n "$README_MEMBER" ]]; then
            unzip -p "$STOCK_ZIP" "$README_MEMBER" > "${{ runner.temp }}/README.txt"
          fi

      - name: "只读审计 boot-v4 与版本"
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ runner.temp }}/boot.img" "${{ runner.temp }}/README.txt" <<'PY'
          import hashlib, pathlib, re, struct, sys
          boot_path=pathlib.Path(sys.argv[1]); readme_path=pathlib.Path(sys.argv[2])
          data=boot_path.read_bytes()
          if len(data) < 4096 or data[:8] != b"ANDROID!":
              raise SystemExit("ERROR: boot image magic invalid")
          kernel_size, ramdisk_size, os_version, header_size=struct.unpack_from("<IIII", data, 8)
          header_version=struct.unpack_from("<I", data, 40)[0]
          signature_size=struct.unpack_from("<I", data, 1580)[0] if len(data) >= 1584 else -1
          kernel=data[4096:4096+kernel_size]
          h=lambda x: hashlib.sha256(x).hexdigest()
          m=re.search(r"Linux version ([^\x00\r\n ]+)", kernel.decode("latin1","ignore"))
          release=m.group(1) if m else "NOT_FOUND"
          manifest={}
          if readme_path.exists():
              for line in readme_path.read_text("utf-8","replace").splitlines():
                  if "=" in line:
                      k,v=line.split("=",1); manifest[k.strip()]=v.strip()
          values={
              "manifest_device":manifest.get("device","UNKNOWN"),
              "manifest_build":manifest.get("build","UNKNOWN"),
              "manifest_uname":manifest.get("uname","UNKNOWN"),
              "manifest_slot":manifest.get("slot","UNKNOWN"),
              "boot_size":len(data),"boot_sha256":h(data),"header_sha256":h(data[:4096]),
              "header_version":header_version,"header_size":header_size,
              "kernel_size":kernel_size,"kernel_sha256":h(kernel),
              "kernel_release_marker":release,"ramdisk_size":ramdisk_size,
              "signature_size":signature_size,
          }
          out=pathlib.Path("/tmp/stock-intake.txt")
          out.write_text("\n".join(f"{k}={v}" for k,v in values.items())+"\n",encoding="utf-8")
          print(out.read_text(),end="")
          PY

      - name: "保存报告"
        uses: actions/upload-artifact@v6
        with:
          name: pandora-os4-stock-intake-report
          path: /tmp/stock-intake.txt
          if-no-files-found: error
          retention-days: 30

      - name: "摘要"
        shell: bash
        run: |
          {
            echo "## pandora OS4 新固件 stock input（只读）"
            echo
            cat /tmp/stock-intake.txt
            echo
            echo "只检查，不修改仓库、不生成可刷镜像。"
          } >> "$GITHUB_STEP_SUMMARY"
