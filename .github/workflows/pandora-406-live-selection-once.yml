name: "临时验收 / pandora 真机来源选择修复与 Binder active_impl"
on:
  push:
    branches:
      - audit/pandora-406-live-selection
    paths:
      - .github/workflows/pandora-406-live-selection-once.yml
permissions:
  contents: read

jobs:
  linux-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: "运行真实快照分类、来源隔离与只读采集静态回归"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_audit_stock_module_delivery.py' -v
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_audit_live_module_delivery.py' -v
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_audit_live_module_reviewer.py' -v

  windows-end-to-end:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: "原生 CMD + 模拟 adb.exe：版本化 system_dlkm、Binder active_impl、GNU Note 与本地 ZIP"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mock = Join-Path $env:RUNNER_TEMP 'pandora-adb-mock'
          New-Item -ItemType Directory -Force -Path $mock | Out-Null
          $csharp = @'
          using System;
          public static class Program {
            static void Hash(string h, string p) { Console.WriteLine(h + "  " + p); }
            public static int Main(string[] args) {
              if (args.Length >= 3 && args[0] == "shell" && args[1] == "getprop") {
                switch (args[2]) {
                  case "ro.product.device": Console.WriteLine("pandora"); break;
                  case "ro.mi.os.version.incremental": Console.WriteLine("OS4.0.6.0.XBLCNXM"); break;
                  case "ro.boot.slot_suffix": Console.WriteLine("_b"); break;
                  case "sys.boot_completed": Console.WriteLine("1"); break;
                  case "ro.boot.verifiedbootstate": Console.WriteLine("green"); break;
                  case "ro.boot.vbmeta.device_state": Console.WriteLine("locked"); break;
                }
                return 0;
              }
              if (args.Length >= 3 && args[0] == "shell" && args[1] == "uname") {
                Console.WriteLine("6.12.69-android16-6-g43b5ab7e247d-abogki561813157-4k");
                return 0;
              }
              if (args.Length >= 4 && args[0] == "shell" && args[1] == "su" && args[2] == "-c") {
                string c = args[3];
                if (c == "id") Console.WriteLine("uid=0(root) gid=0(root)");
                else if (c == "cat /proc/cmdline") Console.WriteLine("foo=bar serialno=SENSITIVE token=SECRET");
                else if (c == "cat /proc/bootconfig") Console.WriteLine("androidboot.test=1");
                else if (c == "cat /sys/module/binder/parameters/impl") Console.WriteLine("rust");
                else if (c == "cat /sys/module/binder/parameters/active_impl") Console.WriteLine("rust");
                else if (c == "cat /proc/modules") {
                  Console.WriteLine("node_cache 36864 0 - Live 0xDEADBEEF");
                  Console.WriteLine("zram 159744 1 - Live 0xDEADBEEF");
                  Console.WriteLine("zsmalloc 45056 2 - Live 0xDEADBEEF");
                  Console.WriteLine("rust_binder 462848 0 - Live 0xDEADBEEF");
                }
                else if (c == "cat /proc/sys/kernel/modules_disabled") Console.WriteLine("0");
                else if (c == "cat /sys/module/rust_binder/initstate") Console.WriteLine("live");
                else if (c.StartsWith("sha256sum /system_dlkm/") && c.EndsWith("/kernel/drivers/android/binder/rust_binder.ko"))
                  Hash("ea5a84225ce1af3c8af7effed891aa91ed879a9d85780d40a31aa79d3fbcd34c", c.Substring(10));
                else if (c.StartsWith("sha256sum /system_dlkm/") && c.EndsWith("/kernel/mm/zsmalloc.ko"))
                  Hash("b54598bea0a162cd2578f9d1490095fef148014de0c7dbaf012036b6adcbc465", c.Substring(10));
                else if (c.StartsWith("sha256sum /system_dlkm/") && c.EndsWith("/kernel/drivers/block/zram/zram.ko"))
                  Hash("7a440b89b62385d1affc0dca25af32c75f6e03af1a884e3d2ae8e4e75402b3c3", c.Substring(10));
                else if (c == "sha256sum /vendor_dlkm/lib/modules/zsmalloc.ko")
                  Hash("350f7127f0a8cda912eea8dfe6d93dbf30e5b31832969aa44ee6161424eaed3e", "/vendor_dlkm/lib/modules/zsmalloc.ko");
                else if (c == "sha256sum /vendor_dlkm/lib/modules/zram.ko")
                  Hash("6737e77c46b0a5a998adf552c42191e97068c393c506d83679d24c320f13d166", "/vendor_dlkm/lib/modules/zram.ko");
                else if (c == "sha256sum /vendor_dlkm/lib/modules/node_cache.ko")
                  Hash("bc78bab29b624743419e5a3d7f7f8586dc9f30d682cf3a65608c79601b7ddefd", "/vendor_dlkm/lib/modules/node_cache.ko");
                else if (c == "sha256sum /sys/module/rust_binder/notes/.note.gnu.build-id")
                  Hash("f495767e894fcfed7e9d05b9f04d847bcbe95b9ad79b40193e5795554bc62aa6", "/sys/module/rust_binder/notes/.note.gnu.build-id");
                else if (c == "sha256sum /sys/module/zsmalloc/notes/.note.gnu.build-id")
                  Hash("531fad7a1fd7fa95976ea97c2cd9c402e63f578d6b0d19266b1545f547a62035", "/sys/module/zsmalloc/notes/.note.gnu.build-id");
                else if (c == "sha256sum /sys/module/zram/notes/.note.gnu.build-id")
                  Hash("e6c5c0c4c3cfa4ad9f5ea4828391459b3c556dc80a77fd9bd005df2699dc0280", "/sys/module/zram/notes/.note.gnu.build-id");
                else if (c == "sha256sum /sys/module/node_cache/notes/.note.gnu.build-id")
                  Hash("24755a08ebe111a8c8b0bbf30e25a6b32c2a0527654efb68109265bd36ef2b02", "/sys/module/node_cache/notes/.note.gnu.build-id");
                else if (c.Contains("/system_dlkm/lib/modules/6.12.69-") && c.EndsWith("/modules.load")) {
                  Console.WriteLine("kernel/drivers/android/binder/rust_binder.ko");
                  Console.WriteLine("kernel/mm/zsmalloc.ko");
                  Console.WriteLine("kernel/drivers/block/zram/zram.ko");
                }
                else if (c.Contains("/system_dlkm/lib/modules/6.12.69-") && c.EndsWith("/modules.dep")) {
                  Console.WriteLine("kernel/drivers/android/binder/rust_binder.ko:");
                  Console.WriteLine("kernel/drivers/block/zram/zram.ko: kernel/mm/zsmalloc.ko");
                }
                else if (c == "cat /vendor_dlkm/lib/modules/modules.load") {
                  Console.WriteLine("zram.ko");
                  Console.WriteLine("node_cache.ko");
                  Console.WriteLine("zsmalloc.ko");
                }
                else if (c == "cat /vendor_dlkm/lib/modules/modules.dep") {
                  Console.WriteLine("/vendor/lib/modules/node_cache.ko: /vendor/lib/modules/zsmalloc.ko");
                  Console.WriteLine("/vendor/lib/modules/zram.ko: /vendor/lib/modules/zsmalloc.ko");
                }
                else if (c == "cat /proc/mounts") {
                  Console.WriteLine("/dev/block/dm-43 /vendor_dlkm erofs ro,seclabel,relatime 0 0");
                  Console.WriteLine("/dev/block/dm-44 /system_dlkm erofs ro,seclabel,relatime 0 0");
                }
                return 0;
              }
              return 0;
            }
          }
          '@
          $source = Join-Path $mock 'Program.cs'
          Set-Content -Path $source -Value $csharp -Encoding utf8
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          if (-not (Test-Path $compiler)) { throw 'Native .NET Framework C# compiler unavailable' }
          $binary = Join-Path $mock 'adb.exe'
          & $compiler /nologo /target:exe ("/out:" + $binary) $source
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $binary)) { throw 'Mock executable compilation failed' }
          $env:PATH = "$mock;$env:PATH"

          Push-Location $env:RUNNER_TEMP
          try {
            $cmdFile = Join-Path $env:GITHUB_WORKSPACE 'scripts/xiaomi-os4/collect-pandora-live-module-delivery.cmd'
            & cmd.exe /c $cmdFile
            if ($LASTEXITCODE -ne 0) { throw "collector failed with exit $LASTEXITCODE" }
            $dirs = @(Get-ChildItem -Directory -Filter 'pandora-live-module-delivery-*')
            if ($dirs.Count -ne 1) { throw 'Expected one evidence folder' }
            $out = $dirs[0].FullName
            $systemLoad = Get-Content (Join-Path $out 'system-modules.load') -Raw
            $impl = (Get-Content (Join-Path $out 'binder-impl-sysfs.txt') -Raw).Trim()
            $active = (Get-Content (Join-Path $out 'binder-active-impl-sysfs.txt') -Raw).Trim()
            $cmdline = Get-Content (Join-Path $out 'binder-impl-cmdline.txt') -Raw
            $loaded = Get-Content (Join-Path $out 'loaded-modules-redacted.txt') -Raw
            if ($systemLoad -notmatch 'rust_binder\.ko') { throw 'Versioned system modules.load not captured' }
            if ($impl -ne 'rust' -or $active -ne 'rust') { throw 'Binder sysfs state not captured' }
            if ($cmdline -match 'SENSITIVE|SECRET') { throw 'Raw cmdline leaked' }
            if ($loaded -match '0xDEADBEEF') { throw 'Module address leaked' }
            $archive = Join-Path $env:RUNNER_TEMP ($dirs[0].Name + '.zip')
            if (-not (Test-Path $archive)) { throw 'Evidence ZIP missing' }

            $report = Join-Path $env:RUNNER_TEMP 'review.json'
            python (Join-Path $env:GITHUB_WORKSPACE 'scripts/xiaomi-os4/review-live-module-delivery-readonly.py') --evidence-dir $out --output $report
            if ($LASTEXITCODE -ne 0) { throw 'Offline reviewer rejected complete mock evidence' }
            $j = Get-Content $report -Raw | ConvertFrom-Json
            if ($j.runtime_zsmalloc_unique_note_source -ne 'vendor') { throw 'Vendor zsmalloc source was not resolved' }
            if (-not $j.runtime_vendor_memory_stack_consistent) { throw 'Vendor memory stack did not classify consistently' }
            if ($j.binder_implementation_selection -ne 'rust' -or -not $j.binder_implementation_verified) { throw 'Active Rust Binder not verified from sysfs' }
            if (-not $j.runtime_rust_binder_active_consistent) { throw 'Rust Binder active stack inconsistent' }
            if ($j.gate -ne 'BLOCKED' -or $j.flashable) { throw 'Safety gate was relaxed' }
            Write-Host 'Windows current-boot source selection mock PASS; OEM candidate gate remains BLOCKED'
          } finally {
            Pop-Location
          }
