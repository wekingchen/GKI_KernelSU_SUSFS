name: "OS4 selectable AnyKernel3 package validation"
# rerun after AnyKernel runtime-template fix

on:
  push:
    branches:
      - os4-selectable-anykernel3-20261031
    paths:
      - ".github/workflows/os4-anykernel3-package-validation.yml"

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "检出候选代码"
        uses: actions/checkout@v7

      - name: "下载已真机验证的 #1 构建产物"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh run download 41112359117 \
            --repo "$GITHUB_REPOSITORY" \
            --name "pandora-OS4-R62-CUSTOM-run-41112359117" \
            --dir "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/Image"
          echo "SOURCE_IMAGE_SHA256=$(sha256sum "$RUNNER_TEMP/source/Image" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: "生成并校验 Full Parity AnyKernel3"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          XIAOMI_AK3_MODE=full-parity-rebuild \
          XIAOMI_AK3_RELEASE=6.12.69-android16-6-os4r62-dspids-dscore-full-parity-kmi-4k \
            bash scripts/xiaomi-os4/package-validated-anykernel3.sh \
              "$RUNNER_TEMP/source/Image" "$RUNNER_TEMP/out" \
              | tee "$RUNNER_TEMP/out/package-report.txt"

          ZIP="$RUNNER_TEMP/out/Xiaomi17Pro-pandora-OS4.0.5.0-R62-FULL-PARITY-AnyKernel3.zip"
          test -s "$ZIP"
          unzip -t "$ZIP"
          unzip -p "$ZIP" README.txt
          unzip -p "$ZIP" anykernel.sh | grep -E 'Validation:|Kernel:|device.name1=pandora'
          echo "ANYKERNEL3_SHA256=$(sha256sum "$ZIP" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: "上传快速验证包"
        uses: actions/upload-artifact@v6
        with:
          name: pandora-OS4-R62-FULL-PARITY-AnyKernel3-validation
          path: |
            ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: "摘要"
        shell: bash
        run: |
          {
            echo "## OS4 selectable AnyKernel3 package validation"
            echo
            echo "- Source Image: `$SOURCE_IMAGE_SHA256`"
            echo "- AnyKernel3: `$ANYKERNEL3_SHA256`"
            echo "- Source run: `41112359117`"
            echo "- Real-device fastboot validation: `PASS`"
          } >> "$GITHUB_STEP_SUMMARY"
