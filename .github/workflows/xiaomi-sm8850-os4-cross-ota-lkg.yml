name: "小米17 Pro OS4 / 跨 OTA LKG 晋升、复现及归档"

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "已实际稳定使用的新 OTA 自定义内核 Run ID"
        type: string
        required: true
      confirm_boot:
        description: "我确认此 Run 的内核已成功在真机启动"
        type: boolean
        required: true
        default: false
      confirm_persistent:
        description: "我确认此内核已持久安装并实际稳定使用"
        type: boolean
        required: true
        default: false
      confirm_runtime:
        description: "我确认本次选用的 Root、SUSFS、NoMount、DroidSpaces 等功能实际正常"
        type: boolean
        required: true
        default: false
      repair_draft_release:
        description: "仅修复已成功合并稳定指针、但未发布的草稿 Release；不重新晋升"
        type: boolean
        required: true
        default: false
      note:
        description: "稳定版备注（可选）"
        type: string
        required: false
        default: "user-confirmed-ota"

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: pandora-os4-cross-ota-lkg-transaction
  cancel-in-progress: false

jobs:
  verified-lkg-transaction:
    name: "来源校验 → 固定源重编 → 严格验证 → 永久归档 → 指针晋升"
    if: >-
      github.repository == 'wekingchen/GKI_KernelSU_SUSFS' &&
      !inputs.repair_draft_release && inputs.confirm_boot && inputs.confirm_persistent && inputs.confirm_runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: "检出受保护的 dev，并保留提交祖先"
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - name: "预检与破坏性回归测试"
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/xiaomi-os4/run-cross-ota-lkg.sh
          bash -n scripts/xiaomi-os4/build-r62-features.sh
          bash -n scripts/xiaomi-os4/package-validated-anykernel3.sh
          python3 -m py_compile scripts/xiaomi-os4/cross-ota-lkg.py scripts/xiaomi-os4/export-ota-lkg-rebuild-env.py
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_cross_ota_lkg.py' -v
      - name: "构建与校验环境"
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git jq libdw-dev \
            libelf-dev libssl-dev patch perl python3 rsync tar unzip xz-utils \
            zip zstd dwarves
      - name: "只恢复相同版本工具链缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/toolchain-r536225
          key: xiaomi-pandora-os4-toolchain-r536225-verified-v1
      - name: "严格重建、长期归档下载回检，最后才更新 LKG"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CONFIRM_BOOT: ${{ inputs.confirm_boot }}
          CONFIRM_PERSISTENT: ${{ inputs.confirm_persistent }}
          CONFIRM_RUNTIME: ${{ inputs.confirm_runtime }}
          PROMOTION_NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          bash scripts/xiaomi-os4/run-cross-ota-lkg.sh
      - name: "保护边界摘要"
        if: always()
        shell: bash
        run: |
          {
            echo "## 跨 OTA LKG 安全边界"
            echo "- 源 Run 与当次 OTA、7 类上游 SHA、用户选择及每个产物哈希绑定"
            echo "- 先强制重建 Image，再比对 normalized Image + exact config/Module.symvers"
            echo "- 独立下载校验 Release 后才创建稳定版指针 PR"
            echo "- 原始用户确认包与仅 CI 复现包分开，禁止冒充二次真机验证"
            echo "- 永不修改历史 R62 Gen3 配置与 boot fixture，不自动刷机"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-repair:
    name: "只修复已晋升 LKG 的未发布草稿，重新下载全部资产核对 SHA"
    if: >-
      github.repository == 'wekingchen/GKI_KernelSU_SUSFS' &&
      inputs.repair_draft_release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - name: "强制核验当前稳定指针和草稿 Release 原件，再发布"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          POINTER=".github/config/ota-lkg-current.json"
          [[ -s "$POINTER" ]] || { echo "::error::不存在经过合并的 OTA LKG"; exit 1; }
          jq -e --argjson id "$SOURCE_RUN_ID" '
            .schema==1 and .status=="USER_PROMOTED_OTA_LKG" and
            .attestation=="USER_CONFIRMED_BOOT_AND_PERSISTENT_STABILITY_NOT_REMOTE_HARDWARE_PROOF" and
            .source_run_id==$id and .generation >= 4 and
            .archive_tag==("pandora-os4-lkg-gen"+(.generation|tostring))
          ' "$POINTER" >/dev/null
          TAG="$(jq -r .archive_tag "$POINTER")"
          PROMO="$(jq -r .promotion_run_id "$POINTER")"
          SRC="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e '.status=="completed" and .conclusion=="success" and
            .event=="workflow_dispatch" and .head_branch=="dev" and
            .path==".github/workflows/xiaomi-sm8850-os4-custom.yml"' <<<"$SRC" >/dev/null
          RELEASE="$(gh release view "$TAG" --json isDraft,body,assets)"
          jq -e --arg s "SOURCE_RUN_ID=$SOURCE_RUN_ID" --arg p "PROMOTION_RUN_ID=$PROMO" '
            .isDraft==true and (.body|contains($s) and contains($p))
          ' <<<"$RELEASE" >/dev/null
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          gh release download "$TAG" --dir "$WORK"
          MANIFEST="$WORK/SHA256SUMS-$TAG.txt"
          [[ -s "$MANIFEST" && -s "$WORK/ota-lkg-promotion-record.json" ]] || exit 1
          cmp -s "$POINTER" "$WORK/ota-lkg-promotion-record.json" || {
            echo "::error::Release 内记录不是已合并的 LKG"; exit 1;
          }
          (cd "$WORK" && sha256sum -c "SHA256SUMS-$TAG.txt")
          for pattern in '*ORIGINAL-USER-ATTESTED-AnyKernel3.zip' \
                         '*REBUILT-CI-ONLY-AnyKernel3.zip' \
                         '*original-evidence.tar.zst' '*rebuilt-evidence.tar.zst'; do
            compgen -G "$WORK/$pattern" >/dev/null || {
              echo "::error::Release 关键原始/复现资产缺失: $pattern"; exit 1;
            }
          done
          # Re-read the pointer to reject a concurrent later generation.
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/config/ota-lkg-current.json?ref=dev" --jq .content | base64 -d)"
          cmp -s <(printf '%s\n' "$CURRENT") "$POINTER" || {
            echo "::error::稳定指针已变化，禁止发布过时版本"; exit 1;
          }
          gh release edit "$TAG" --draft=false --latest=false
          [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == false ]]
          echo "OTA_LKG_ARCHIVE_REPAIR=PASS $TAG" >> "$GITHUB_STEP_SUMMARY"
