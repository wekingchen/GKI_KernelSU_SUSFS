name: Temporary delete Xiaomi SM8850 review branch

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/_temporary-delete-xiaomi-sm8850-review.yml"

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete merged review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="xiaomi-sm8850-review-20260929"
          ref="repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}"

          if gh api "$ref" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          fi

          if gh api "$ref" >/dev/null 2>&1; then
            echo "::error::review branch still exists after deletion"
            exit 1
          fi

          echo "Confirmed absent: $branch"
