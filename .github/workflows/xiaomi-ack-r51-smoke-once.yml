name: Xiaomi ACK-R51 一次性全功能验证
# retry-after-r51-lto-fix

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/xiaomi-ack-r51-smoke-once.yml"

permissions:
  contents: write
  actions: read

jobs:
  ack-r51-smoke:
    name: ACK-R51 全功能
    uses: ./.github/workflows/kernel-xiaomi-sm8850.yml
    with:
      device: "Xiaomi 17 Pro (pandora)"
      source_profile: ack-r51
      root_mode: resukisu-susfs
      susfs_extra_features: true
      use_kpm: disabled
      droidspaces: "on"
      droidspaces_ntsync: true
      use_zram: true
      use_bbg: true
      use_rekernel: true
      use_nomount: false
      use_networking: true
      cve_2026_43499_patch: true
      artifact_upload_mode: "上传全部"
    secrets: inherit
