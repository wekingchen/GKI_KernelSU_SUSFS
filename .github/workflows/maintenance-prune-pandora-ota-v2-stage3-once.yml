name: "仓库维护 / Pandora OTA V2 第三阶段分支收尾"

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/maintenance-prune-pandora-ota-v2-stage3-once.yml"

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "确认 PR #126 已合并与上游不存在该分支，仅删除本仓开发分支"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target='feat/pandora-ota-v2-guided-diagnostics'
          expected='871ad8e759a36cc0ac4772f003fe5d91fe9afc7e'
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/126")"
          jq -e --arg head "$target" --arg sha "$expected" \
            '.merged == true and .base.ref == "dev" and .head.ref == $head and .head.sha == $sha' <<<"$pr" >/dev/null
          # Use the public upstream Git reference, not the anonymous REST API
          # (which can return 403 rate limit even for an absent branch).
          upstream_ref="$(git ls-remote https://github.com/zzh20188/GKI_KernelSU_SUSFS.git "refs/heads/$target")"
          [[ -z "$upstream_ref" ]] || {
            echo "::error::Branch exists on upstream; refusing local cleanup"; exit 1;
          }
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$target" --jq .object.sha)"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::Branch moved after merge; refusing deletion"; exit 1;
          }
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$target"
          echo "Only merged Pandora OTA V2 local branch was pruned." >> "$GITHUB_STEP_SUMMARY"
