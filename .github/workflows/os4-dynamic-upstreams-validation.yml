name: "OS4 dynamic stable upstreams one-shot validation"
# rerun with direct resolved-upstreams shell injection

on:
  push:
    branches:
      - os4-dynamic-upstreams-lkg-promotion-20261031
    paths:
      - ".github/workflows/os4-dynamic-upstreams-validation.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: os4-dynamic-stable-upstreams-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: "检出候选代码"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "静态检查生产入口"
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            scripts/xiaomi-os4/resolve-stable-upstreams.sh \
            scripts/xiaomi-os4/build-r62-features.sh \
            scripts/xiaomi-os4/apply-os3-parity-extras.sh \
            scripts/xiaomi-os4/apply-os4-selected-extras.sh \
            scripts/xiaomi-os4/package-validated-anykernel3.sh; do
            bash -n "$f"
          done
          python3 -m py_compile \
            scripts/xiaomi-os4/describe-image-reproducibility.py \
            scripts/xiaomi-os4/promote-custom-run-to-lkg.py \
            scripts/xiaomi-os4/verify-lkg-image-equivalence.py
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "YAML_OK=#{f}" }' \
            .github/workflows/xiaomi-sm8850-os4-custom.yml \
            .github/workflows/xiaomi-sm8850-os4-lkg.yml \
            .github/workflows/xiaomi-sm8850-os4-promote-lkg.yml

      - name: "解析最新稳定组件快照"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/resolved-upstreams.env"
          bash scripts/xiaomi-os4/resolve-stable-upstreams.sh "$OUT"
          cat "$OUT" >> "$GITHUB_ENV"

      - name: "安装构建依赖"
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git jq libdw-dev \
            libelf-dev libssl-dev patch perl python3 rsync tar unzip xz-utils \
            zip zstd dwarves

      - name: "恢复固定 R62 源码缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/common-r62.git
          key: xiaomi-pandora-os4-common-e2b8ca7c8d05-v1

      - name: "恢复固定 r536225 工具链"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/toolchain-r536225
          key: xiaomi-pandora-os4-toolchain-r536225-verified-v1

      - name: "恢复编译缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/ccache-r62
          key: xiaomi-pandora-os4-ccache-r62-dynamic-${{ hashFiles('scripts/xiaomi-os4/**', '.github/config/*.env', 'security_patch/**') }}
          restore-keys: |
            xiaomi-pandora-os4-ccache-r62-custom-
            xiaomi-pandora-os4-ccache-r62-

      - name: "使用解析快照编译默认全功能 OS4"
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/resolved-upstreams.env"

          export XIAOMI_OS4_SELECTABLE_BUILD=1
          export XIAOMI_OS4_ROOT_MODE=bakasu-susfs
          export XIAOMI_OS4_SUSFS_EXTRA_FEATURES=1
          export XIAOMI_OS4_USE_NOMOUNT=1
          export XIAOMI_OS4_DROIDSPACES=1
          export XIAOMI_OS4_USE_NTSYNC=1
          export XIAOMI_OS4_USE_BBG=1
          export XIAOMI_OS4_USE_REKERNEL=1
          export XIAOMI_OS4_USE_NETWORKING=1
          export XIAOMI_OS4_USE_CVE=1

          export OS4_BAKASU_REF_KIND="$RESOLVED_BAKASU_KIND"
          export OS4_BAKASU_REF="$RESOLVED_BAKASU_REF"
          export OS4_BAKASU_COMMIT="$RESOLVED_BAKASU_COMMIT"

          export OS4_SUSFS_REF_KIND="$RESOLVED_SUSFS_KIND"
          export OS4_SUSFS_BRANCH="$RESOLVED_SUSFS_REF"
          export OS4_SUSFS_COMMIT="$RESOLVED_SUSFS_COMMIT"

          export OS4_NOMOUNT_REF_KIND="$RESOLVED_NOMOUNT_KIND"
          export OS4_NOMOUNT_REF="$RESOLVED_NOMOUNT_REF"
          export OS4_NOMOUNT_COMMIT="$RESOLVED_NOMOUNT_COMMIT"

          export OS4_DROIDSPACES_REF_KIND="$RESOLVED_DROIDSPACES_KIND"
          export OS4_DROIDSPACES_REF="$RESOLVED_DROIDSPACES_REF"
          export OS4_DROIDSPACES_COMMIT="$RESOLVED_DROIDSPACES_COMMIT"

          export OS4_NTSYNC_REF_KIND="$RESOLVED_NTSYNC_KIND"
          export OS4_NTSYNC_PATCH_REF="$RESOLVED_NTSYNC_REF"
          export OS4_NTSYNC_PATCH_COMMIT="$RESOLVED_NTSYNC_COMMIT"

          export OS4_BBG_REF_KIND="$RESOLVED_BBG_KIND"
          export OS4_BBG_REF="$RESOLVED_BBG_REF"
          export OS4_BBG_COMMIT="$RESOLVED_BBG_COMMIT"

          export OS4_REKERNEL_REF_KIND="$RESOLVED_REKERNEL_KIND"
          export OS4_REKERNEL_REF="$RESOLVED_REKERNEL_REF"
          export OS4_REKERNEL_COMMIT="$RESOLVED_REKERNEL_COMMIT"

          bash scripts/xiaomi-os4/build-r62-features.sh

      - name: "验证上游身份与 ABI/KMI"
        shell: bash
        run: |
          set -euo pipefail
          source .github/config/pandora-os4-full-parity-lkg.env
          RES="$RUNNER_TEMP/xiaomi-os4-integrated/results"

          grep -qx "BAKASU_COMMIT=$RESOLVED_BAKASU_COMMIT" "$RES/build-metadata.txt"
          grep -qx "SUSFS_COMMIT=$RESOLVED_SUSFS_COMMIT" "$RES/build-metadata.txt"
          grep -qx "NOMOUNT_COMMIT=$RESOLVED_NOMOUNT_COMMIT" "$RES/build-metadata.txt"
          grep -qx "DROIDSPACES_COMMIT=$RESOLVED_DROIDSPACES_COMMIT" "$RES/build-metadata.txt"

          python3 - "$RES/Module.symvers" "$LKG_ABI_ALLOWED_NEW_EXPORTS" "$LKG_ABI_LOCK_BASE_EXPORTS" "$LKG_ABI_LOCK_SHA256" <<'PY'
          from pathlib import Path
          import hashlib
          import sys
          symvers, allow_path, expected_count, expected_sha = sys.argv[1:]
          allowed = {
              x.strip() for x in Path(allow_path).read_text().splitlines()
              if x.strip() and not x.lstrip().startswith("#")
          }
          entries = {}
          for line in Path(symvers).read_text(errors="replace").splitlines():
              p = line.split()
              if len(p) >= 2 and p[1] not in allowed:
                  entries[p[1]] = p[0]
          canonical = "".join(f"{k}\t{entries[k]}\n" for k in sorted(entries))
          sha = hashlib.sha256(canonical.encode()).hexdigest()
          if len(entries) != int(expected_count) or sha != expected_sha:
              raise SystemExit(f"ABI mismatch count={len(entries)} sha={sha}")
          print("ABI_LOCK=PASS")
          PY

      - name: "生成候选测试镜像和 AnyKernel3"
        shell: bash
        run: |
          set -euo pipefail
          source .github/config/pandora-os4-full-parity-lkg.env
          RES="$RUNNER_TEMP/xiaomi-os4-integrated/results"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"

          IMAGE_SHA="$(sha256sum "$RES/Image" | awk '{print $1}')"
          RELEASE="$(sed -n 's/^KERNEL_RELEASE=//p' "$RES/build-metadata.txt")"
          python3 scripts/xiaomi-os4/describe-image-reproducibility.py "$RES/Image" \
            --output-env "$OUT/image-reproducibility.env"

          BOOT="$OUT/pandora-OS4-R62-DYNAMIC-STABLE-FASTBOOT-BOOT-ONLY.img"
          python3 scripts/xiaomi-os4/repack-fastboot-boot-v4-from-fixture.py \
            .github/config/pandora-os4-r62-tested-boot-v4-fixture.json \
            "$RES/Image" "$BOOT" \
            --expected-image-sha256 "$IMAGE_SHA" \
            --expected-release "$RELEASE" \
            --expected-build "$LKG_SYSTEM_BUILD"

          XIAOMI_AK3_MODE=custom \
          XIAOMI_AK3_RELEASE="$RELEASE" \
            bash scripts/xiaomi-os4/package-validated-anykernel3.sh "$RES/Image" "$OUT"

          cp "$RUNNER_TEMP/resolved-upstreams.env" "$OUT/"
          cp "$RES/build-metadata.txt" "$OUT/"
          cp "$RES/Module.symvers" "$OUT/"
          cp "$RES/final.config" "$OUT/"
          cp "$RES/os3-parity-source.env" "$OUT/" 2>/dev/null || true
          cp "$RES/os4-selected-source.env" "$OUT/" 2>/dev/null || true

      - name: "验证同 SHA BakaSU Manager"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/xiaomi-os4/fetch-compatible-bakasu-manager.sh \
            "$RUNNER_TEMP/manager" "$RESOLVED_BAKASU_COMMIT"
          grep -qx "BAKASU_TARGET_COMMIT=$RESOLVED_BAKASU_COMMIT" \
            "$RUNNER_TEMP/manager/manager-metadata.txt"

      - name: "上传验证产物"
        uses: actions/upload-artifact@v6
        with:
          name: os4-dynamic-stable-upstreams-validation
          path: |
            ${{ runner.temp }}/out/*
            ${{ runner.temp }}/manager/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
