name: 维护 / 清理本次维护自身日志

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/maintenance-cleanup-local-20261123.yml

permissions:
  actions: write

jobs:
  cleanup-maintenance-history:
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded maintenance runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 45117782237 45117859146; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}")"
            if [ "$code" != "204" ] && [ "$code" != "404" ]; then
              echo "::error::Failed deleting maintenance run $run_id (HTTP $code)"
              exit 1
            fi
          done
