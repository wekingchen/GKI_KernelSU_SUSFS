name: 维护 / 清理 Pandora 4.0.6 临时 Actions 记录

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/maintenance-prune-pandora406-runs-20261123.yml

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete audited temporary Pandora runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ids=(44926333681 44922452680 44912983502 44912654297 44912499395 44912345351 44912252536 44912109438 44912013353 44909779973 44909608956 44908747343 44908512061 44907799876 44907598323 44907479503 44907393069 44907334550 44907158941 44905313406 44905308450 44904943896 44904322851 44904260190 44904165881 44904123425 44903724196 44903615504 44903500899 44903099720 44901587883 44900070853 44899791183 44899714311 44899467412 44899319807 44899227585 44899135590 44899050419 44898758565 44898559950 44898287199 44897936109 44894909559 44894676487 44894376465 44894244089 44894223960 44894147976 44892683753 44892287725 44891781182 44891562991 44891447936 44891399992 44891204727 44891192475 43688686793)
          deleted=0
          for run_id in "${ids[@]}"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}")"
            if [ "$code" = "204" ]; then
              deleted=$((deleted+1))
            elif [ "$code" != "404" ]; then
              echo "::error::Failed deleting audited run $run_id (HTTP $code)"
              exit 1
            fi
          done
          echo "Deleted audited Pandora temporary runs: $deleted" >> "$GITHUB_STEP_SUMMARY"
