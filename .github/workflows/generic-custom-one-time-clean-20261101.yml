name: "一次性维护 / 清理已合并的 K50Pro 自动同步开发分支"
on:
  push:
    paths:
      - ".github/workflows/generic-custom-one-time-clean-20261101.yml"
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "核对 PR #44 和精确 SHA，清理实验分支"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/44" --jq .merged)" == true ]] || exit 1
          BRANCH="os4-generic-custom-autosync-20261101"
          EXPECTED="3da213b64a0e7a78d6fe318504805cf54f5e3cfc"
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)"
          [[ "$CURRENT" == "$EXPECTED" ]] || exit 1
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq "[.[] | select(.head.ref==\"$BRANCH\")] | length")" == 0 ]] || exit 1
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" >/dev/null
          echo "已删除合并后的临时开发分支，保留自动同步正式工作流" >> "$GITHUB_STEP_SUMMARY"
