name: "红米 K50 Pro / 上游 build.yml 无人值守同步"
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/generic-custom-auto-sync.yml"
      - "scripts/generic-custom/run_auto_sync.sh"
      - "scripts/generic-custom/sync_fork_build.py"
      - "scripts/generic-custom/try_native_upstream.sh"
      - "scripts/generic-custom/native_upstream_policy.py"
      - ".github/config/generic-custom-route.json"
      - ".github/config/generic-custom-upstream-sync.json"
permissions:
  contents: write
  actions: write
concurrency:
  group: k50pro-private-build-upstream-auto-sync
  cancel-in-progress: false
jobs:
  check-rebase-and-build:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: "检查自动同步专用凭据"
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${SYNC_TOKEN:-}" ]]; then
            echo "::error title=自动同步缺少凭据::请在仓库 Settings → Secrets and variables → Actions 新增 UPSTREAM_SYNC_PAT。"
            echo "::error::必须授予本仓 Contents: Read and write、Workflows: Read and write；默认 GITHUB_TOKEN 无法更新工作流文件。"
            exit 1
          fi
          if ! GH_TOKEN="$SYNC_TOKEN" gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name' >/dev/null; then
            echo "::error::UPSTREAM_SYNC_PAT 无法访问本仓库，请检查 Token 有效期、授权仓库与 SSO 权限。"
            exit 1
          fi
      - name: "检出当前稳定 dev"
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.UPSTREAM_SYNC_PAT }}
      - name: "优先验证上游原版 → 原版通过即自动恢复；否则继续隔离补丁同步"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_PAT }}
        run: |
          set -euo pipefail
          if bash scripts/generic-custom/try_native_upstream.sh; then
            echo "上游原版已恢复或原版模式无新更新，无须执行隔离版同步。"
          else
            echo "原版尚未验证通过，保留旧稳定入口，继续安全跟进隔离补丁。"
            bash scripts/generic-custom/run_auto_sync.sh
          fi
