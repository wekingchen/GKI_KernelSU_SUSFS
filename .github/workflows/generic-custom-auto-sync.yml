name: "红米 K50 Pro / 上游 build.yml 无人值守同步"
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/generic-custom-auto-sync.yml"
      - "scripts/generic-custom/run_auto_sync.sh"
      - "scripts/generic-custom/sync_fork_build.py"
      - "scripts/generic-custom/try_native_upstream.sh"
      - "scripts/generic-custom/native_upstream_policy.py"
      - ".github/config/generic-custom-route.json"
      - ".github/config/generic-custom-upstream-sync.json"
permissions:
  contents: write
  actions: write
concurrency:
  group: k50pro-private-build-upstream-auto-sync
  cancel-in-progress: false
jobs:
  check-rebase-and-build:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: "检出当前稳定 dev"
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
      - name: "优先验证上游原版 → 原版通过即自动恢复；否则继续隔离补丁同步"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if bash scripts/generic-custom/try_native_upstream.sh; then
            echo "上游原版已恢复或原版模式无新更新，无须执行隔离版同步。"
          else
            echo "原版尚未验证通过，保留旧稳定入口，继续安全跟进隔离补丁。"
            bash scripts/generic-custom/run_auto_sync.sh
          fi
