name: "临时诊断 / pandora 4.0.6 GKI Image 二进制重建差异只读定位"
on:
  push:
    branches:
      - audit/pandora-406-module-delivery-repro
    paths:
      - .github/workflows/pandora-406-image-drift-once.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS' && github.ref == 'refs/heads/audit/pandora-406-module-delivery-repro'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: "完整审计并固定旧候选归档输入"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/pandora-image-drift"
          mkdir -p "$D/locked" "$D/reports"
          for file in Image final.config Module.symvers build-metadata.txt locked-candidate.env stock-report.json; do
            gh release download pandora-os4-ota-candidate-OS4.0.6.0.XBLCNXM \
              --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir "$D/locked"
          done
          cd "$D/locked"
          echo 'af955281efe49ef22cac3efd4072cfd683ee6ab3f48a173932fbb4442b8a1287  Image' | sha256sum -c -
          echo 'f9c26021d6984036dbd3d34b1ce9709169cbb43e2dfc0758218ce9a2b52150f9  final.config' | sha256sum -c -
          echo '242f6b3668e6f895c894bfbd35096c2f408a1b546b3cd0649bae4ed1d99dce25  Module.symvers' | sha256sum -c -
          echo '75b1641bf3c0b70094649f73b47ab1a85868f11a55d09745d8eb5b27e1c32ab0  locked-candidate.env' | sha256sum -c -
          echo '59bea9d2acdb8b3ae3d5250cab118aca778b2bffd4ef52efc76b055b7e139601  stock-report.json' | sha256sum -c -
          jq -e '.build=="OS4.0.6.0.XBLCNXM" and .safe_to_flash == false' stock-report.json
          grep -Fxq 'FLASHABLE=NO' build-metadata.txt
      - name: "仅安装必要 GKI 编译依赖"
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache cpio curl flex git jq libdw-dev libelf-dev libssl-dev patch perl python3 rsync tar unzip xz-utils zip zstd dwarves
      - name: "复用已校验 r536225 工具链缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/toolchain-r536225
          key: xiaomi-pandora-os4-toolchain-r536225-verified-v1
      - name: "重新编译与旧归档相同版本的 GKI，仅比较不打包"
        env:
          OTA_CANDIDATE_ENV: ${{ runner.temp }}/pandora-image-drift/locked/locked-candidate.env
          OTA_STOCK_REPORT_PATH: ${{ runner.temp }}/pandora-image-drift/locked/stock-report.json
          XIAOMI_OS4_JOBS: '6'
        run: |
          set -euo pipefail
          bash scripts/xiaomi-os4/build-ota-gki-baseline-candidate.sh
          D="$RUNNER_TEMP/pandora-image-drift"
          cmp "$D/locked/final.config" "$RUNNER_TEMP/ota-candidate/results/final.config"
          cmp "$D/locked/Module.symvers" "$RUNNER_TEMP/ota-candidate/results/Module.symvers"
      - name: "比较 Image 实际不同字节并单独比较证书/Build-ID 归一化"
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/pandora-image-drift/locked/Image" "$RUNNER_TEMP/ota-candidate/results/Image" "$RUNNER_TEMP/pandora-image-drift/reports/image-drift.json" <<'PY'
          import hashlib, importlib.util, json, sys
          from pathlib import Path
          files=[Path(sys.argv[1]),Path(sys.argv[2])]
          data=[p.read_bytes() for p in files]
          digest=lambda d: hashlib.sha256(d).hexdigest()
          result={'schema':1,'source':'LOCKED_GKI_R74_NOT_OEM','gate':'BLOCKED',
                  'flashable':False,'eligible_for_fastboot_boot':False,
                  'byte_identical':data[0]==data[1],
                  'archived_image':{'sha256':digest(data[0]),'size':len(data[0])},
                  'recompiled_image':{'sha256':digest(data[1]),'size':len(data[1])}}
          span=min(len(data[0]),len(data[1]))
          changed=sum(a!=b for a,b in zip(data[0][:span],data[1][:span]))
          result['different_byte_count_in_common_length']=changed
          result['first_different_offset']=next((i for i,(a,b) in enumerate(zip(data[0][:span],data[1][:span])) if a!=b),None)
          result['different_4096_byte_blocks']=sum(
               data[0][i:i+4096]!=data[1][i:i+4096]
               for i in range(0,max(len(data[0]),len(data[1])),4096))
          try:
              spec=importlib.util.spec_from_file_location('describe_repro',
                  'scripts/xiaomi-os4/describe-image-reproducibility.py')
              helper=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(helper)
              normalized=[]
              for b in data:
                  copy=bytearray(b)
                  offset=helper.locate_top_level_build_id(b)
                  co,cs,cert=helper.locate_autogenerated_cert(b)
                  copy[offset:offset+20]=bytes(20)
                  copy[co:co+cs]=bytes(cs)
                  normalized.append(bytes(copy))
                  if b is data[0]:
                      key='archived'
                  else:
                      key='recompiled'
                  result[key+'_build_id']=b[offset:offset+20].hex()
                  result[key+'_cert_sha256']=digest(cert)
                  result[key+'_cert_length']=cs
                  result[key+'_cert_offset']=co
              result['normalization_applicable']=True
              result['normalized_sha256']=[digest(x) for x in normalized]
              result['normalized_byte_identical']=normalized[0]==normalized[1]
          except Exception as exc:
              result['normalization_applicable']=False
              result['normalization_error']=str(exc)[:160]
              result['normalized_byte_identical']=False
          result['reason']=('Byte-identical GKI Image' if result['byte_identical']
                            else 'GKI Image differs; static ABI is not proof of byte-for-byte reproducibility')
          Path(sys.argv[3]).write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          print('NO_FLASH=YES')
          PY
      - name: "只归档 JSON 差异，不归档二进制候选"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pandora-406-gki-image-drift-readonly
          path: ${{ runner.temp }}/pandora-image-drift/reports/image-drift.json
          if-no-files-found: warn
          retention-days: 30
      - name: "中文报告：本轮一律保持 OEM gate BLOCKED"
        if: always()
        run: |
          echo '## pandora r74 GKI Image 复现只读调查' >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "$RUNNER_TEMP/pandora-image-drift/reports/image-drift.json" ]]; then
            jq '{byte_identical,different_byte_count_in_common_length,first_different_offset,different_4096_byte_blocks,normalization_applicable,normalized_byte_identical,normalization_error,gate}' "$RUNNER_TEMP/pandora-image-drift/reports/image-drift.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '**任何二进制一致或归一化一致都不代表 OEM 内核兼容、可刷或 LKG。**' >> "$GITHUB_STEP_SUMMARY"
