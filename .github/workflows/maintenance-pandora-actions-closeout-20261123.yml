name: 仓库维护 / Pandora Actions 收尾

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/maintenance-pandora-actions-closeout-20261123.yml

permissions:
  actions: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Delete audited Pandora leftovers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ids=(42867690188 42867573587 42866434854 42866241803 44893528648 44893480365 44893394666 44900300408 44893780289 44891806317 42880193591 42867977513 45118541420)
          for run_id in "${ids[@]}"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}")"
            if [ "$code" != "204" ] && [ "$code" != "404" ]; then
              echo "::error::Failed deleting run $run_id (HTTP $code)"
              exit 1
            fi
          done
