name: "临时诊断 / pandora 4.0.6 原厂模块供给与签名只读审计"
# Retry 2: allow repeatable .modinfo parmtype while strictly rejecting conflicting identity.
on:
  push:
    branches:
      - audit/pandora-406-module-delivery-repro
    paths:
      - .github/workflows/pandora-406-module-delivery-once.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS' && github.ref == 'refs/heads/audit/pandora-406-module-delivery-repro'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: "只读来源隔离正反例、解析器语法"
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/xiaomi-os4/audit-stock-module-delivery-readonly.py
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_audit_stock_module_delivery.py' -v
      - name: "获取完全相同原厂 OTA 已归档证据并锁 SHA"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stock" "$RUNNER_TEMP/pandora-readonly"
          gh release download pandora-os4-stock-input --repo "$GITHUB_REPOSITORY" --pattern '*xm.zip' --dir "$RUNNER_TEMP/stock"
          mapfile -t ZIPS < <(find "$RUNNER_TEMP/stock" -maxdepth 1 -name '*xm.zip' -type f)
          [[ ${#ZIPS[@]} == 1 ]]
          [[ "$(sha256sum "${ZIPS[0]}" | cut -d ' ' -f1)" == "bebb8754c16dd30c724fdba3687694e615e03342d6f5f55918cd06f1dca8cbb8" ]]
          printf '%s\n' "${ZIPS[0]}" > "$RUNNER_TEMP/pandora-readonly/stock-file.txt"
      - name: "验证真实 system/vendor 模块 CRC、哈希、签名标记"
        run: |
          set -euo pipefail
          python3 scripts/xiaomi-os4/audit-stock-module-delivery-readonly.py \
            --stock-zip "$(cat "$RUNNER_TEMP/pandora-readonly/stock-file.txt")" \
            --output "$RUNNER_TEMP/pandora-readonly/module-delivery.json"
          jq -e '.gate == "BLOCKED" and .flashable == false and .inventory_provenance_checked == true and .module_delivery_verified == false and .vendor_system_zsmalloc_interchangeable == false and .inventory_module_count == 505' \
            "$RUNNER_TEMP/pandora-readonly/module-delivery.json"
      - name: "补充锁定的 GKI 配置与候选系统模块签名策略（绝不当作原厂配置）"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download pandora-os4-ota-candidate-OS4.0.6.0.XBLCNXM \
            --repo "$GITHUB_REPOSITORY" --pattern 'final.config' --dir "$RUNNER_TEMP/pandora-readonly"
          [[ "$(sha256sum "$RUNNER_TEMP/pandora-readonly/final.config" | cut -d ' ' -f1)" == "f9c26021d6984036dbd3d34b1ce9709169cbb43e2dfc0758218ce9a2b52150f9" ]]
          python3 - "$RUNNER_TEMP/pandora-readonly/final.config" "$RUNNER_TEMP/pandora-readonly/gki-config-only.json" <<'PY'
          import json,sys
          from pathlib import Path
          src=Path(sys.argv[1]).read_text().splitlines()
          allowed=('CONFIG_MODULE_SIG','CONFIG_MODULE_SIG_FORCE','CONFIG_MODULE_SIG_ALL','CONFIG_MODULE_SIG_SHA256',
                   'CONFIG_ANDROID_BINDER_IPC','CONFIG_ANDROID_BINDER_IPC_C','CONFIG_ANDROID_BINDER_IPC_RUST',
                   'CONFIG_ANDROID_BINDER_IPC_DEFAULT_IS_RUST','CONFIG_MODVERSIONS','CONFIG_RUST')
          values={}
          for k in allowed:
              value=next((line.split('=',1)[1] for line in src if line.startswith(k+'=')),None)
              if value is None and ('# '+k+' is not set') in src: value='n'
              values[k]=value if value is not None else 'NOT_RECORDED'
          report={'schema':1,'source':'LOCKED_UNMODIFIED_GKI_CANDIDATE_CONFIG_NOT_OEM',
                  'verified_stock_kernel_config':False,'values':values,
                  'signing_authority_verified':False,'flashable':False}
          Path(sys.argv[2]).write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: "只上传有限 JSON 证据；不传 boot/Image/ko/私钥"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pandora-406-stock-module-delivery-readonly
          path: |
            ${{ runner.temp }}/pandora-readonly/module-delivery.json
            ${{ runner.temp }}/pandora-readonly/gki-config-only.json
          if-no-files-found: warn
          retention-days: 30
      - name: "结果说明"
        if: always()
        run: |
          echo '## pandora 原厂模块供给证据（只读）' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/pandora-readonly/module-delivery.json" ]]; then
            jq '{gate,reason,inventory_provenance_checked,inventory_module_count,system_dlkm_partition_image_in_stock_input,module_manifests_in_collected_inventory,module_delivery_verified,actual_loaded_rust_binder_sha256,actual_loaded_zsmalloc_sha256}' \
              "$RUNNER_TEMP/pandora-readonly/module-delivery.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '**此工作流绝不解析为可刷机资格；未证明实际加载、AVB/签名信任或 Binder 实现。**' >> "$GITHUB_STEP_SUMMARY"
