name: "Xiaomi 17 Pro OS4 / 6.12.69 补丁兼容验证（不可刷机）"

on:
  push:
    branches:
      - "os4/pandora-6.12.69-adaptation-20261029"
    paths:
      - ".github/workflows/xiaomi-sm8850-os4-preflight.yml"
      - ".github/config/xiaomi-sm8850-os4-6.12.69.env"
      - "docs/xiaomi-sm8850-os4-6.12.69.md"
      - "scripts/xiaomi-os4/susfs-task-mmu-compat.py"

permissions:
  contents: read

concurrency:
  group: xiaomi-os4-source-audit
  cancel-in-progress: true

jobs:
  source-preflight:
    name: "官方 R62 源码 / KMI / SUSFS R62 兼容验证"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: "检出独立 OS4 适配分支"
        uses: actions/checkout@v7

      - name: "读取 OS4 设备基线与源码锁定配置"
        shell: bash
        run: |
          set -euo pipefail
          source .github/config/xiaomi-sm8850-os4-6.12.69.env
          test "$OS4_DEVICE" = pandora
          test "$OS4_ANDROID_PLATFORM" = 17
          test "$OS4_KERNEL_VERSION" = 6.12.69
          test "$OS4_STOCK_KMI" = android16-6
          test "$OS4_KMI_GENERATION" = 6
          test "$OS4_GKI_BRANCH" = android16-6.12-2026-03
          test "$OS4_GKI_TAG" = android16-6.12-2026-03_r62
          test "$OS4_GKI_COMMON_COMMIT" = e2b8ca7c8d0551a6124b1a7322f5ae532845f1b5
          echo "OS4 source configuration: PASS"
          echo "GKI candidate is NOT equivalent to OEM release: $OS4_STOCK_KERNEL_RELEASE"

      - name: "缓存官方 R62 GKI Git 对象"
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/os4/common/.git
          key: xiaomi-pandora-os4-r62-git-e2b8ca7c8d05-v1

      - name: "获取并核验 Google 官方 GKI 源码"
        shell: bash
        run: |
          set -euo pipefail
          source .github/config/xiaomi-sm8850-os4-6.12.69.env
          mkdir -p "$RUNNER_TEMP/os4"
          cd "$RUNNER_TEMP/os4"
          git init -q common
          git -C common remote get-url origin >/dev/null 2>&1 || git -C common remote add origin "$OS4_GKI_COMMON_URL"
          git -C common remote set-url origin "$OS4_GKI_COMMON_URL"
          git -C common fetch --depth=1 --no-tags origin "refs/tags/$OS4_GKI_TAG"
          resolved="$(git -C common rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "$resolved" != "$OS4_GKI_COMMON_COMMIT" ]]; then
            echo "::error::GKI tag commit drift: $resolved"
            exit 1
          fi
          git -C common checkout -q --detach "$resolved"
          version="$(awk '/^VERSION = /{a=$3} /^PATCHLEVEL = /{b=$3} /^SUBLEVEL = /{c=$3} END{print a "." b "." c}' common/Makefile)"
          branch="$(sed -n 's/^BRANCH=//p' common/build.config.constants)"
          kmi="$(sed -n 's/^KMI_GENERATION=//p' common/build.config.constants)"
          clang="$(sed -n 's/^CLANG_VERSION=//p' common/build.config.constants)"
          printf 'source commit: %s\nversion: %s\nbranch: %s\nkmi generation: %s\nclang: %s\n' "$resolved" "$version" "$branch" "$kmi" "$clang"
          {
            echo "GKI_TAG=$OS4_GKI_TAG"
            echo "GKI_COMMIT=$resolved"
            echo "GKI_KERNEL_VERSION=$version"
            echo "GKI_BRANCH=$branch"
            echo "GKI_KMI_GENERATION=$kmi"
            echo "GKI_CLANG=$clang"
            echo "STOCK_RELEASE=$OS4_STOCK_KERNEL_RELEASE"
          } > "$RUNNER_TEMP/os4/source-audit.txt"
          [[ "$version" == "$OS4_KERNEL_VERSION" ]] || { echo "::error::unexpected kernel version $version"; exit 1; }
          [[ "$branch" == android16-6.12 ]] || { echo "::error::unexpected GKI branch $branch"; exit 1; }
          [[ "$kmi" == "$OS4_KMI_GENERATION" ]] || { echo "::error::KMI mismatch $kmi"; exit 1; }
          [[ "$clang" == "$OS4_GKI_EXPECTED_CLANG" ]] || { echo "::error::Clang mismatch $clang"; exit 1; }
          if [[ -f common/gki/aarch64/symbols/xiaomi ]]; then
            echo "GKI_XIAOMI_SYMBOL_LIST=present" >> "$RUNNER_TEMP/os4/source-audit.txt"
          else
            echo "GKI_XIAOMI_SYMBOL_LIST=absent" >> "$RUNNER_TEMP/os4/source-audit.txt"
            echo "::warning::R62 tag has no Xiaomi symbol list; KMI audit must account for that"
          fi
          echo "OFFICIAL_GKI_SOURCE_CHECK=PASS" >> "$RUNNER_TEMP/os4/source-audit.txt"

      - name: "查看 SUSFS 与 DroidSpaces 6.12 补丁兼容性（仅预览）"
        shell: bash
        run: |
          set -euo pipefail
          source .github/config/xiaomi-sm8850-os4-6.12.69.env
          cd "$RUNNER_TEMP/os4"
          echo "PATCH_DRY_RUN_NOTE=Preview only; no source integration or flash artifact" >> source-audit.txt
          if git clone -q --depth=1 --single-branch --branch "$OS4_SUSFS_BRANCH" "$OS4_SUSFS_REPO" susfs; then
            s_patch="susfs/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch"
            echo "SUSFS_COMMIT=$(git -C susfs rev-parse HEAD)" >> source-audit.txt
            if [[ -f "$s_patch" ]]; then
              if patch --dry-run --batch --forward -d common -p1 < "$s_patch" > susfs-preview.log 2>&1; then
                echo "SUSFS_UPSTREAM_PATCH_DRYRUN=PASS" >> source-audit.txt
              else
                echo "SUSFS_UPSTREAM_PATCH_DRYRUN=NEEDS_PORTING" >> source-audit.txt
                echo "::warning::SUSFS upstream patch is not clean on the pinned R62 source; inspect the preview log"
              fi
            else
              echo "SUSFS_UPSTREAM_PATCH_DRYRUN=PATCH_MISSING" >> source-audit.txt
              echo "::warning::expected SUSFS kernel patch is missing"
            fi
          else
            echo "SUSFS_UPSTREAM_PATCH_DRYRUN=FETCH_UNAVAILABLE" >> source-audit.txt
            echo "::warning::SUSFS upstream GitLab checkout unavailable; retry later"
          fi
          if git clone -q --depth=1 "$OS4_DROIDSPACES_REPO" droidspaces; then
            d_patch="droidspaces/Documentation/resources/kernel-patches/GKI/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch"
            echo "DROIDSPACES_COMMIT=$(git -C droidspaces rev-parse HEAD)" >> source-audit.txt
            if [[ -f "$d_patch" ]]; then
              if patch --dry-run --batch --forward -d common -p1 < "$d_patch" > droidspaces-preview.log 2>&1; then
                echo "DROIDSPACES_KABI_PATCH_DRYRUN=PASS" >> source-audit.txt
              else
                echo "DROIDSPACES_KABI_PATCH_DRYRUN=NEEDS_PORTING" >> source-audit.txt
                echo "::warning::DroidSpaces kABI patch is not clean on pinned R62; inspect preview log"
              fi
            else
              echo "DROIDSPACES_KABI_PATCH_DRYRUN=PATCH_MISSING" >> source-audit.txt
              echo "::warning::expected DroidSpaces kABI patch is missing"
            fi
          else
            echo "DROIDSPACES_KABI_PATCH_DRYRUN=FETCH_UNAVAILABLE" >> source-audit.txt
            echo "::warning::DroidSpaces source checkout unavailable; retry later"
          fi
          echo "No Image, AnyKernel3 or flashable payload was built."

      - name: "提取 R62 SUSFS 补丁冲突源码快照（不做修改）"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/os4"
          if [[ -f common/fs/proc/task_mmu.c && -f susfs/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch ]]; then
            mkdir -p diagnostic
            cp -f common/fs/proc/task_mmu.c diagnostic/task_mmu-R62-original.c
            cp -f susfs/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch diagnostic/susfs-6.12-upstream.patch
            git -C common rev-parse HEAD > diagnostic/common-commit.txt
            git -C susfs rev-parse HEAD > diagnostic/susfs-commit.txt
            echo "已保存完整原始 task_mmu.c 和上游 SUSFS 补丁，供精确移植；未修改源码"
          else
            echo "::warning::缺少 R62 或 SUSFS 补丁，无法生成源码诊断快照"
          fi

      - name: "保存源码快照（只用于适配，不可刷机）"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xiaomi-pandora-os4-susfs-source-context
          path: ${{ runner.temp }}/os4/diagnostic/
          if-no-files-found: warn
          retention-days: 7

      - name: "验证 R62 SUSFS 专用兼容层（临时 Runner 源码，不编译）"
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/os4"
          [[ "$(git -C common rev-parse HEAD)" == e2b8ca7c8d0551a6124b1a7322f5ae532845f1b5 ]] || {
            echo "::error::R62 GKI commit has changed; refuse an unverified port"
            exit 1
          }
          [[ "$(git -C susfs rev-parse HEAD)" == 519c86c5d8ad3832ff4a2e1a81dc1b81076f1693 ]] || {
            echo "::error::SUSFS source has changed; revalidate the compatibility script before use"
            exit 1
          }
          PATCH=susfs/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch
          HELPER="$GITHUB_WORKSPACE/scripts/xiaomi-os4/susfs-task-mmu-compat.py"
          python3 "$HELPER" filter-patch "$PATCH" susfs-filtered-R62.patch
          patch --dry-run --batch --forward -d common -p1 < susfs-filtered-R62.patch > susfs-compat-dryrun.log 2>&1 || {
            cat susfs-compat-dryrun.log
            echo "::error::Filtered SUSFS patch failed full-tree dry-run"
            exit 1
          }
          patch --batch --forward --no-backup-if-mismatch -d common -p1 < susfs-filtered-R62.patch > susfs-compat-apply.log 2>&1
          python3 "$HELPER" port-source common/fs/proc/task_mmu.c
          if find common -type f -name '*.rej' -print -quit | grep -q .; then
            echo "::error::SUSFS patch left reject files"
            exit 1
          fi
          # The upstream SUSFS patch itself has unrelated whitespace in
          # fs/stat.c and mm/memory.c. Keep a full report but strictly check
          # the newly ported task_mmu.c instead of hiding its formatting faults.
          if ! git -C common diff --check > susfs-upstream-whitespace.log 2>&1; then
            echo "::warning::Upstream SUSFS patch has unrelated whitespace warnings; recorded in artifact"
            cat susfs-upstream-whitespace.log
          fi
          git -C common diff --check -- fs/proc/task_mmu.c
          grep -Fq 'Skip hidden VMA after mmap_lock contention' common/fs/proc/task_mmu.c
          grep -Fq 'if (!vma->vm_file || !SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))' common/fs/proc/task_mmu.c
          git -C common diff -- fs/proc/task_mmu.c > susfs-R62-task-mmu-port.diff
          {
            echo 'R62_SUSFS_FILTERED_PATCH=PASS'
            echo 'R62_SUSFS_FULL_TREE_APPLY=PASS'
            echo 'R62_SUSFS_SMAPS_ROLLUP_PORT=PASS'
            echo 'R62_SUSFS_TASK_MMU_DIFF_CHECK=PASS'
            echo 'R62_SUSFS_UPSTREAM_WHITESPACE=RECORDED_SEPARATELY'
            echo 'R62_SUSFS_SOURCE_ONLY=YES'
          } >> source-audit.txt
          echo "R62 source-level SUSFS patch port PASS; no Image/ZIP built."

      - name: "保存 R62 SUSFS 兼容移植审查结果"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xiaomi-pandora-os4-susfs-R62-port-report
          path: |
            ${{ runner.temp }}/os4/susfs-compat-dryrun.log
            ${{ runner.temp }}/os4/susfs-compat-apply.log
            ${{ runner.temp }}/os4/susfs-R62-task-mmu-port.diff
            ${{ runner.temp }}/os4/susfs-upstream-whitespace.log
          if-no-files-found: warn
          retention-days: 14

      - name: "检查 BakaSU Built-in 与 NoMount 的 R62 源码集成（不编译）"
        shell: bash
        run: |
          set -euo pipefail
          source .github/config/xiaomi-sm8850-os4-6.12.69.env
          cd "$RUNNER_TEMP/os4"
          test -s source-audit.txt
          grep -qx 'R62_SUSFS_FULL_TREE_APPLY=PASS' source-audit.txt
          git clone -q --depth=1 --branch "$OS4_BAKASU_REF" "$OS4_BAKASU_REPO" BakaSU
          bakasu_commit="$(git -C BakaSU rev-parse HEAD)"
          [[ -f BakaSU/kernel/Kconfig && -f BakaSU/kernel/Makefile ]] || {
            echo "::error::BakaSU kernel source integration files missing"
            exit 1
          }
          grep -Fq 'config KSU_SUSFS' BakaSU/kernel/Kconfig || {
            echo "::error::BakaSU SUSFS hook is missing"
            exit 1
          }
          grep -Fq 'config KSU_TRACEPOINT_HOOK' BakaSU/kernel/Kconfig || {
            echo "::error::BakaSU tracepoint hook is missing"
            exit 1
          }
          [[ ! -e common/drivers/kernelsu ]] || {
            echo "::error::kernel source unexpectedly already integrates kernelsu"
            exit 1
          }
          ln -s "$(realpath --relative-to=common/drivers BakaSU/kernel)" common/drivers/kernelsu
          grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' common/drivers/Makefile ||
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> common/drivers/Makefile
          python3 - common/drivers/Kconfig <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          s = path.read_text()
          needle = '\nendmenu'
          pos = s.rfind(needle)
          if pos < 0 or 'source "drivers/kernelsu/Kconfig"' in s:
              raise SystemExit('unexpected R62 drivers/Kconfig structure')
          path.write_text(s[:pos] + '\nsource "drivers/kernelsu/Kconfig"\n' + s[pos:])
          PY
          [[ -L common/drivers/kernelsu ]] || exit 1
          grep -Fq 'source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig

          git clone -q --depth=1 --branch "$OS4_NOMOUNT_REF" "$OS4_NOMOUNT_REPO" common/NoMount
          nomount_commit="$(git -C common/NoMount rev-parse HEAD)"
          [[ -f common/NoMount/kernel/setup.sh ]] || {
            echo "::error::NoMount setup.sh is missing"
            exit 1
          }
          (cd common && sh NoMount/kernel/setup.sh "$nomount_commit") > nomount-os4-setup.log 2>&1 || {
            cat nomount-os4-setup.log
            echo "::error::NoMount setup failed against R62"
            exit 1
          }
          [[ -L common/fs/nomount ]] && [[ -f common/fs/nomount/Kconfig ]] || {
            echo "::error::NoMount R62 filesystem integration missing"
            exit 1
          }
          grep -Fq 'source "fs/nomount/Kconfig"' common/fs/Kconfig
          grep -Fq 'obj-$(CONFIG_NOMOUNT) += nomount/' common/fs/Makefile
          git -C common diff --check -- drivers/Kconfig drivers/Makefile fs/Kconfig fs/Makefile
          {
            echo "BAKASU_COMMIT=$bakasu_commit"
            echo "NOMOUNT_COMMIT=$nomount_commit"
            echo "R62_BAKASU_BUILTIN_SOURCE_LINK=PASS"
            echo "R62_BAKASU_SUSFS_KCONFIG=PASS"
            echo "R62_NOMOUNT_SETUP_SOURCE_ONLY=PASS"
            echo "R62_BAKASU_NOMOUNT_KERNEL_COMPILE=NOT_RUN"
          } >> source-audit.txt
          echo "BakaSU Built-in and NoMount source integration PASS (not compiled)."

      - name: "保存 BakaSU/NoMount 接入测试报告"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xiaomi-pandora-os4-bakasu-nomount-source-audit
          path: ${{ runner.temp }}/os4/nomount-os4-setup.log
          if-no-files-found: warn
          retention-days: 14

      - name: "解析 R62 BakaSU/SUSFS/NoMount 最终 Kconfig（不编译 Image）"
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/os4"
          grep -qx 'R62_NOMOUNT_SETUP_SOURCE_ONLY=PASS' source-audit.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bc bison flex libelf-dev libssl-dev clang lld
          mkdir -p kconfig-out
          make -C common ARCH=arm64 LLVM=1 O="$PWD/kconfig-out" gki_defconfig > kconfig-defconfig.log 2>&1 || {
            tail -n 100 kconfig-defconfig.log
            echo "::error::R62 gki_defconfig could not be generated"
            exit 1
          }
          common/scripts/config --file kconfig-out/.config \
            --enable KSU --enable KSU_SUSFS --disable KSU_TRACEPOINT_HOOK \
            --enable KSU_SUSFS_SUS_MAP --enable NOMOUNT
          make -C common ARCH=arm64 LLVM=1 O="$PWD/kconfig-out" olddefconfig > kconfig-olddefconfig.log 2>&1 || {
            tail -n 100 kconfig-olddefconfig.log
            echo "::error::R62 integrated Kconfig could not be resolved"
            exit 1
          }
          for key in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_MAP CONFIG_NOMOUNT; do
            grep -qx "$key=y" kconfig-out/.config || {
              echo "::error::R62 resolved .config does not enable $key"
              grep -E "^(# )?$key" kconfig-out/.config || true
              exit 1
            }
          done
          grep -qx '# CONFIG_KSU_TRACEPOINT_HOOK is not set' kconfig-out/.config || {
            echo "::error::unexpected BakaSU tracepoint hook in SUSFS inline mode"
            exit 1
          }
          # Actions upload-artifact excludes hidden .config by default.
          # Publish an ordinary file for reproducibility and KMI review.
          cp -f kconfig-out/.config resolved-os4-gki.config
          {
            echo 'R62_BAKASU_SUSFS_NOMOUNT_KCONFIG=PASS'
            echo 'R62_KERNEL_IMAGE_BUILD=NOT_RUN'
          } >> source-audit.txt
          echo "R62 gki_defconfig/olddefconfig integrated features PASS; no kernel Image was built."

      - name: "保存 R62 最终 Kconfig 与日志"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xiaomi-pandora-os4-integrated-kconfig-audit
          path: |
            ${{ runner.temp }}/os4/resolved-os4-gki.config
            ${{ runner.temp }}/os4/kconfig-defconfig.log
            ${{ runner.temp }}/os4/kconfig-olddefconfig.log
          if-no-files-found: warn
          retention-days: 14

      - name: "发布源码审查结论"
        if: always()
        shell: bash
        run: |
          {
            echo "## OS4 / Android 17 / 6.12.69 源码与补丁兼容验证"
            echo
            echo "**仅为静态源码预检，不是可刷内核，不表示真机兼容。**"
            echo
            echo '手机原厂内核：6.12.69-android16-6-g43b5ab7e247d-abogki561813157-4k'
            echo
            if [[ -f "$RUNNER_TEMP/os4/source-audit.txt" ]]; then
              echo '~~~text'
              cat "$RUNNER_TEMP/os4/source-audit.txt"
              echo '~~~'
            else
              echo "源码检查尚未产生报告，查看前面步骤的错误。"
            fi
            echo
            echo "下一阶段才做 BakaSU / SUSFS / NoMount / DroidSpaces 编译与 ABI 审计。"
            echo "OS3 旧内核与既有 stable/LKG 均未更动。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "保存源码审计报告"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xiaomi-pandora-os4-6.12.69-source-audit
          path: |
            ${{ runner.temp }}/os4/source-audit.txt
            ${{ runner.temp }}/os4/susfs-preview.log
            ${{ runner.temp }}/os4/droidspaces-preview.log
          if-no-files-found: warn
          retention-days: 14
