name: "仓库维护 / 清理已合并 OTA V2 第二阶段分支"

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/maintenance-prune-pandora-ota-v2-prod-once.yml"

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS'
    runs-on: ubuntu-latest
    steps:
      - name: "核对 PR 合并及上游不存在，只清理本仓临时开发分支"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target='feat/pandora-ota-v2-production-diagnostics'
          expected_sha='37ba25bd610d2e15d6be30ede3da932b56e8ef9a'
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/125")"
          jq -e --arg head "$target" --arg sha "$expected_sha" \
            '.merged == true and .base.ref == "dev" and .head.ref == $head and .head.sha == $sha' <<<"$pr" >/dev/null || exit 1
          upstream_code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/zzh20188/GKI_KernelSU_SUSFS/branches/$target")"
          [[ "$upstream_code" == 404 ]] || {
            echo "::error::Cannot prove upstream branch absent (HTTP $upstream_code)"; exit 1;
          }
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$target" --jq .object.sha)"
          [[ "$actual" == "$expected_sha" ]] || {
            echo "::error::Development branch changed since merge"; exit 1;
          }
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$target"
          echo "Pruned merged local branch: $target" >> "$GITHUB_STEP_SUMMARY"
