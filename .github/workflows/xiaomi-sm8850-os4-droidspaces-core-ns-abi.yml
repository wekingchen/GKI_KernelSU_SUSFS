name: "小米17 Pro OS4 / DroidSpaces PID+IPC namespace kABI 实验（不可刷机）"

# Validated historical stage. Keep reproducible, but do not auto-run when
# the shared OS4 build script grows later experiments.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: xiaomi-os4-r62-droidspaces-core-ns-abi
  cancel-in-progress: true

env:
  PIDS_BASE_RUN_ID: "41008768353"
  PIDS_BASE_ARTIFACT: "NOFLASH-pandora-OS4-R62-DroidSpaces-PIDs-netprio-KMI-repurpose"
  PIDS_BASE_SYMVERS_SHA256: "69dc25f5e78bb1b03332c0a8cf0169e239e1efbd51c04a7469aea95430f89b2f"

jobs:
  core-ns-abi:
    name: "PIDs 已通过基线 + 官方 6.12 kABI patch + PID/IPC namespace"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "检出 OS4 隔离分支"
        uses: actions/checkout@v7

      - name: "安全与语法检查"
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "os4/pandora-6.12.69-adaptation-20261029"
          bash -n scripts/xiaomi-os4/build-r62-features.sh
          ! grep -Eq 'fastboot[[:space:]]+flash|AnyKernel3.zip' scripts/xiaomi-os4/build-r62-features.sh
          grep -Fq '001.GKI-6.12-or-above-fix_sysvipc_kabi.patch' scripts/xiaomi-os4/build-r62-features.sh
          echo "本实验只做编译与 ABI/KMI 比较；不生成 boot.img。"

      - name: "清理 Runner 预装冗余工具"
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: "安装构建依赖"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache \
            cpio curl flex git jq libdw-dev libelf-dev libssl-dev patch perl python3 \
            rsync tar unzip xz-utils zip zstd dwarves

      - name: "恢复固定 Google R62 源码缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/common-r62.git
          key: xiaomi-pandora-os4-common-e2b8ca7c8d05-v1

      - name: "恢复已验证 Android r536225 Clang/Rust 工具链"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/toolchain-r536225
          key: xiaomi-pandora-os4-toolchain-r536225-verified-v1

      - name: "复用 R62 功能内核热缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/ccache-r62
          key: xiaomi-pandora-os4-ccache-r62-dscore-ns-${{ github.sha }}
          restore-keys: |
            xiaomi-pandora-os4-ccache-r62-dspids-kmi-
            xiaomi-pandora-os4-ccache-r62-features-
            xiaomi-pandora-os4-ccache-r62-

      - name: "构建 PID/IPC namespace kABI 候选"
        shell: bash
        env:
          XIAOMI_OS4_PIDS_REPURPOSE_NET_PRIO: "1"
          XIAOMI_OS4_DROIDSPACES_CORE_NAMESPACES: "1"
        run: |
          set -euo pipefail
          bash scripts/xiaomi-os4/build-r62-features.sh

      - name: "下载已真机启动且 PIDs PASS 的实验基线"
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.PIDS_BASE_ARTIFACT }}
          run-id: ${{ env.PIDS_BASE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pids-base

      - name: "核对新增配置仅限 DroidSpaces 必需 namespace 链"
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ runner.temp }}/pids-base/final.config"
          NEW="${{ runner.temp }}/xiaomi-os4-integrated/results/final.config"
          OUT="${{ runner.temp }}/xiaomi-os4-integrated/results/droidspaces-core-config-diff.txt"
          test -s "$BASE" && test -s "$NEW"

          for cfg in CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_PID_NS; do
            grep -qx "$cfg=y" "$NEW"
          done
          grep -qx '# CONFIG_CGROUP_PIDS is not set' "$NEW"
          grep -qx 'CONFIG_CGROUP_NET_PRIO=y' "$NEW"
          grep -qx 'CONFIG_CGROUP_NET_CLASSID=y' "$NEW"
          grep -qx 'CONFIG_SOCK_CGROUP_DATA=y' "$NEW"

          python3 - "$BASE" "$NEW" "$OUT" <<'PY'
          from pathlib import Path
          import sys
          a=Path(sys.argv[1]).read_text().splitlines()
          b=Path(sys.argv[2]).read_text().splitlines()
          def norm(lines):
              return {x for x in lines if not x.startswith("CONFIG_LOCALVERSION=")}
          only_a=sorted(norm(a)-norm(b))
          only_b=sorted(norm(b)-norm(a))
          Path(sys.argv[3]).write_text(
              "ONLY_PIDS_BASE:\n"+"\n".join(only_a)+"\n\nONLY_CORE_NS:\n"+"\n".join(only_b)+"\n"
          )
          print("ONLY_PIDS_BASE:")
          print("\n".join(only_a))
          print("\nONLY_CORE_NS:")
          print("\n".join(only_b))
          PY

      - name: "比较导出 ABI 与 PIDs 真机通过基线"
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ runner.temp }}/pids-base/Module.symvers"
          NEW="${{ runner.temp }}/xiaomi-os4-integrated/results/Module.symvers"
          OUT="${{ runner.temp }}/xiaomi-os4-integrated/results/droidspaces-core-abi-diff.txt"
          SAFETY="${{ runner.temp }}/xiaomi-os4-integrated/results/droidspaces-core-safety.txt"
          test -s "$BASE" && test -s "$NEW"
          printf '%s  %s\n' "$PIDS_BASE_SYMVERS_SHA256" "$BASE" | sha256sum -c -

          awk -F '\t' '
            NR==FNR {
              if ($3=="vmlinux") { base[$2]=$1; base_count++ }
              next
            }
            $3=="vmlinux" {
              if ($2 in base) {
                matched++
                if ($1 != base[$2]) {
                  conflicts++
                  if (conflicts <= 200) print "CRC_CHANGED " $2 " old=" base[$2] " new=" $1
                }
                delete base[$2]
              } else {
                added++
                if (added <= 200) print "NEW_EXPORT " $2 " crc=" $1
              }
            }
            END {
              for (name in base) {
                missing++
                if (missing <= 200) print "MISSING_EXPORT " name
              }
              print "BASE_VMLINUX_EXPORTS=" base_count
              print "MATCHED_SYMBOL_NAMES=" matched
              print "NEW_EXPORTS=" (added+0)
              print "MISSING_EXPORTS=" (missing+0)
              print "CRC_CONFLICTS=" (conflicts+0)
            }
          ' "$BASE" "$NEW" | tee "$OUT"

          conflicts="$(sed -n 's/^CRC_CONFLICTS=//p' "$OUT")"
          added="$(sed -n 's/^NEW_EXPORTS=//p' "$OUT")"
          missing="$(sed -n 's/^MISSING_EXPORTS=//p' "$OUT")"
          [[ -n "$conflicts" && -n "$added" && -n "$missing" ]] || exit 1

          mapfile -t new_names < <(awk '/^NEW_EXPORT /{print $2}' "$OUT" | sort -u)
          printf '%s\n' "${new_names[@]}" > "$RUNNER_TEMP/xiaomi-os4-integrated/results/droidspaces-core-new-exports.txt"
          # put_pid_ns is an upstream EXPORT_SYMBOL_GPL that appears only when
          # CONFIG_PID_NS=y; the other two are the explicit IPC exports needed
          # by modular rust_binder with CONFIG_IPC_NS=y.
          expected="$(printf '%s\n' init_ipc_ns put_ipc_ns put_pid_ns)"
          actual="$(printf '%s\n' "${new_names[@]}")"

          {
            if (( conflicts == 0 && missing == 0 && added == 3 )) && [[ "$actual" == "$expected" ]]; then
              echo "ABI_LAYOUT_RESULT=OLD_EXPORTS_ZERO_DIFF_PLUS_3_EXPECTED_NAMESPACE_EXPORTS"
              echo "SAFE_TO_FASTBOOT_BOOT=YES_EXPERIMENTAL"
              echo "REASON=All pre-existing vmlinux export CRCs preserved; only init_ipc_ns, put_ipc_ns and upstream put_pid_ns are newly exported"
            else
              echo "ABI_LAYOUT_RESULT=FAILED"
              echo "SAFE_TO_FASTBOOT_BOOT=NO"
              echo "REASON=Unexpected ABI delta outside the two required IPC namespace exports"
            fi
          } | tee "$SAFETY"

          if (( conflicts != 0 || missing != 0 || added != 3 )) || [[ "$actual" != "$expected" ]]; then
            exit 1
          fi

      - name: "记录实验结论"
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/xiaomi-os4-integrated/results"
          {
            echo "## DroidSpaces PID/IPC namespace kABI 实验"
            echo
            echo "基线是已经真机 fastboot boot 成功且 DroidSpaces Process limit=PASS 的 PIDs KMI 实验。"
            echo "本轮应用固定 DroidSpaces 6.12 SYSVIPC kABI patch，并启用 SYSVIPC/POSIX_MQUEUE/IPC_NS/PID_NS。"
            for f in droidspaces-core-config-diff.txt droidspaces-core-abi-diff.txt droidspaces-core-safety.txt; do
              [[ -s "$OUT/$f" ]] && { echo '~~~text'; cat "$OUT/$f"; echo '~~~'; }
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "上传 ABI 实验素材"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: NOFLASH-pandora-OS4-R62-DroidSpaces-CoreNS-PIDs-KMI
          path: |
            ${{ runner.temp }}/xiaomi-os4-integrated/results/Image
            ${{ runner.temp }}/xiaomi-os4-integrated/results/Module.symvers
            ${{ runner.temp }}/xiaomi-os4-integrated/results/final.config
            ${{ runner.temp }}/xiaomi-os4-integrated/results/build-metadata.txt
            ${{ runner.temp }}/xiaomi-os4-integrated/results/droidspaces-kabi-dryrun.log
            ${{ runner.temp }}/xiaomi-os4-integrated/results/droidspaces-kabi-apply.log
            ${{ runner.temp }}/xiaomi-os4-integrated/results/droidspaces-core-config-diff.txt
            ${{ runner.temp }}/xiaomi-os4-integrated/results/droidspaces-core-abi-diff.txt
            ${{ runner.temp }}/xiaomi-os4-integrated/results/droidspaces-core-new-exports.txt
            ${{ runner.temp }}/xiaomi-os4-integrated/results/droidspaces-core-safety.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
