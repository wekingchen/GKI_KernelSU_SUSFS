name: "Xiaomi 17 Pro OS4 / R62 首次真实内核基线编译（不可刷机）"

on:
  push:
    branches:
      - "os4/pandora-6.12.69-adaptation-20261029"
    paths:
      - ".github/workflows/xiaomi-sm8850-os4-baseline-build.yml"
      - "scripts/xiaomi-os4/build-r62-baseline.sh"
      - ".github/config/xiaomi-sm8850-os4-6.12.69.env"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiaomi-os4-baseline-r62
  cancel-in-progress: true

jobs:
  baseline:
    name: "R62 原厂 GKI 公共源码 Image + Module.symvers（不刷机）"
    if: github.ref == 'refs/heads/os4/pandora-6.12.69-adaptation-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "检出独立 OS4 分支"
        uses: actions/checkout@v7

      - name: "检查脚本语法及运行范围"
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/xiaomi-os4/build-r62-baseline.sh
          test -f .github/config/xiaomi-sm8850-os4-6.12.69.env
          test "$GITHUB_REF_NAME" = "os4/pandora-6.12.69-adaptation-20261029"
          echo "只读候选源码与非刷机产物模式，未触及 OS3 的编译路径"

      - name: "清理 Runner 空间"
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: "安装编译依赖"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache \
            cpio curl flex git jq libdw-dev libelf-dev libssl-dev perl python3 \
            rsync tar unzip xz-utils zip zstd dwarves

      - name: "缓存 GKI R62 源码（不可变）"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/common-r62.git
          key: xiaomi-pandora-os4-common-e2b8ca7c8d05-v1

      - name: "缓存 Android r536225 Clang/Rust/构建工具"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/toolchain-r536225
          key: xiaomi-pandora-os4-toolchain-r536225-verified-v1

      - name: "缓存 R62 Clang 编译结果"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/ccache-r62
          key: xiaomi-pandora-os4-ccache-r62-${{ github.sha }}
          restore-keys: |
            xiaomi-pandora-os4-ccache-r62-

      - name: "编译官方 R62 最小 Image 与 ABI 数据"
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/xiaomi-os4/build-r62-baseline.sh

      - name: "失败时仍保留校验过的源码缓存"
        if: failure()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/xiaomi-os4/common-r62.git
          key: xiaomi-pandora-os4-common-e2b8ca7c8d05-v1

      - name: "失败时仍保留校验过的工具链"
        if: failure()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/xiaomi-os4/toolchain-r536225
          key: xiaomi-pandora-os4-toolchain-r536225-verified-v1

      - name: "失败时仍保留热缓存用于重试"
        if: failure()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/xiaomi-os4/ccache-r62
          key: xiaomi-pandora-os4-ccache-r62-${{ github.sha }}

      - name: "输出真实编译记录"
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/xiaomi-os4-build/results"
          {
            echo "## OS4 / R62 最小 GKI 编译"
            echo
            echo "**非刷机内核，不包含 BakaSU / SUSFS / NoMount，禁止在手机上安装。**"
            echo
            if [[ -s "$OUT/build-metadata.txt" ]]; then
              echo '~~~text'
              cat "$OUT/build-metadata.txt"
              echo '~~~'
            else
              echo "构建或前置检查失败，请查看错误步骤和末尾日志。"
              if [[ -s "$OUT/kernel-build.log" ]]; then
                tail -n 30 "$OUT/kernel-build.log" | sed 's/^/    /'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if command -v ccache >/dev/null 2>&1; then ccache --show-stats || true; fi

      - name: "仅上传成功的分析用 Image、Symvers 和 vmlinux"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: NOFLASH-pandora-OS4-R62-baseline-Image-ABI
          path: |
            ${{ runner.temp }}/xiaomi-os4-build/results/Image
            ${{ runner.temp }}/xiaomi-os4-build/results/Module.symvers
            ${{ runner.temp }}/xiaomi-os4-build/results/vmlinux.symvers
            ${{ runner.temp }}/xiaomi-os4-build/results/vmlinux.zst
            ${{ runner.temp }}/xiaomi-os4-build/results/final.config
            ${{ runner.temp }}/xiaomi-os4-build/results/build-metadata.txt
            ${{ runner.temp }}/xiaomi-os4-build/results/rust_binder-R62.ko
            ${{ runner.temp }}/xiaomi-os4-build/results/rust-binder-R62-metadata.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: "保存失败时的最近日志（不收集超长全文）"
        if: failure()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/xiaomi-os4-build/results"
          mkdir -p "$RUNNER_TEMP/xiaomi-os4-log"
          for file in config-build.log kernel-build.log modules-build.log; do
            if [[ -s "$OUT/$file" ]]; then tail -n 160 "$OUT/$file" > "$RUNNER_TEMP/xiaomi-os4-log/$file"; fi
          done

      - name: "保存中途已成功生成的非刷机 Image 与 vmlinux 导出符号"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: NOFLASH-pandora-OS4-R62-partial-Image-only
          path: |
            ${{ runner.temp }}/xiaomi-os4-build/results/Image
            ${{ runner.temp }}/xiaomi-os4-build/results/vmlinux.symvers
            ${{ runner.temp }}/xiaomi-os4-build/results/final.config
          if-no-files-found: ignore
          retention-days: 7

      - name: "上传失败日志"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: NOFLASH-pandora-OS4-R62-failure-tail
          path: ${{ runner.temp }}/xiaomi-os4-log/
          if-no-files-found: warn
          retention-days: 7
