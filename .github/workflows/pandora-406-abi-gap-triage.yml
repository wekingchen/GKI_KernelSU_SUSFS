name: "pandora OS4.0.6 · 只读 ABI 缺口溯源"
on:
  push:
    branches: ["pandora-ota-406-gap-evidence"]
    paths:
      - ".github/workflows/pandora-406-abi-gap-triage.yml"
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: "下载 SHA 绑定的 OTA 模块和 GKI Module.symvers"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/triage/stock" "$RUNNER_TEMP/triage/candidate" "$RUNNER_TEMP/triage/previous"
          gh release download pandora-os4-stock-input --repo "$GITHUB_REPOSITORY" \
            --pattern 'pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip' --dir "$RUNNER_TEMP/triage/stock"
          echo 'bebb8754c16dd30c724fdba3687694e615e03342d6f5f55918cd06f1dca8cbb8  '"$RUNNER_TEMP/triage/stock/pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip" | sha256sum -c -
          gh release download pandora-os4-ota-candidate-OS4.0.6.0.XBLCNXM --repo "$GITHUB_REPOSITORY" \
            --pattern 'Module.symvers' --dir "$RUNNER_TEMP/triage/candidate"
          echo '242f6b3668e6f895c894bfbd35096c2f408a1b546b3cd0649bae4ed1d99dce25  '"$RUNNER_TEMP/triage/candidate/Module.symvers" | sha256sum -c -
      - name: "获取原 Run ABI 报告；校验固定来源并归类"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 44891447936 --repo "$GITHUB_REPOSITORY" \
            --name pandora-406-provider-graph-diagnostic --dir "$RUNNER_TEMP/triage/previous"
          jq -e '.gate == "BLOCKED" and .stock_build == "OS4.0.6.0.XBLCNXM" and .stock_input_sha256 == "bebb8754c16dd30c724fdba3687694e615e03342d6f5f55918cd06f1dca8cbb8" and .imports_checked == 30925 and (.unresolved_kernel_imports|length)==923 and (.ambiguous_providers|length)==27' "$RUNNER_TEMP/triage/previous/ota-abi-report.json" >/dev/null
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y zstd; fi
          python3 scripts/xiaomi-os4/triage-406-abi-gaps.py \
            --stock-zip "$RUNNER_TEMP/triage/stock/pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip" \
            --candidate-symvers "$RUNNER_TEMP/triage/candidate/Module.symvers" \
            --abi-report "$RUNNER_TEMP/triage/previous/ota-abi-report.json" \
            --output "$RUNNER_TEMP/triage/abi-gaps-406.json"
          echo "只读审计：不生成 boot、不修改 ABI 门禁、不晋升 LKG" >> "$GITHUB_STEP_SUMMARY"
      - name: "归档分析证据"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pandora-406-abi-gap-evidence
          path: ${{ runner.temp }}/triage/abi-gaps-406.json
          retention-days: 30
          if-no-files-found: warn
