name: "仓库维护 / 清理已结束的本仓临时开发分支（一次性）"

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/maintenance-prune-fork-branches-once-20261116.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "检查分支名单、最后提交及活动 PR，然后清理旧分支"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "wekingchen/GKI_KernelSU_SUSFS" && "$GITHUB_REF" == "refs/heads/dev" ]] || exit 1
          echo "仅允许清理名单中与预期 SHA 完全一致的本仓开发分支；保留 dev、上游公共分支、所有未知分支。"
          open_pr_heads="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[] | select(.head.repo.full_name == "wekingchen/GKI_KernelSU_SUSFS") | .head.ref')"
          count=0
          while read -r branch expected_sha; do
            [[ -n "$branch" ]] || continue
            case "$branch" in
              docs/*|feat/*|fix/*|sync/*) ;;
              *) echo "::error::拒绝清理未授权命名空间：$branch"; exit 1 ;;
            esac
            if grep -Fxq "$branch" <<< "$open_pr_heads"; then
              echo "::warning::分支仍有未关闭 PR，跳过：$branch"
              continue
            fi
            actual_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "::warning::分支 $branch 在审计后已更新，不清理 ($actual_sha)"
              continue
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            echo "已删除：$branch ($expected_sha)"
            count=$((count + 1))
          done <<'BRANCHES'
          docs/k50pro-sync-pat-permissions-20261116 17771021616d16985c2e6213ae5f03e431da20de
          docs/pandora-os4-lkg-workflow-clarity-20261115 7487b3c27c66ece19a23d5082b7bc2cf1177ccac
          feat/upstream-exact-auto-sync-20261116 8d873cb6652460d0af1f3f2c0f053bf626150f92
          fix/k50pro-pat-preflight-before-checkout-20261116 7c04d102310dee2e7de55a606a4b7a2a99215731
          fix/k50pro-workflow-write-auth-20261116 8b18408da9e50670c49ee4cd388c4914cff08bf1
          fix/pandora-os4-susfs-priority-uid-upstream-20261116 8992081f71f7fe15dca6a4946e49e6736ac34e3b
          fix/upstream-exact-mirror-20261116 3c883e4ca2b8167da606c4a035f2a1e65894ca29
          fix/upstream-private-overlay-regeneration-20261116 cf94879be038f01040ecbd74b16623dde1ece587
          sync/upstream-dev-20261116-7fc7952d 765cdc7978937a68ea203cafbb7f42ced7e8929a
          BRANCHES
          echo "本次成功删除 $count 个本仓旧开发分支。"
