name: "临时验收 / pandora Windows adb 身份采集修复"
on:
  push:
    branches:
      - fix/pandora-live-collector-adb-capture
    paths:
      - .github/workflows/pandora-live-collector-adb-capture-once.yml
permissions:
  contents: read
jobs:
  windows-cmd:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: "静态只读回归"
        shell: pwsh
        run: python -m unittest discover -s scripts/xiaomi-os4 -p 'test_audit_live_module_delivery.py' -v
      - name: "原生 cmd.exe + adb.exe 模拟真机身份捕获"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mock = Join-Path $env:RUNNER_TEMP 'adb-mock'
          New-Item -ItemType Directory -Force -Path $mock | Out-Null
          $src = @'
          using System;
          public static class Program {
            static void H(string h,string p){Console.WriteLine(h+"  "+p);}
            public static int Main(string[] a) {
              if (a.Length==1 && a[0]=="get-state") { Console.WriteLine("device"); return 0; }
              if (a.Length>=3 && a[0]=="shell" && a[1]=="getprop") {
                if (a[2]=="ro.product.device") Console.WriteLine("pandora");
                else if (a[2]=="ro.mi.os.version.incremental") Console.WriteLine("OS4.0.6.0.XBLCNXM");
                else if (a[2]=="ro.boot.slot_suffix") Console.WriteLine("_b");
                else if (a[2]=="sys.boot_completed") Console.WriteLine("1");
                else if (a[2]=="ro.boot.verifiedbootstate") Console.WriteLine("green");
                else if (a[2]=="ro.boot.vbmeta.device_state") Console.WriteLine("locked");
                return 0;
              }
              if (a.Length>=3 && a[0]=="shell" && a[1]=="uname") { Console.WriteLine("6.12.69-android16-6-g43b5ab7e247d-abogki561813157-4k"); return 0; }
              if (a.Length>=4 && a[0]=="shell" && a[1]=="su" && a[2]=="-c") {
                string c=a[3];
                if (c=="id") Console.WriteLine("uid=0(root) gid=0(root)");
                else if (c=="cat /proc/cmdline") Console.WriteLine("foo=bar");
                else if (c=="cat /proc/bootconfig") Console.WriteLine("");
                else if (c=="cat /sys/module/binder/parameters/impl") Console.WriteLine("rust");
                else if (c=="cat /sys/module/binder/parameters/active_impl") Console.WriteLine("rust");
                else if (c=="cat /proc/modules") { Console.WriteLine("zsmalloc 45056 2 - Live 0xDEADBEEF"); Console.WriteLine("rust_binder 462848 0 - Live 0xDEADBEEF"); }
                else if (c=="cat /proc/sys/kernel/modules_disabled") Console.WriteLine("0");
                else if (c=="cat /sys/module/rust_binder/initstate") Console.WriteLine("live");
                else if (c.StartsWith("sha256sum ")) H("0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",c.Substring(10));
                else if (c.Contains("/system_dlkm/lib/modules/6.12.69-") && c.EndsWith("/modules.load")) Console.WriteLine("kernel/drivers/android/binder/rust_binder.ko");
                else if (c.Contains("/system_dlkm/lib/modules/6.12.69-") && c.EndsWith("/modules.dep")) Console.WriteLine("kernel/drivers/android/binder/rust_binder.ko:");
                else if (c=="cat /vendor_dlkm/lib/modules/modules.load") Console.WriteLine("zram.ko");
                else if (c=="cat /vendor_dlkm/lib/modules/modules.dep") Console.WriteLine("/vendor/lib/modules/zram.ko: /vendor/lib/modules/zsmalloc.ko");
                else if (c=="cat /proc/mounts") { Console.WriteLine("/dev/block/dm-1 /vendor_dlkm erofs ro,seclabel 0 0"); Console.WriteLine("/dev/block/dm-2 /system_dlkm erofs ro,seclabel 0 0"); }
                return 0;
              }
              return 0;
            }
          }
          '@
          $cs = Join-Path $mock 'Program.cs'
          Set-Content $cs $src -Encoding utf8
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /target:exe ('/out:' + (Join-Path $mock 'adb.exe')) $cs
          if ($LASTEXITCODE -ne 0) { throw 'mock adb compile failed' }
          $env:PATH = "$mock;$env:PATH"
          Push-Location $env:RUNNER_TEMP
          try {
            $cmd = Join-Path $env:GITHUB_WORKSPACE 'scripts/xiaomi-os4/collect-pandora-live-module-delivery.cmd'
            & cmd.exe /d /c call $cmd
            if ($LASTEXITCODE -ne 0) { throw "collector exit $LASTEXITCODE" }
            $dirs = @(Get-ChildItem -Directory -Filter 'pandora-live-module-delivery-*')
            if ($dirs.Count -ne 1) { throw 'expected exactly one evidence dir' }
            $id = Get-Content (Join-Path $dirs[0].FullName 'identity.txt') -Raw
            if ($id -notmatch 'device=pandora' -or $id -notmatch 'OS4\.0\.6\.0\.XBLCNXM' -or $id -notmatch '6\.12\.69-android16-6-g43b5ab7e247d') { throw "identity capture failed: $id" }
            $zip = Join-Path $env:RUNNER_TEMP ($dirs[0].Name + '.zip')
            if (-not (Test-Path $zip)) { throw 'zip missing' }
            Write-Host 'Windows adb identity capture PASS'
          } finally { Pop-Location }
