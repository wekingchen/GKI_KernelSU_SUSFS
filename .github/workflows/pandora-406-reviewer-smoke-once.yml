name: "临时验收 / pandora 只读证据解释器反例"
on:
  push:
    branches:
      - audit/pandora-406-module-delivery-repro
    paths:
      - .github/workflows/pandora-406-reviewer-smoke-once.yml
permissions:
  contents: read
jobs:
  reviewer:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: "校验只读运行快照解释器和 vendor/system 来源隔离"
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/xiaomi-os4/review-live-module-delivery-readonly.py
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_audit_live_module_reviewer.py' -v
          echo 'Only on-disk hashes can match. Runtime ELF, Binder selection and AVB remain unproven.'
