name: "一次性维护 / 删除清理任务尾部冗余日志"
on:
  push:
    paths:
      - ".github/workflows/one-time-cleanup-last-logs-20261101.yml"
permissions:
  contents: read
  actions: write
jobs:
  final-logs:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "仅清理已完成、无有效 Artifact 的清理尾部 Run"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in "41264916283:failure" "41264971742:success"; do
            id="$(cut -d: -f1 <<< "$pair")"
            expected="$(cut -d: -f2 <<< "$pair")"
            info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id")"
            [[ "$(jq -r .status <<< "$info")" == completed ]] || exit 1
            [[ "$(jq -r .conclusion <<< "$info")" == "$expected" ]] || exit 1
            [[ "$(jq -r .event <<< "$info")" == push ]] || exit 1
            art="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" \
              --jq '[.artifacts[]|select(.expired==false)]|length')"
            [[ "$art" == 0 ]] || exit 1
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null
          done
          echo "最后两条清理阶段冗余 Run 已删除；仅保留这次最终审计记录。" >> "$GITHUB_STEP_SUMMARY"
