name: "OS4 BakaSU main full build validation"

on:
  push:
    branches:
      - os4-track-bakasu-main-20261031
    paths:
      - ".github/workflows/os4-bakasu-main-full-build-validation.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: "检出候选代码"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "解析 BakaSU main"
        shell: bash
        run: |
          set -euo pipefail
          source .github/config/xiaomi-sm8850-os4-6.12.69.env
          SHA="$(git ls-remote "$OS4_BAKASU_REPO" "refs/heads/$OS4_BAKASU_REF" | awk '{print $1}')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "BAKASU_MAIN_SHA=$SHA" >> "$GITHUB_ENV"

      - name: "安装构建依赖"
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git jq libdw-dev \
            libelf-dev libssl-dev patch perl python3 rsync tar unzip xz-utils \
            zip zstd dwarves

      - name: "恢复固定 R62 源码缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/common-r62.git
          key: xiaomi-pandora-os4-common-e2b8ca7c8d05-v1

      - name: "恢复固定 r536225 工具链"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/toolchain-r536225
          key: xiaomi-pandora-os4-toolchain-r536225-verified-v1

      - name: "恢复编译缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/ccache-r62
          key: xiaomi-pandora-os4-ccache-r62-bakasu-main-${{ hashFiles('scripts/xiaomi-os4/**', '.github/config/xiaomi-sm8850-os4-6.12.69.env', 'security_patch/**') }}
          restore-keys: |
            xiaomi-pandora-os4-ccache-r62-custom-
            xiaomi-pandora-os4-ccache-r62-lkg-
            xiaomi-pandora-os4-ccache-r62-

      - name: "用最新 BakaSU main 构建默认全功能 OS4"
        shell: bash
        env:
          XIAOMI_OS4_SELECTABLE_BUILD: "1"
          XIAOMI_OS4_ROOT_MODE: "bakasu-susfs"
          XIAOMI_OS4_SUSFS_EXTRA_FEATURES: "1"
          XIAOMI_OS4_USE_NOMOUNT: "1"
          XIAOMI_OS4_DROIDSPACES: "1"
          XIAOMI_OS4_USE_NTSYNC: "1"
          XIAOMI_OS4_USE_BBG: "1"
          XIAOMI_OS4_USE_REKERNEL: "1"
          XIAOMI_OS4_USE_NETWORKING: "1"
          XIAOMI_OS4_USE_CVE: "1"
          XIAOMI_OS4_BAKASU_COMMIT: ${{ env.BAKASU_MAIN_SHA }}
        run: |
          set -euo pipefail
          bash scripts/xiaomi-os4/build-r62-features.sh

      - name: "验证最新 main 身份与 ABI"
        shell: bash
        run: |
          set -euo pipefail
          source .github/config/pandora-os4-full-parity-lkg.env
          RES="$RUNNER_TEMP/xiaomi-os4-integrated/results"
          grep -qx "BAKASU_COMMIT=$BAKASU_MAIN_SHA" "$RES/build-metadata.txt"
          grep -qx 'EXACT_LKG_SELECTION=0' "$RES/build-metadata.txt"
          grep -qx 'BUILD_KIND=R62_OS4_SELECTABLE_CUSTOM' "$RES/build-metadata.txt"
          grep -qx 'KERNEL_RELEASE=6.12.69-android16-6-os4r62-custom-4k' "$RES/build-metadata.txt"
          printf '%s  %s\n' "$LKG_SYMVERS_SHA256" "$RES/Module.symvers" | sha256sum -c -
          grep -qx 'OS3_PARITY_CONFIG=PASS' "$RES/os3-parity-config-result.txt"

      - name: "生成最新 main 的 CUSTOM-UNVERIFIED AnyKernel3"
        shell: bash
        run: |
          set -euo pipefail
          RES="$RUNNER_TEMP/xiaomi-os4-integrated/results"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          XIAOMI_AK3_MODE=custom \
          XIAOMI_AK3_RELEASE=6.12.69-android16-6-os4r62-custom-4k \
            bash scripts/xiaomi-os4/package-validated-anykernel3.sh "$RES/Image" "$OUT" \
            | tee "$OUT/package-report.txt"
          ZIP="$(find "$OUT" -maxdepth 1 -name '*CUSTOM*UNVERIFIED*AnyKernel3.zip' -print -quit)"
          [[ -n "$ZIP" && -s "$ZIP" ]]
          unzip -t "$ZIP" >/dev/null
          cp "$RES/build-metadata.txt" "$OUT/"
          cp "$RES/Module.symvers" "$OUT/"
          cp "$RES/final.config" "$OUT/"

      - name: "上传验证产物"
        uses: actions/upload-artifact@v6
        with:
          name: os4-bakasu-main-full-build-validation
          path: |
            ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
