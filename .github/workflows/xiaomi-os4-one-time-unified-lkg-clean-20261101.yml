name: "临时清理 / 已合并的 OS4 统一 LKG 开发分支"
on:
  push:
    paths:
      - ".github/workflows/xiaomi-os4-one-time-unified-lkg-clean-20261101.yml"
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "严格检查 PR #42 合并和 SHA 后清理临时分支"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/42" --jq .merged)" == true ]] || exit 1
          B="os4-unify-lkg-entry-20261101"
          EXPECTED="1d0bc4340ee1c280a66ce2f988c72890ce43bae7"
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$B" --jq .object.sha)"
          [[ "$CURRENT" == "$EXPECTED" ]] || { echo "::error::分支变动，拒绝删除"; exit 1; }
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq "[.[] | select(.head.ref==\\"$B\\")] | length")" -eq 0 ]] || exit 1
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$B" >/dev/null
          echo "已删除合并完成的临时 OS4 LKG 开发分支" >> "$GITHUB_STEP_SUMMARY"
