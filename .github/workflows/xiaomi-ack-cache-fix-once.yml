name: Xiaomi ACK-R51 缓存修复验证
# kleaf-cache-dir-cold-1

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/xiaomi-ack-cache-fix-once.yml"

permissions:
  contents: write
  actions: read

jobs:
  ack-cache-fix:
    name: ACK-R51 sandbox/cache
    uses: ./.github/workflows/kernel-xiaomi-sm8850.yml
    with:
      device: "Xiaomi 17 Pro (pandora)"
      source_profile: ack-r51
      root_mode: resukisu-susfs
      susfs_extra_features: true
      use_kpm: disabled
      droidspaces: "on"
      droidspaces_ntsync: true
      use_zram: true
      use_bbg: true
      use_rekernel: true
      use_nomount: false
      use_networking: true
      cve_2026_43499_patch: true
      artifact_upload_mode: "上传全部"
    secrets: inherit
