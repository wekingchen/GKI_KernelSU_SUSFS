name: "临时：清理隔离修复分支"
on:
  push:
    paths:
      - ".github/workflows/generic-custom-onetime-dispatch-20261101.yml"
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "验证 PR #43 已合并和分支 SHA 后删除"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/43" --jq .merged)" == true ]] || exit 1
          REF="fix/generic-custom-5.10-runner-host-linker-20261101"
          WANT="600ab671f2083b3691f4e96ea5711da6be61c82c"
          GOT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$REF" --jq .object.sha)"
          [[ "$GOT" == "$WANT" ]] || { echo "::error::开发分支已更改，拒绝删除"; exit 1; }
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$REF" >/dev/null
          echo "本仓隔离修复已经合并，实验分支已清理；真实构建 Run #41239924766 保留" >> "$GITHUB_STEP_SUMMARY"
