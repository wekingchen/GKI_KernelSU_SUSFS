name: "临时：验证通用自定义内核隔离修复真实构建"
on:
  push:
    paths:
      - ".github/workflows/generic-custom-onetime-dispatch-20261101.yml"
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "按失败 Run #40112987860 的选项重新发起一次构建"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "wekingchen/GKI_KernelSU_SUSFS" ]] || exit 1
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/43" --jq .merged)" == "true" ]] || exit 1
          gh workflow run kernel-custom-fork.yml --repo "$GITHUB_REPOSITORY" --ref dev \
            -f kernel_version="5.10" \
            -f os_patch_level="2024-05" \
            -f kernelsu_variant="BakaSU" \
            -f ksu_mode="关闭" \
            -f use_kpm="disabled (关闭)" \
            -f use_zram="true" \
            -f use_bbg="true" \
            -f use_rekernel="true" \
            -f use_nomount="true" \
            -f use_networking="true" \
            -f cve_2026_43499_patch="true" \
            -f droidspaces="678" \
            -f droidspaces_ntsync="false" \
            -f supp_op="false" \
            -f artifact_upload_mode="仅上传 AnyKernel3.zip"
          echo "已发起隔离修复的真实 Android12 / 5.10.209 编译；构建结果仍以目标工作流为准" >> "$GITHUB_STEP_SUMMARY"
