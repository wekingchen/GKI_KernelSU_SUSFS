name: "临时诊断 / pandora Binder C 选源与 r74 模块策略（只读）"
on:
  push:
    branches:
      - audit/pandora-406-binder-c-selection
    paths:
      - .github/workflows/pandora-406-binder-c-selection-once.yml
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: "运行 live reviewer 失败关闭回归"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_audit_live_module_reviewer.py' -v
      - name: "锁定 r74 检查 Binder active_impl / Rust dummy / inert init 语义"
        run: |
          set -euo pipefail
          R74=b1d12d482d767c50cb792d988e4479d3f75c342a
          mkdir -p "$RUNNER_TEMP/r74/drivers/android/binder"
          BASE="https://android.googlesource.com/kernel/common/+/$R74"
          curl -fsSL "$BASE/drivers/android/Kconfig?format=TEXT" | base64 -d > "$RUNNER_TEMP/r74/drivers/android/Kconfig"
          curl -fsSL "$BASE/drivers/android/binder.c?format=TEXT" | base64 -d > "$RUNNER_TEMP/r74/drivers/android/binder.c"
          curl -fsSL "$BASE/drivers/android/binder/rust_binder_main.rs?format=TEXT" | base64 -d > "$RUNNER_TEMP/r74/drivers/android/binder/rust_binder_main.rs"
          curl -fsSL "https://android.googlesource.com/kernel/common/+archive/$R74/drivers/android.tar.gz" -o "$RUNNER_TEMP/android.tar.gz"
          mkdir -p "$RUNNER_TEMP/android-tree"
          tar -xzf "$RUNNER_TEMP/android.tar.gz" -C "$RUNNER_TEMP/android-tree"
          if grep -R -n "ANDROID_BINDER_IPC_RUST_DUMMY" "$RUNNER_TEMP/android-tree" > "$RUNNER_TEMP/rust-dummy-hits.txt"; then
            DUMMY_TREE=present
          else
            DUMMY_TREE=absent
          fi
          K="$RUNNER_TEMP/r74/drivers/android/Kconfig"
          B="$RUNNER_TEMP/r74/drivers/android/binder.c"
          R="$RUNNER_TEMP/r74/drivers/android/binder/rust_binder_main.rs"
          {
            echo "commit=$R74"
            echo "rust_dummy_tree=$DUMMY_TREE"
            cat "$RUNNER_TEMP/rust-dummy-hits.txt" 2>/dev/null || true
            if grep -q "ANDROID_BINDER_IPC_RUST_DUMMY" "$K"; then echo "rust_dummy=present"; else echo "rust_dummy=absent"; fi
            if grep -q "active_impl" "$B"; then echo "active_impl=present"; else echo "active_impl=absent"; fi
            if grep -q "binder_use_rust == 0" "$R"; then echo "rust_module_inert_when_c=yes"; else echo "rust_module_inert_when_c=not_confirmed"; fi
            grep -n -E "ANDROID_BINDER_IPC_RUST|ANDROID_BINDER_IPC_RUST_DUMMY" "$K" || true
            grep -n -E "active_impl|binder_impl_param_get" "$B" | head -n 20 || true
            grep -n -A12 -B4 "binder_use_rust == 0" "$R" || true
          } | tee "$RUNNER_TEMP/r74-binder.txt"
      - name: "锁定原厂采集包检查可用 boot/vendor_boot 证据"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stock"
          gh release download pandora-os4-stock-input --repo "$GITHUB_REPOSITORY" --pattern "*xm.zip" --dir "$RUNNER_TEMP/stock"
          ZIP="$(find "$RUNNER_TEMP/stock" -maxdepth 1 -name "*xm.zip" -type f -print -quit)"
          test -n "$ZIP"
          test "$(sha256sum "$ZIP" | cut -d" " -f1)" = "bebb8754c16dd30c724fdba3687694e615e03342d6f5f55918cd06f1dca8cbb8"
          unzip -l "$ZIP" | tee "$RUNNER_TEMP/stock-inventory.txt"
          echo "--- boot-like entries ---" | tee -a "$RUNNER_TEMP/stock-inventory.txt"
          unzip -Z1 "$ZIP" | grep -E "(^|/)(boot|vendor_boot|init_boot)(_[ab])?\.img$|(^|/).*\.rc$|(^|/)fstab" | tee -a "$RUNNER_TEMP/stock-inventory.txt" || true
      - name: "离线拆原厂 vendor_boot 查 Xiaomi system_dlkm loader"
        run: |
          set -euo pipefail
          ZIP="$(find "$RUNNER_TEMP/stock" -maxdepth 1 -name "*xm.zip" -type f -print -quit)"
          unzip -p "$ZIP" vendor_boot.img > "$RUNNER_TEMP/vendor_boot.img"
          test "$(stat -c %s "$RUNNER_TEMP/vendor_boot.img")" = "100663296"
          curl -fsSL "https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/unpack_bootimg.py?format=TEXT" | base64 -d > "$RUNNER_TEMP/unpack_bootimg.py"
          python3 "$RUNNER_TEMP/unpack_bootimg.py" --boot_img "$RUNNER_TEMP/vendor_boot.img" --out "$RUNNER_TEMP/vendor_boot_out" > "$RUNNER_TEMP/vendor-boot-unpack.log"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lz4 cpio file >/dev/null
          : > "$RUNNER_TEMP/vendor-boot-loader-evidence.txt"
          echo "=== unpack outputs ===" >> "$RUNNER_TEMP/vendor-boot-loader-evidence.txt"
          find "$RUNNER_TEMP/vendor_boot_out" -maxdepth 2 -type f -printf "%P %s bytes\n" | sort >> "$RUNNER_TEMP/vendor-boot-loader-evidence.txt"
          i=0
          while IFS= read -r ram; do
            i=$((i+1))
            work="$RUNNER_TEMP/ramdisk-$i"
            mkdir -p "$work/root"
            desc="$(file -b "$ram")"
            echo "=== ramdisk $i: $(basename "$ram") :: $desc ===" >> "$RUNNER_TEMP/vendor-boot-loader-evidence.txt"
            if echo "$desc" | grep -qi "LZ4"; then
              lz4 -dc "$ram" > "$work/ramdisk.cpio"
            elif echo "$desc" | grep -qi "gzip"; then
              gzip -dc "$ram" > "$work/ramdisk.cpio"
            else
              cp "$ram" "$work/ramdisk.cpio"
            fi
            (cd "$work/root" && cpio -idm --no-absolute-filenames < "$work/ramdisk.cpio" >/dev/null 2>&1) || true
            echo "--- files of interest ---" >> "$RUNNER_TEMP/vendor-boot-loader-evidence.txt"
            find "$work/root" -type f \( -name "*.rc" -o -name "fstab*" -o -name "modules.load*" -o -name "modules.dep*" -o -name "*dlkm*" \) -printf "%P\n" | sort >> "$RUNNER_TEMP/vendor-boot-loader-evidence.txt" || true
            echo "--- loader references ---" >> "$RUNNER_TEMP/vendor-boot-loader-evidence.txt"
            grep -R -n -I -E "system_dlkm|vendor_dlkm|modules\.load|modprobe|insmod|rust_binder|dlkm_loader" "$work/root" \
              --include="*.rc" --include="fstab*" --include="*.sh" --include="modules.load*" --include="modules.dep*" \
              >> "$RUNNER_TEMP/vendor-boot-loader-evidence.txt" || true
          done < <(find "$RUNNER_TEMP/vendor_boot_out" -maxdepth 1 -type f -name "vendor_ramdisk*" | sort)
          cat "$RUNNER_TEMP/vendor-boot-loader-evidence.txt"
      - name: "只归档文字证据"
        uses: actions/upload-artifact@v6
        with:
          name: pandora-406-r74-binder-c-readonly
          path: |
            ${{ runner.temp }}/r74-binder.txt
            ${{ runner.temp }}/stock-inventory.txt
          retention-days: 30
