name: "一次性维护 / 最终自清理 Actions 日志"
on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/one-time-self-prune-20261101.yml"
permissions:
  contents: write
  actions: write
jobs:
  clean:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "删除最后一条已废弃清理记录并自行清理"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="$GITHUB_REPOSITORY"
          OLD=41265053296
          OLD_INFO="$(gh api "repos/$BASE/actions/runs/$OLD")"
          [[ "$(jq -r .path <<< "$OLD_INFO")" == ".github/workflows/one-time-cleanup-last-logs-20261101.yml" ]] || exit 1
          [[ "$(jq -r .status <<< "$OLD_INFO")" == completed ]] || exit 1
          [[ "$(jq -r .conclusion <<< "$OLD_INFO")" == success ]] || exit 1
          [[ "$(gh api "repos/$BASE/actions/runs/$OLD/artifacts" --jq .total_count)" == 0 ]] || exit 1
          gh api -X DELETE "repos/$BASE/actions/runs/$OLD" >/dev/null
          echo "已删除最后一条旧的临时清理记录 $OLD"
          FILE=".github/workflows/one-time-self-prune-20261101.yml"
          SHA="$(gh api "repos/$BASE/contents/$FILE?ref=dev" --jq .sha)"
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          gh api -X DELETE "repos/$BASE/contents/$FILE" \
            -f "message=chore: remove completed one-time self-prune workflow" \
            -f "sha=$SHA" -f "branch=dev" >/dev/null
          echo "一次性工作流自身已删除"
          # Delete this run last; it has no artifacts and is no longer needed.
          gh api -X DELETE "repos/$BASE/actions/runs/$GITHUB_RUN_ID" >/dev/null || \
            echo "::warning::当前仍在运行，GitHub 不允许即时删除该 Run；其余清理均已完成"
