name: "上游原件 / 每日完整同步（CI 验证后合入）"

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - "scripts/upstream-sync/**"
      - ".github/workflows/upstream-exact-auto-sync.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: upstream-exact-mirror
  cancel-in-progress: false

jobs:
  verify-sync-safety:
    name: "先检查上游原件一致性规则（不执行同步）"
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "测试同内容不同历史、真正修改、删除和权限变化的边界"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/upstream-sync -p 'test_*.py' -v
          python3 -m py_compile scripts/upstream-sync/check-inherited-files.py
          bash -n scripts/upstream-sync/sync-exact-upstream.sh

  exact-upstream:
    needs: verify-sync-safety
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: "检查工作流写入令牌"
        shell: bash
        env:
          SYNC_PAT: ${{ secrets.UPSTREAM_SYNC_PAT }}
        run: |
          if [[ -z "$SYNC_PAT" ]]; then
            echo "::error::UPSTREAM_SYNC_PAT 未配置；请设置仅授权本仓、具有 Contents、Workflows、Pull requests、Actions 全部写入权限的专用 PAT。"
            exit 1
          fi
          if ! GH_TOKEN="$SYNC_PAT" gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name' >/dev/null; then
            echo "::error::UPSTREAM_SYNC_PAT 无法访问本仓库，请检查 Token 有效期和授权。"
            exit 1
          fi

      - name: "检出本仓 dev（使用专用令牌）"
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_PAT }}

      - name: "仅同步完整上游原件，交由 PR 门禁检验"
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_PAT }}
        shell: bash
        run: bash scripts/upstream-sync/sync-exact-upstream.sh
