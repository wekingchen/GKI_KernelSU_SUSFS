name: "临时：清理 OS4 审计已合并分支"
on:
  push:
    paths:
      - ".github/workflows/os4-one-time-audit-cleanup-20261101.yml"
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "严格核验已合并 PR 与目标 SHA 后清理"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/39" --jq '.merged')" == "true" ]] || exit 1
          branch="audit/os4-end-to-end-docs-20261101"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
          [[ "$sha" == "7d1fca35465b9115b4280953e0c9a7e4e154b1a9" ]] || {
            echo "::error::审计分支 HEAD 已变化，拒绝自动清理"; exit 1;
          }
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          echo "已安全删除审核完成的分支 $branch" >> "$GITHUB_STEP_SUMMARY"
