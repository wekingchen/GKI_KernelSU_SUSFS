name: "pandora 4.0.6 vendor_boot module inventory (one-off read-only)"
on:
  push:
    branches: [pandora-406-vendorboot-module-probe]
    paths: [.github/workflows/pandora-406-vendorboot-module-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Fetch immutable stock input and inspect only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vendorboot"
          gh release download pandora-os4-stock-input --repo "$GITHUB_REPOSITORY" \
            --pattern 'pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip' --dir "$RUNNER_TEMP/vendorboot"
          echo "bebb8754c16dd30c724fdba3687694e615e03342d6f5f55918cd06f1dca8cbb8  $RUNNER_TEMP/vendorboot/pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip" | sha256sum -c -
          sudo apt-get update -qq && sudo apt-get install -y -qq lz4
          python3 - <<'PY'
          import collections,hashlib,io,struct,os,zipfile
          f=os.path.join(os.environ['RUNNER_TEMP'],'vendorboot','pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip')
          with zipfile.ZipFile(f) as stock:
              with zipfile.ZipFile(io.BytesIO(stock.read('oem-modules.zip'))) as oem:
                  files=[x.filename for x in oem.infolist() if x.filename.endswith(('.ko','.ko.zst','.ko.gz','.ko.xz'))]
              vb=stock.read('vendor_boot.img')
          print('OEM_MODULE_COUNT',len(files))
          print('OEM_MODULE_ROOT_COUNTS',dict(collections.Counter(x.split('/')[0] for x in files)))
          lookup=['smem.ko','qcom_scm.ko','qcom_ipc_logging.ko','rust_binder.ko','zram.ko','zsmalloc.ko','node_cache.ko','qcom_aoss.ko']
          for x in lookup: print('OEM_MODULE_LOOKUP',x, [p for p in files if p.rsplit('/',1)[-1]==x])
          print('VENDOR_BOOT_SHA256',hashlib.sha256(vb).hexdigest(),'bytes',len(vb))
          print('VENDOR_BOOT_MAGIC',repr(vb[:8]))
          if vb[:8]!=b'VNDRBOOT':raise ValueError('unexpected vendor_boot magic')
          ver,page,ka,ra,rs=struct.unpack_from('<IIIII',vb,8)
          head,dtb_size=struct.unpack_from('<II',vb,2096)
          num,entry_size=struct.unpack_from('<II',vb,2116)
          print('VENDOR_BOOT_HEADER',dict(version=ver,page_size=page,ramdisk_size=rs,header_size=head,dtb_size=dtb_size,table_entries=num,entry_size=entry_size))
          if ver!=4 or page!=4096 or head>4096 or rs>len(vb): raise ValueError('unsupported boot header')
          start=((head+page-1)//page)*page
          data=vb[start:start+rs]
          print('VENDOR_RAMDISK_MAGIC',data[:16].hex(),'size',len(data))
          dtb_off=((start+rs+page-1)//page)*page
          table_off=((dtb_off+dtb_size+page-1)//page)*page
          print('VENDOR_TABLE_OFFSET',table_off)
          if num>64 or entry_size<108 or table_off+num*entry_size>len(vb): raise ValueError('unsafe vendor table')
          for i in range(num):
              off=table_off+i*entry_size
              size,frag_off,kind=struct.unpack_from('<III',vb,off)
              name=vb[off+12:off+44].split(b'\x00',1)[0].decode('ascii','replace')
              fragment=data[frag_off:frag_off+size]
              print('RAMDISK_FRAGMENT',dict(name=name,kind=kind,size=size,offset=frag_off,magic=fragment[:12].hex()))
              import subprocess
              proc=subprocess.run(['lz4','-dc'],input=fragment,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=80)
              print('LZ4_DECOMPRESS_STATUS',proc.returncode,'cpio_bytes',len(proc.stdout),'stderr',proc.stderr[:150].decode('utf8','replace'))
              if proc.returncode!=0: raise ValueError('vendor ramdisk decompression failure')
              cpio=proc.stdout
              entries=[]
              p=0
              while p+110<=len(cpio):
                  if cpio[p:p+6] not in (b'070701',b'070702'):break
                  nums=[int(cpio[p+6+k*8:p+14+k*8],16) for k in range(13)]
                  name_len,flen,mode=nums[11],nums[6],nums[1]
                  if not 0<name_len<2048 or flen>512*1024*1024:raise ValueError('bad cpio header')
                  raw_name=cpio[p+110:p+110+name_len].rstrip(b'\x00')
                  path=raw_name.decode('utf8','replace')
                  if path=='TRAILER!!!': break
                  entries.append((path,flen,mode))
                  payload_at=(p+110+name_len+3)//4*4
                  p=(payload_at+flen+3)//4*4
              print('VENDOR_CPIO_ENTRIES',len(entries),'last_offset',p)
              modules=[(p,z) for p,z,m in entries if p.endswith(('.ko','.ko.zst','.ko.gz','.ko.xz'))]
              print('VENDOR_CPIO_KO_COUNT',len(modules))
              print('VENDOR_CPIO_KO_SAMPLE',modules[:18])
              for x in lookup:
                  print('VENDOR_CPIO_LOOKUP',x,[(p,z) for p,z in modules if p.rsplit('/',1)[-1]==x][:12])
          PY
          echo "READ_ONLY_NO_BOOT: no ABI gate altered, no images generated" >> "$GITHUB_STEP_SUMMARY"
      - name: "对 923 条缺失导入逐条核对启动 ramdisk 的真实 CRC"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/abi-result"
          gh run download 44891447936 --repo "$GITHUB_REPOSITORY" \
            --name pandora-406-provider-graph-diagnostic --dir "$RUNNER_TEMP/abi-result"
          jq -e '.gate == "BLOCKED" and .stock_input_sha256 == "bebb8754c16dd30c724fdba3687694e615e03342d6f5f55918cd06f1dca8cbb8" and (.unresolved_kernel_imports | length)==923' "$RUNNER_TEMP/abi-result/ota-abi-report.json"
          python3 scripts/xiaomi-os4/triage-406-vendorboot-providers.py \
            --stock "$RUNNER_TEMP/vendorboot/pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip" \
            --abi-report "$RUNNER_TEMP/abi-result/ota-abi-report.json" \
            --output "$RUNNER_TEMP/abi-result/vendorboot-provider-report.json"
      - name: "真实 4.0.6.0 ABI 门禁预演（只读，不生成 boot）"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_audit_vendorboot_modules.py' -v
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_audit_vendor_provider_graph.py' -v
          mkdir -p "$RUNNER_TEMP/vendorboot-candidate"
          gh release download pandora-os4-ota-candidate-OS4.0.6.0.XBLCNXM \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Module.symvers' --pattern 'stock-report.json' \
            --pattern 'gki-candidate.json' --pattern 'build-metadata.txt' \
            --dir "$RUNNER_TEMP/vendorboot-candidate"
          python3 scripts/xiaomi-os4/check-ota-oem-abi.py \
            --stock-zip "$RUNNER_TEMP/vendorboot/pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip" \
            --stock-report "$RUNNER_TEMP/vendorboot-candidate/stock-report.json" \
            --candidate-report "$RUNNER_TEMP/vendorboot-candidate/gki-candidate.json" \
            --metadata "$RUNNER_TEMP/vendorboot-candidate/build-metadata.txt" \
            --symvers "$RUNNER_TEMP/vendorboot-candidate/Module.symvers" \
            --output "$RUNNER_TEMP/abi-result/ota-abi-report-with-vendorboot.json"
          jq '{
            gate, eligible_for_fastboot_boot, module_count, imports_checked,
            vendor_boot_modules_seen, vendor_boot_additional_modules,
            vendor_boot_additional_imports, core_imports_checked, oem_imports_checked,
            failed_modules_count:(.failed_modules|length),
            crc_mismatches_count:(.crc_mismatches|length),
            unresolved_count:(.unresolved_kernel_imports|length),
            ambiguous_count:(.ambiguous_providers|length),
            missing_examples:.unresolved_kernel_imports[:8],
            failure_examples:.failed_modules[:8],
            ambiguous_examples:.ambiguous_providers[:8]
          }' "$RUNNER_TEMP/abi-result/ota-abi-report-with-vendorboot.json"
          echo 'READ ONLY: Eligibility remains enforced; no boot generated or LKG changed' >> "$GITHUB_STEP_SUMMARY"
      - name: "归档只读证据"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pandora-406-vendorboot-provider-crc
          path: |
            ${{ runner.temp }}/abi-result/vendorboot-provider-report.json
            ${{ runner.temp }}/abi-result/ota-abi-report-with-vendorboot.json
          if-no-files-found: warn
          retention-days: 30
