name: "一次性维护 / 清理 OS4 废弃 Actions 记录和实验分支"

on:
  push:
    paths:
      - ".github/workflows/xiaomi-os4-one-time-full-repo-clean-20261101.yml"

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: xiaomi-os4-one-time-action-run-retention-20261101
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - name: "核验合并状态，列出可保留的正式工作流"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/41" --jq '.merged')" == true ]] || {
            echo "::error::PR #41 未合并，拒绝删运行记录"; exit 1;
          }
          git ls-files '.github/workflows/*.yml' > "$RUNNER_TEMP/live-workflows.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            | jq -s '[.[].workflow_runs[]]' > "$RUNNER_TEMP/all-runs.json"
          [[ "$(jq length "$RUNNER_TEMP/all-runs.json")" -lt 500 ]] || {
            echo "::error::运行记录数量异常，必须重新审计清理策略"; exit 1;
          }
          echo "ACTIONS_RUN_INVENTORY=$(jq length "$RUNNER_TEMP/all-runs.json")" >> "$GITHUB_STEP_SUMMARY"
      - name: "产生明确保留清单及一次性删除计划（先计划，后执行）"
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/all-runs.json" "$RUNNER_TEMP/live-workflows.txt" \
            "$RUNNER_TEMP/cleanup-plan.json" <<'PY'
          import json, sys
          from collections import Counter
          from pathlib import Path
          runs=json.loads(Path(sys.argv[1]).read_text())
          live=set(Path(sys.argv[2]).read_text().splitlines())
          protected={
            41072834543, 41210530544, 41213989920, 41217776390,
            41236231127, 41234290288, 41233192839, 41232423864,
            41231264421, 41227599627, 41225541119, 41237016655,
            41237158359, 41237269292,
          }
          guard=".github/workflows/xiaomi-upstream-isolation-guard.yml"
          custom=".github/workflows/xiaomi-sm8850-os4-custom.yml"
          feedback=".github/workflows/xiaomi-sm8850-os4-ota-test-feedback.yml"
          latest_success={}
          for r in sorted(runs,key=lambda x:(x.get("created_at",""),x["id"]),reverse=True):
              if r["path"].split("@")[0]==guard and r["conclusion"]=="success":
                  latest_success.setdefault(r.get("head_branch"),r["id"])
          plan=[]
          reasons=Counter()
          for r in runs:
              path=r.get("path","").split("@")[0]
              rid=r["id"]
              if r.get("status")!="completed" or rid in protected:
                  continue
              reason=None
              if path not in live:
                  # Preserve any former production build or user-verified run.
                  if path.startswith(".github/workflows/xiaomi-os4-") and "one-time" in path:
                      reason="obsolete-one-time-workflow"
                  elif path.startswith(".github/workflows/xiaomi-os4-temp-"):
                      reason="obsolete-temporary-workflow"
                  elif path.startswith(".github/workflows/os4-one-time-"):
                      reason="obsolete-one-time-workflow"
              elif r.get("head_branch")!="dev" and r.get("event")=="push":
                  if path==guard and latest_success.get(r.get("head_branch"))!=rid:
                      reason="superseded-intermediate-guard-run"
                  elif path==custom:
                      reason="invalid-experimental-custom-push"
                  elif path==feedback:
                      reason="obsolete-test-feedback-push"
              if reason:
                  plan.append(dict(id=rid,path=path,branch=r.get("head_branch"),
                                   event=r.get("event"),sha=r.get("head_sha"),
                                   reason=reason))
                  reasons[reason]+=1
          if len(plan)>180:
              raise SystemExit("too many actions runs would be deleted")
          if any(item["id"] in protected or item["path"] not in live and
                 not ("one-time" in item["path"] or "temp-" in item["path"])
                 for item in plan):
              raise SystemExit("unsafe deletion plan")
          result=dict(inventory=len(runs),delete=len(plan),preserved=len(runs)-len(plan),
                      reasons=dict(reasons),runs=plan)
          Path(sys.argv[3]).write_text(json.dumps(result,indent=2)+"\n")
          print("PLANNED_DELETIONS",len(plan),dict(reasons))
          PY
          {
            echo "## 已计算并校验的清理计划"
            echo
            echo "- GitHub Actions 总记录数: $(jq -r .inventory "$RUNNER_TEMP/cleanup-plan.json")"
            echo "- 计划清理: $(jq -r .delete "$RUNNER_TEMP/cleanup-plan.json")"
            echo "- 保护保留: $(jq -r .preserved "$RUNNER_TEMP/cleanup-plan.json")"
            echo "- 按原因分类:"
            jq -r '.reasons|to_entries[]|"- "+.key+": "+(.value|tostring)' "$RUNNER_TEMP/cleanup-plan.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "逐条核验身份，删除过时运行记录（不碰正式构建）"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          success=0
          failed=0
          while IFS="$(printf '\t')" read -r id path branch event sha reason; do
            [[ "$id" =~ ^[0-9]+$ ]] || exit 1
            current="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id")" || {
              echo "::error::无法重新读取 Run $id"; failed=$((failed+1)); continue;
            }
            if ! jq -e --arg id "$id" --arg path "$path" --arg branch "$branch" \
              --arg event "$event" --arg sha "$sha" '
                (.id|tostring)==$id and .status=="completed" and
                .path==$path and .head_branch==$branch and
                .event==$event and .head_sha==$sha' <<<"$current" >/dev/null; then
              echo "::error::Run $id 的真实身份已变化"; failed=$((failed+1)); continue
            fi
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null; then
              success=$((success+1))
            else
              echo "::warning::删除 Run $id 失败"
              failed=$((failed+1))
            fi
            # GitHub secondary-rate-limit protection.
            sleep 0.8
          done < <(jq -r '.runs[]|[.id,.path,.branch,.event,.sha,.reason]|@tsv' "$RUNNER_TEMP/cleanup-plan.json")
          {
            echo "## 清理执行结果"
            echo "- 成功删除运行记录: $success"
            echo "- 未能删除: $failed"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$failed" -eq 0 ]] || exit 1
      - name: "只删除已废弃、已核对 SHA 的实验性分支"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for entry in \
            "audit/os4-full-chain-synthetic-cleanup-20261101=a549f1b9c15436ba5b68c7a10d3cf2486df2d375" \
            "feat/os4-ota-device-test-verification-20261101=cb812df484baef786d09d9281d108a0b7e90f92e"; do
            branch="$(cut -d= -f1 <<<"$entry")"
            expected="$(cut -d= -f2 <<<"$entry")"
            got="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            [[ "$got" == "$expected" ]] || {
              echo "::error::分支 $branch SHA 不一致，拒绝删"; exit 1;
            }
            open="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq "[.[]|select(.head.ref==\"$branch\")]|length")"
            [[ "$open" -eq 0 ]] || { echo "::error::分支仍有未关闭 PR"; exit 1; }
            if [[ "$branch" == "feat/os4-ota-device-test-verification-20261101" ]]; then
              # Old device-test branch is superseded by the fully deployed
              # xiaomi-sm8850-os4-ota-test-feedback.yml workflow on dev.
              test -s .github/workflows/xiaomi-sm8850-os4-ota-test-feedback.yml
            else
              [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/41" --jq .merged)" == true ]]
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            echo "- 已清理废弃分支: $branch" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "清理不涉及上游同名分支、历史 LKG 配置或任何 Release。" >> "$GITHUB_STEP_SUMMARY"
