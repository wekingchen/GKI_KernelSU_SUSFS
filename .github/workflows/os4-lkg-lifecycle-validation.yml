name: "OS4 movable LKG lifecycle one-shot validation"

on:
  push:
    branches:
      - os4-dynamic-upstreams-lkg-promotion-20261031
    paths:
      - ".github/workflows/os4-lkg-lifecycle-validation.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: os4-movable-lkg-lifecycle-validation
  cancel-in-progress: true

jobs:
  promotion-render:
    name: "候选 Artifact → 下一代 LKG 渲染验证"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "检出候选代码"
        uses: actions/checkout@v7

      - name: "安装依赖"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip

      - name: "下载已通过动态上游验证的候选 Artifact"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CAND="$RUNNER_TEMP/candidate"
          RAW="$RUNNER_TEMP/candidate-raw"
          mkdir -p "$CAND" "$RAW"
          gh run download 41200973690 \
            --repo "$GITHUB_REPOSITORY" \
            --name "os4-dynamic-stable-upstreams-validation" \
            --dir "$RAW"

          normalize_one() {
            local name="$1"
            local found
            found="$(find "$RAW" -type f -name "$name" -print -quit)"
            [[ -n "$found" ]] || return 1
            cp -f "$found" "$CAND/$name"
          }

          for name in final.config Module.symvers resolved-upstreams.env image-reproducibility.env build-metadata.txt; do
            normalize_one "$name" || {
              echo "::error::实验 Artifact 缺少 $name"; exit 1;
            }
          done

          AK3="$(find "$RAW" -type f -name '*AnyKernel3.zip' -print -quit)"
          [[ -n "$AK3" && -s "$AK3" ]] || {
            echo "::error::实验 Artifact 中未找到 AnyKernel3"; exit 1;
          }
          cp -f "$AK3" "$CAND/$(basename "$AK3")"

          IMAGE="$(find "$RAW" -type f -name 'Image' -print -quit)"
          if [[ -n "$IMAGE" && -s "$IMAGE" ]]; then
            cp -f "$IMAGE" "$CAND/Image"
          else
            unzip -p "$AK3" Image > "$CAND/Image"
          fi

          BOOT="$(find "$RAW" -type f -name '*FASTBOOT-BOOT-ONLY.img' -print -quit)"
          [[ -n "$BOOT" && -s "$BOOT" ]] || {
            echo "::error::实验 Artifact 中未找到 fastboot boot"; exit 1;
          }
          cp -f "$BOOT" "$CAND/$(basename "$BOOT")"

          test -s "$CAND/Image"

      - name: "重建生产候选 selection-manifest"
        shell: bash
        run: |
          set -euo pipefail
          CAND="$RUNNER_TEMP/candidate"
          RELEASE="$(sed -n 's/^KERNEL_RELEASE=//p' "$CAND/build-metadata.txt")"
          BOOT="$(find "$CAND" -maxdepth 1 -type f -name '*FASTBOOT-BOOT-ONLY.img' -printf '%f\n' | head -n1)"
          AK3="$(find "$CAND" -maxdepth 1 -type f -name '*AnyKernel3.zip' -printf '%f\n' | head -n1)"
          [[ -n "$RELEASE" && -n "$BOOT" && -n "$AK3" ]]

          cat > "$CAND/selection-manifest.txt" <<EOF
          DEVICE=pandora
          SYSTEM_BUILD=OS4.0.5.0.XBLCNXM
          REQUEST_ROOT_MODE=bakasu-susfs
          REQUEST_SUSFS_EXTRA=true
          REQUEST_NOMOUNT=true
          REQUEST_DROIDSPACES=on
          REQUEST_NTSYNC=true
          REQUEST_BBG=true
          REQUEST_REKERNEL=true
          REQUEST_NETWORKING=true
          REQUEST_CVE=true
          KERNEL_RELEASE=$RELEASE
          IMAGE_SHA256=$(sha256sum "$CAND/Image" | awk '{print $1}')
          CONFIG_SHA256=$(sha256sum "$CAND/final.config" | awk '{print $1}')
          SYMVERS_SHA256=$(sha256sum "$CAND/Module.symvers" | awk '{print $1}')
          FASTBOOT_BOOT=$BOOT
          FASTBOOT_BOOT_SHA256=$(sha256sum "$CAND/$BOOT" | awk '{print $1}')
          ANYKERNEL3=$AK3
          ANYKERNEL3_SHA256=$(sha256sum "$CAND/$AK3" | awk '{print $1}')
          SAFETY=CUSTOM_UNVERIFIED_PERSISTENT_PACKAGE
          EOF

          unzip -t "$CAND/$AK3" >/dev/null
          [[ "$(unzip -p "$CAND/$AK3" Image | sha256sum | awk '{print $1}')" == "$(sha256sum "$CAND/Image" | awk '{print $1}')" ]]

      - name: "渲染下一代 LKG 并核对"
        shell: bash
        run: |
          set -euo pipefail
          CAND="$RUNNER_TEMP/candidate"
          CURRENT=".github/config/pandora-os4-full-parity-lkg.env"
          NEW="$RUNNER_TEMP/promoted-lkg.env"

          python3 scripts/xiaomi-os4/promote-custom-run-to-lkg.py \
            --current-lkg "$CURRENT" \
            --candidate-dir "$CAND" \
            --source-run-id 41200973690 \
            --source-run-head bdee13a1e338d5342c7bc3e615eaefea1c71227b \
            --artifact-id 13042666731 \
            --promoted-at 2026-10-31T00:00:00Z \
            --note lifecycle-validation-only \
            --output "$NEW"

          bash -n "$NEW"
          source "$NEW"
          source "$CAND/resolved-upstreams.env"

          [[ "$LKG_PROMOTION_GENERATION" == "2" ]]
          [[ "$LKG_SOURCE_RUN_ID" == "41200973690" ]]
          [[ "$LKG_BAKASU_COMMIT" == "$RESOLVED_BAKASU_COMMIT" ]]
          [[ "$LKG_SUSFS_COMMIT" == "$RESOLVED_SUSFS_COMMIT" ]]
          [[ "$LKG_NOMOUNT_COMMIT" == "$RESOLVED_NOMOUNT_COMMIT" ]]
          [[ "$LKG_DROIDSPACES_COMMIT" == "$RESOLVED_DROIDSPACES_COMMIT" ]]
          [[ "$LKG_NTSYNC_PATCH_COMMIT" == "$RESOLVED_NTSYNC_COMMIT" ]]
          [[ "$LKG_BBG_COMMIT" == "$RESOLVED_BBG_COMMIT" ]]
          [[ "$LKG_REKERNEL_COMMIT" == "$RESOLVED_REKERNEL_COMMIT" ]]
          [[ "$LKG_IMAGE_SHA256" == "$(sha256sum "$CAND/Image" | awk '{print $1}')" ]]
          [[ "$LKG_FINAL_CONFIG_SHA256" == "$(sha256sum "$CAND/final.config" | awk '{print $1}')" ]]
          [[ "$LKG_SYMVERS_SHA256" == "$(sha256sum "$CAND/Module.symvers" | awk '{print $1}')" ]]

          cp "$NEW" "$RUNNER_TEMP/promoted-lkg-validation.env"

      - name: "上传晋升渲染结果"
        uses: actions/upload-artifact@v6
        with:
          name: os4-movable-lkg-promotion-render-validation
          path: ${{ runner.temp }}/promoted-lkg-validation.env
          if-no-files-found: error
          retention-days: 7

  reproduce-current:
    name: "当前 LKG 精确复现验证"
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: "检出候选代码"
        uses: actions/checkout@v7

      - name: "载入当前 LKG 并注入精确组件快照"
        shell: bash
        run: |
          set -euo pipefail
          source .github/config/pandora-os4-full-parity-lkg.env
          grep -E '^LKG_[A-Z0-9_]+=' .github/config/pandora-os4-full-parity-lkg.env >> "$GITHUB_ENV"
          {
            echo "OS4_BAKASU_REF_KIND=$LKG_BAKASU_KIND"
            echo "OS4_BAKASU_REF=$LKG_BAKASU_REF"
            echo "OS4_BAKASU_COMMIT=$LKG_BAKASU_COMMIT"
            echo "OS4_SUSFS_REF_KIND=$LKG_SUSFS_KIND"
            echo "OS4_SUSFS_BRANCH=$LKG_SUSFS_REF"
            echo "OS4_SUSFS_COMMIT=$LKG_SUSFS_COMMIT"
            echo "OS4_NOMOUNT_REF_KIND=$LKG_NOMOUNT_KIND"
            echo "OS4_NOMOUNT_REF=$LKG_NOMOUNT_REF"
            echo "OS4_NOMOUNT_COMMIT=$LKG_NOMOUNT_COMMIT"
            echo "OS4_DROIDSPACES_REF_KIND=$LKG_DROIDSPACES_KIND"
            echo "OS4_DROIDSPACES_REF=$LKG_DROIDSPACES_REF"
            echo "OS4_DROIDSPACES_COMMIT=$LKG_DROIDSPACES_COMMIT"
            echo "OS4_NTSYNC_REF_KIND=$LKG_NTSYNC_KIND"
            echo "OS4_NTSYNC_PATCH_REF=$LKG_NTSYNC_REF"
            echo "OS4_NTSYNC_PATCH_COMMIT=$LKG_NTSYNC_PATCH_COMMIT"
            echo "OS4_BBG_REF_KIND=$LKG_BBG_KIND"
            echo "OS4_BBG_REF=$LKG_BBG_REF"
            echo "OS4_BBG_COMMIT=$LKG_BBG_COMMIT"
            echo "OS4_REKERNEL_REF_KIND=$LKG_REKERNEL_KIND"
            echo "OS4_REKERNEL_REF=$LKG_REKERNEL_REF"
            echo "OS4_REKERNEL_COMMIT=$LKG_REKERNEL_COMMIT"
          } >> "$GITHUB_ENV"

      - name: "安装构建依赖"
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git jq libdw-dev \
            libelf-dev libssl-dev patch perl python3 rsync tar unzip xz-utils \
            zip zstd dwarves

      - name: "恢复固定 R62 源码缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/common-r62.git
          key: xiaomi-pandora-os4-common-e2b8ca7c8d05-v1

      - name: "恢复固定 r536225 工具链"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/toolchain-r536225
          key: xiaomi-pandora-os4-toolchain-r536225-verified-v1

      - name: "恢复当前 LKG 编译缓存"
        uses: actions/cache@v6
        with:
          path: ~/.cache/xiaomi-os4/ccache-r62
          key: xiaomi-pandora-os4-ccache-r62-movable-lkg-${{ hashFiles('.github/config/pandora-os4-full-parity-lkg.env', 'scripts/xiaomi-os4/**', 'security_patch/**') }}
          restore-keys: |
            xiaomi-pandora-os4-ccache-r62-lkg-
            xiaomi-pandora-os4-ccache-r62-custom-
            xiaomi-pandora-os4-ccache-r62-

      - name: "按当前 LKG 精确构建"
        shell: bash
        run: |
          set -euo pipefail
          export XIAOMI_OS4_SELECTABLE_BUILD=1
          export XIAOMI_OS4_ROOT_MODE="$LKG_ROOT_MODE"
          export XIAOMI_OS4_SUSFS_EXTRA_FEATURES="$LKG_SUSFS_EXTRA_FEATURES"
          export XIAOMI_OS4_USE_NOMOUNT="$LKG_USE_NOMOUNT"
          export XIAOMI_OS4_DROIDSPACES="$LKG_DROIDSPACES"
          export XIAOMI_OS4_USE_NTSYNC="$LKG_USE_NTSYNC"
          export XIAOMI_OS4_USE_BBG="$LKG_USE_BBG"
          export XIAOMI_OS4_USE_REKERNEL="$LKG_USE_REKERNEL"
          export XIAOMI_OS4_USE_NETWORKING="$LKG_USE_NETWORKING"
          export XIAOMI_OS4_USE_CVE="$LKG_USE_CVE"
          bash scripts/xiaomi-os4/build-r62-features.sh

      - name: "核对当前 LKG 身份"
        shell: bash
        run: |
          set -euo pipefail
          RES="$RUNNER_TEMP/xiaomi-os4-integrated/results"
          [[ "$(sha256sum "$RES/final.config" | awk '{print $1}')" == "$LKG_FINAL_CONFIG_SHA256" ]]
          [[ "$(sha256sum "$RES/Module.symvers" | awk '{print $1}')" == "$LKG_SYMVERS_SHA256" ]]
          grep -qx "KERNEL_RELEASE=$LKG_KERNEL_RELEASE" "$RES/build-metadata.txt"
          grep -qx 'EXACT_LKG_SELECTION=1' "$RES/build-metadata.txt"
          grep -qx 'UPSTREAM_IDENTITY_MATCH_LKG=1' "$RES/build-metadata.txt"

          python3 scripts/xiaomi-os4/verify-lkg-image-equivalence.py "$RES/Image" \
            --expected-size "$LKG_IMAGE_SIZE" \
            --build-id-payload-offset "$LKG_IMAGE_BUILD_ID_PAYLOAD_OFFSET" \
            --cert-offset "$LKG_IMAGE_MODULE_CERT_OFFSET" \
            --cert-length "$LKG_IMAGE_MODULE_CERT_LENGTH" \
            --expected-normalized-sha256 "$LKG_IMAGE_NORMALIZED_SHA256"

          mkdir -p "$RUNNER_TEMP/lkg"
          XIAOMI_AK3_MODE=validated-rebuild \
          XIAOMI_AK3_RELEASE="$LKG_KERNEL_RELEASE" \
            bash scripts/xiaomi-os4/package-validated-anykernel3.sh \
              "$RES/Image" "$RUNNER_TEMP/lkg"
          cp "$RES/build-metadata.txt" "$RUNNER_TEMP/lkg/"
          cp "$RES/Module.symvers" "$RUNNER_TEMP/lkg/"
          cp "$RES/final.config" "$RUNNER_TEMP/lkg/"

      - name: "上传当前 LKG 复现验证"
        uses: actions/upload-artifact@v6
        with:
          name: os4-current-lkg-reproduction-validation
          path: ${{ runner.temp }}/lkg/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
