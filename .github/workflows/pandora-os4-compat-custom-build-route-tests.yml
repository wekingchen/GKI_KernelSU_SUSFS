name: "小米17 Pro OS4 / EEXIST 自定义构建路由回归"

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/config/ota-development-current.json"
      - ".github/config/ota-verified/OS4.0.6.0.XBLCNXM/**"
      - ".github/config/ota-verified/OS4.0.8.0.XBLCNXM/**"
      - ".github/workflows/xiaomi-sm8850-os4-custom.yml"
      - ".github/workflows/xiaomi-sm8850-os4-promote-lkg.yml"
      - ".github/workflows/pandora-os4-compat-custom-build-route-tests.yml"
      - "scripts/xiaomi-os4/build-r62-features.sh"
      - "scripts/xiaomi-os4/ota-development-pointer.py"
      - "scripts/xiaomi-os4/prepare-pandora-406-eexist-compat-baseline.py"
      - "scripts/xiaomi-os4/repack-fastboot-boot-v4-from-fixture.py"
      - "scripts/xiaomi-os4/test_repack_fastboot_boot_v4_growth.py"
      - "scripts/xiaomi-os4/apply-pandora-rust-binder-eexist-shim.py"
      - "scripts/xiaomi-os4/check-ota-feature-abi.py"
      - "scripts/xiaomi-os4/check-ota-oem-abi.py"
      - "scripts/xiaomi-os4/test_runtime_selected_oem_gate.py"
      - "scripts/xiaomi-os4/build-pandora-406-persistent-equivalent-boot.py"
      - "scripts/xiaomi-os4/test_pandora_406_persistent_equivalent_boot.py"
      - "scripts/xiaomi-os4/select-lkg-promotion-route.py"
      - "scripts/xiaomi-os4/cross-ota-lkg.py"
      - "scripts/xiaomi-os4/export-ota-lkg-rebuild-env.py"
      - "scripts/xiaomi-os4/run-cross-ota-lkg.sh"
      - "scripts/xiaomi-os4/check-lkg-dev-advance.py"
      - "scripts/xiaomi-os4/test_lkg_dev_advance.py"
      - "scripts/xiaomi-os4/check-ota-lkg-recovery.py"
      - "scripts/xiaomi-os4/test_ota_lkg_recovery.py"
      - "scripts/xiaomi-os4/check-ota-lkg-draft-assets.py"
      - "scripts/xiaomi-os4/test_ota_lkg_draft_assets.py"
      - "scripts/xiaomi-os4/resume-cross-ota-lkg-draft.sh"
      - "scripts/xiaomi-os4/package-pandora-406-run37-anykernel3.sh"
      - "scripts/xiaomi-os4/package-validated-anykernel3.sh"
      - "scripts/xiaomi-os4/check-ota-anykernel-evidence.py"
      - "scripts/xiaomi-os4/test_ota_anykernel_evidence.py"
      - "scripts/xiaomi-os4/test_ota_ccache_policy.py"
      - "scripts/xiaomi-os4/test_ota_compat_anykernel_cmdline.py"
      - "scripts/xiaomi-os4/test_cross_ota_lkg.py"
      - "scripts/xiaomi-os4/test_ota_development_switch.py"
      - "scripts/xiaomi-os4/test_pandora_rust_binder_eexist_shim.py"
      - "scripts/xiaomi-os4/test_lkg_promotion_routes.py"

permissions:
  contents: read

jobs:
  compat-route-regression:
    name: "验证兼容基线、EEXIST 补丁、构建路由与 LKG 禁门"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "检出 PR"
        uses: actions/checkout@v7

      - name: "Shell / Python / Workflow 语法检查"
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/xiaomi-os4/build-r62-features.sh
          bash -n scripts/xiaomi-os4/run-cross-ota-lkg.sh
          bash -n scripts/xiaomi-os4/resume-cross-ota-lkg-draft.sh
          bash -n scripts/xiaomi-os4/package-pandora-406-run37-anykernel3.sh
          bash -n scripts/xiaomi-os4/package-validated-anykernel3.sh
          python3 -m py_compile \
            scripts/xiaomi-os4/ota-development-pointer.py \
            scripts/xiaomi-os4/prepare-pandora-406-eexist-compat-baseline.py \
            scripts/xiaomi-os4/repack-fastboot-boot-v4-from-fixture.py \
            scripts/xiaomi-os4/test_repack_fastboot_boot_v4_growth.py \
            scripts/xiaomi-os4/apply-pandora-rust-binder-eexist-shim.py \
            scripts/xiaomi-os4/check-ota-feature-abi.py \
            scripts/xiaomi-os4/check-ota-oem-abi.py \
            scripts/xiaomi-os4/test_runtime_selected_oem_gate.py \
            scripts/xiaomi-os4/build-pandora-406-persistent-equivalent-boot.py \
            scripts/xiaomi-os4/test_pandora_406_persistent_equivalent_boot.py \
            scripts/xiaomi-os4/select-lkg-promotion-route.py \
            scripts/xiaomi-os4/cross-ota-lkg.py \
            scripts/xiaomi-os4/check-lkg-dev-advance.py \
            scripts/xiaomi-os4/check-ota-lkg-recovery.py \
            scripts/xiaomi-os4/check-ota-lkg-draft-assets.py \
            scripts/xiaomi-os4/test_ota_lkg_draft_assets.py \
            scripts/xiaomi-os4/test_lkg_dev_advance.py \
            scripts/xiaomi-os4/test_ota_lkg_recovery.py \
            scripts/xiaomi-os4/export-ota-lkg-rebuild-env.py \
            scripts/xiaomi-os4/check-ota-anykernel-evidence.py \
            scripts/xiaomi-os4/test_ota_anykernel_evidence.py \
            scripts/xiaomi-os4/test_ota_ccache_policy.py \
            scripts/xiaomi-os4/test_ota_compat_anykernel_cmdline.py
          ruby -ryaml -e 'YAML.parse_file(ARGV.fetch(0))' \
            .github/workflows/xiaomi-sm8850-os4-custom.yml
          ruby -ryaml -e 'YAML.parse_file(ARGV.fetch(0))' \
            .github/workflows/xiaomi-sm8850-os4-promote-lkg.yml

      - name: "OS4.0.6 兼容路由、来源锁与 EEXIST 准备器测试"
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/xiaomi-os4/test_ota_development_switch.py -v
          python3 scripts/xiaomi-os4/test_ota_anykernel_evidence.py -v
          python3 scripts/xiaomi-os4/test_ota_ccache_policy.py -v
          python3 scripts/xiaomi-os4/test_ota_compat_anykernel_cmdline.py -v
          python3 scripts/xiaomi-os4/test_pandora_rust_binder_eexist_shim.py -v
          python3 scripts/xiaomi-os4/test_repack_fastboot_boot_v4_growth.py -v
          python3 scripts/xiaomi-os4/test_runtime_selected_oem_gate.py -v
          python3 scripts/xiaomi-os4/test_pandora_406_persistent_equivalent_boot.py -v
          python3 scripts/xiaomi-os4/test_lkg_promotion_routes.py -v
          python3 scripts/xiaomi-os4/test_cross_ota_lkg.py -v
          python3 scripts/xiaomi-os4/test_lkg_dev_advance.py -v
          python3 scripts/xiaomi-os4/test_ota_lkg_recovery.py -v
          python3 scripts/xiaomi-os4/test_ota_lkg_draft_assets.py -v

      - name: "真实 GitHub API 只读冒烟：草稿数字 ID 与二进制 SHA256"
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="pandora-os4-lkg-gen$(jq -er '.generation+1' .github/config/ota-lkg-current.json)"
          BUILD="$(jq -er .stock_build .github/config/ota-lkg-current.json)"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/draft-list.json"
          ID="$(jq -r --arg tag "$TAG" '[.[] | select(.tag_name==$tag and .draft==true)] |
            if length==1 then .[0].id else empty end' "$RUNNER_TEMP/draft-list.json")"
          if [[ -z "$ID" ]]; then
            echo "No next-gen draft; live draft endpoint test not applicable"
            exit 0
          fi
          [[ "$ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" > "$RUNNER_TEMP/draft-by-id.json"
          python3 scripts/xiaomi-os4/check-ota-lkg-draft-assets.py \
            --release "$RUNNER_TEMP/draft-by-id.json" --tag "$TAG" --build "$BUILD" \
            --output "$RUNNER_TEMP/draft-assets.tsv"
          README_ID="$(jq -er '[.assets[] | select(.name=="README-RECOVERY.md")] |
            if length==1 then .[0].id else error("missing README") end' "$RUNNER_TEMP/draft-by-id.json")"
          README_SHA="$(jq -er '[.assets[] | select(.name=="README-RECOVERY.md")] |
            if length==1 then .[0].digest | sub("^sha256:";"") else error("missing digest") end' "$RUNNER_TEMP/draft-by-id.json")"
          README_SIZE="$(jq -er '[.assets[] | select(.name=="README-RECOVERY.md")] |
            if length==1 then .[0].size else error("missing size") end' "$RUNNER_TEMP/draft-by-id.json")"
          curl --fail --location --silent --show-error --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            --output "$RUNNER_TEMP/README-RECOVERY.md" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$README_ID"
          [[ "$(stat -c%s "$RUNNER_TEMP/README-RECOVERY.md")" == "$README_SIZE" ]] || exit 1
          [[ "$(sha256sum "$RUNNER_TEMP/README-RECOVERY.md" | cut -d' ' -f1)" == "$README_SHA" ]] || exit 1
          echo "DRAFT_RELEASE_ASSET_BINARY_BY_ID=PASS id=$ID"

      - name: "验证 compatibility 开发基线保持非刷机，同时 Gen 6 解锁持久自定义机制"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".")
          pointer = json.loads((root / ".github/config/ota-development-current.json").read_text())
          record = json.loads((root / pointer["record_path"]).read_text())
          fixture = json.loads((root / pointer["fixture_path"]).read_text())
          lkg = json.loads((root / ".github/config/ota-lkg-current.json").read_text())
          persistent = json.loads((root / ".github/config/ota-verified/OS4.0.6.0.XBLCNXM/persistent-candidate.json").read_text())
          assert pointer["status"] == "VERIFIED_OTA_COMPATIBILITY_DEVELOPMENT_ONLY"
          assert pointer["build"] in ("OS4.0.6.0.XBLCNXM", "OS4.0.8.0.XBLCNXM")
          assert record["formal_oem_gate"] == "BLOCKED"
          assert record["safe_to_flash"] is False
          assert fixture["safe_to_flash"] is False
          assert pointer["full_parity_lkg_promoted"] is False
          assert lkg["status"] == "USER_PROMOTED_OTA_LKG"
          assert lkg["generation"] >= 6
          assert lkg["stock_build"] == "OS4.0.6.0.XBLCNXM"
          if pointer["build"] == "OS4.0.8.0.XBLCNXM":
              import importlib.util
              spec = importlib.util.spec_from_file_location("router", root / "scripts/xiaomi-os4/ota-development-pointer.py")
              router = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(router)
              assert router.pointer_check(pointer, record, fixture)[0] == pointer["build"]
              assert not router.persistent_compat_unlocked(root / ".github/config/ota-lkg-current.json", root / ".github/config/ota-verified/OS4.0.6.0.XBLCNXM/persistent-candidate.json", record)
              print("PANDORA_408_COMPAT_BASELINE=NONFLASH; PERSISTENT_GATE=BLOCKED")
          anchor = lkg if lkg["generation"] == 6 else json.loads(
              (root / ".github/config/ota-lkg-history/gen6.json").read_text()
          )
          assert anchor["generation"] == 6
          assert anchor["stock_build"] == lkg["stock_build"]
          assert anchor["gki_commit"] == lkg["gki_commit"]
          assert persistent["status"] == "PASS_TWO_TRUE_DEVICE_PERSISTENT_REBOOTS_LKG_READY"
          assert persistent["actual_persistent_install_verified"] is True
          assert persistent["lkg_promotion"] is True
          assert persistent["feature_workflow_run_id"] == anchor["source_run_id"]
          assert persistent["feature_image_sha256"] == anchor["image_sha256"]
          assert persistent["package_sha256"] == anchor["anykernel_sha256"]
          print("PANDORA_406_COMPAT_BASELINE=NONFLASH")
          print("PANDORA_406_PERSISTENT_CUSTOM_MECHANISM=UNLOCKED_BY_GEN6")
          PY
