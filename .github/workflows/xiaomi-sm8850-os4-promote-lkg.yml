name: "小米17 Pro OS4 / 将自定义构建晋升为 LKG"

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "已真机稳定使用的 OS4 自定义 Run ID（自动识别 R62 / 新 OTA）"
        type: string
        required: true
      confirm_boot:
        description: "确认此 Run 已在真机成功启动"
        type: boolean
        required: true
        default: false
      confirm_persistent:
        description: "确认该内核已经持久安装并稳定使用"
        type: boolean
        required: true
        default: false
      confirm_runtime:
        description: "确认本次选择的 Root、SUSFS、NoMount 等功能运行正常"
        type: boolean
        required: true
        default: false
      repair_draft_release:
        description: "仅修复已成功晋升但未公开的新 OTA LKG 草稿 Release"
        type: boolean
        required: true
        default: false
      note:
        description: "稳定版备注（可选）"
        type: string
        required: false
        default: "user-confirmed-stable"

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: pandora-os4-unified-lkg-promotion
  cancel-in-progress: false

jobs:
  select-route:
    name: "自动识别来源：旧 R62 / 新 OTA / 草稿修复"
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - name: "验证源 Run 身份、类型和唯一未过期产物"
        id: route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CONFIRM_BOOT: ${{ inputs.confirm_boot }}
          CONFIRM_PERSISTENT: ${{ inputs.confirm_persistent }}
          CONFIRM_RUNTIME: ${{ inputs.confirm_runtime }}
          REPAIR_DRAFT: ${{ inputs.repair_draft_release }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::请输入真实的自定义构建 Run ID"; exit 1;
          }
          if [[ "$REPAIR_DRAFT" == true ]]; then
            echo "mode=repair" >> "$GITHUB_OUTPUT"
            echo "LKG_ROUTE=REPAIR_EXISTING_OTA_RELEASE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$CONFIRM_BOOT" == true && "$CONFIRM_PERSISTENT" == true && "$CONFIRM_RUNTIME" == true ]] || {
            echo "::error::正式晋升必须确认真机启动、持久稳定使用和所选功能正常"; exit 1;
          }
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e '.status=="completed" and .conclusion=="success" and
                 .event=="workflow_dispatch" and .head_branch=="dev" and
                 .path==".github/workflows/xiaomi-sm8850-os4-custom.yml"' <<<"$RUN" >/dev/null || {
            echo "::error::只允许 dev 正式自定义工作流的成功 Run"; exit 1;
          }
          ARTIFACTS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          LEGACY="pandora-OS4-R62-CUSTOM-run-$SOURCE_RUN_ID"
          OLD="$(jq --arg name "$LEGACY" '[.artifacts[] | select(.expired==false and .name==$name)] | length' <<<"$ARTIFACTS")"
          OTA="$(jq --arg id "$SOURCE_RUN_ID" '[.artifacts[] | select(.expired==false) | .name |
            select(startswith("pandora-OTA-CUSTOM-") and endswith("-run-"+$id))] | length' <<<"$ARTIFACTS")"
          [[ "$OLD" -le 1 && "$OTA" -le 1 && $((OLD+OTA)) -eq 1 ]] || {
            echo "::error::找不到唯一、未过期、名称与 Run ID 匹配的 R62 或新 OTA 产物"; exit 1;
          }
          if [[ "$OLD" == 1 ]]; then
            [[ ! -e .github/config/ota-lkg-current.json ]] || {
              echo "::error::LKG 已迁移到新 OTA，拒绝旧 R62 产生冲突代次"; exit 1;
            }
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            echo "LKG_ROUTE=R62_LEGACY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=ota" >> "$GITHUB_OUTPUT"
            echo "LKG_ROUTE=CROSS_OTA_STRICT_REBUILD_ARCHIVE" >> "$GITHUB_STEP_SUMMARY"
          fi

  promote:
    needs: select-route
    name: "验证候选 → 上游隔离 → 自动合并新 LKG"
    if: needs.select-route.outputs.mode == 'legacy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: "检出 dev"
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: "安装校验依赖"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq unzip

      - name: "校验来源 run 并下载候选 Artifact"
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::source_run_id 必须是数字"
            exit 1
          }

          # A versioned OTA LKG supersedes the historical R62 promotion path.
          # Never let the old Gen3 counter issue a competing GenN after that.
          if [[ -e .github/config/ota-lkg-current.json ]]; then
            echo "::error::当前稳定 LKG 已切换到版本化 OTA 指针；R62 晋升入口不再允许创建冲突代次。"
            exit 1
          fi
          RUN_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          [[ "$(jq -r '.status' <<<"$RUN_JSON")" == "completed" ]] || {
            echo "::error::来源 run 尚未完成"; exit 1;
          }
          [[ "$(jq -r '.conclusion' <<<"$RUN_JSON")" == "success" ]] || {
            echo "::error::来源 run 不是 success"; exit 1;
          }
          [[ "$(jq -r '.path' <<<"$RUN_JSON")" == ".github/workflows/xiaomi-sm8850-os4-custom.yml" ]] || {
            echo "::error::只允许晋升正式 OS4 自定义 workflow 的产物"; exit 1;
          }
          [[ "$(jq -r '.head_branch' <<<"$RUN_JSON")" == "dev" ]] || {
            echo "::error::只允许晋升 dev 分支上的正式自定义构建"; exit 1;
          }

          HEAD_SHA="$(jq -r '.head_sha' <<<"$RUN_JSON")"
          ARTIFACT_NAME="pandora-OS4-R62-CUSTOM-run-$SOURCE_RUN_ID"
          ARTIFACTS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          ARTIFACT_ID="$(jq -r --arg name "$ARTIFACT_NAME" '
            [.artifacts[] | select(.name == $name and .expired == false)][0].id // empty
          ' <<<"$ARTIFACTS")"
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || {
            if jq -e '.artifacts[] | select(.expired == false) | .name | startswith("pandora-OTA-CUSTOM-")' <<<"$ARTIFACTS" >/dev/null; then
              echo "::error::检测到新 OTA 自定义产物：此晋升流程仍使用 R62 固定 ABI/KMI 和 Gen 3 fixture，尚不支持新 OTA 晋升。禁止跨版本使用旧流程。"
            else
              echo "::error::找不到未过期的 R62 自定义候选 Artifact: $ARTIFACT_NAME"
            fi
            exit 1
          }

          CAND="$RUNNER_TEMP/candidate"
          mkdir -p "$CAND"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir "$CAND"

          for required in \
            Image Module.symvers final.config build-metadata.txt selection-manifest.txt \
            resolved-upstreams.env image-reproducibility.env abi-lock-check.txt; do
            [[ -s "$CAND/$required" ]] || {
              echo "::error::候选 Artifact 缺少晋升所需文件: $required"
              exit 1
            }
          done

          echo "source_head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "candidate_dir=$CAND" >> "$GITHUB_OUTPUT"

      - name: "重新核对候选文件身份"
        shell: bash
        env:
          CAND: ${{ steps.source.outputs.candidate_dir }}
        run: |
          set -euo pipefail
          source "$CAND/selection-manifest.txt"
          source "$CAND/resolved-upstreams.env"
          source "$CAND/image-reproducibility.env"
          source .github/config/pandora-os4-full-parity-lkg.env

          [[ "$DEVICE" == "$LKG_DEVICE" ]]
          [[ "$SYSTEM_BUILD" == "$LKG_SYSTEM_BUILD" ]]

          [[ "$(sha256sum "$CAND/Image" | awk '{print $1}')" == "$IMAGE_SHA256" ]]
          [[ "$(sha256sum "$CAND/final.config" | awk '{print $1}')" == "$CONFIG_SHA256" ]]
          [[ "$(sha256sum "$CAND/Module.symvers" | awk '{print $1}')" == "$SYMVERS_SHA256" ]]
          [[ "$IMAGE_SHA256" == "$(sed -n 's/^IMAGE_SHA256=//p' "$CAND/image-reproducibility.env")" ]]

          [[ -s "$CAND/$FASTBOOT_BOOT" ]] || {
            echo "::error::fastboot boot 文件缺失: $FASTBOOT_BOOT"; exit 1;
          }
          [[ "$(sha256sum "$CAND/$FASTBOOT_BOOT" | awk '{print $1}')" == "$FASTBOOT_BOOT_SHA256" ]]

          [[ -s "$CAND/$ANYKERNEL3" ]] || {
            echo "::error::AnyKernel3 文件缺失: $ANYKERNEL3"; exit 1;
          }
          [[ "$(sha256sum "$CAND/$ANYKERNEL3" | awk '{print $1}')" == "$ANYKERNEL3_SHA256" ]]
          unzip -t "$CAND/$ANYKERNEL3" >/dev/null
          [[ "$(unzip -p "$CAND/$ANYKERNEL3" Image | sha256sum | awk '{print $1}')" == "$IMAGE_SHA256" ]]

          grep -qx "BAKASU_COMMIT=$RESOLVED_BAKASU_COMMIT" "$CAND/build-metadata.txt"
          grep -qx "SUSFS_COMMIT=$RESOLVED_SUSFS_COMMIT" "$CAND/build-metadata.txt"
          grep -qx "NOMOUNT_COMMIT=$RESOLVED_NOMOUNT_COMMIT" "$CAND/build-metadata.txt"
          grep -qx "DROIDSPACES_COMMIT=$RESOLVED_DROIDSPACES_COMMIT" "$CAND/build-metadata.txt"

      - name: "重新执行 KMI / ABI 固定锁"
        shell: bash
        env:
          CAND: ${{ steps.source.outputs.candidate_dir }}
        run: |
          set -euo pipefail
          source .github/config/pandora-os4-full-parity-lkg.env
          python3 - "$CAND/Module.symvers" "$LKG_ABI_ALLOWED_NEW_EXPORTS" "$LKG_ABI_LOCK_BASE_EXPORTS" "$LKG_ABI_LOCK_SHA256" <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          symvers, allow_path, expected_count, expected_sha = sys.argv[1:]
          allowed = {
              line.strip()
              for line in Path(allow_path).read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          entries = {}
          for line in Path(symvers).read_text(errors="replace").splitlines():
              parts = line.split()
              if len(parts) >= 2:
                  crc, symbol = parts[0], parts[1]
                  if symbol not in allowed:
                      entries[symbol] = crc
          canonical = "".join(f"{symbol}\t{entries[symbol]}\n" for symbol in sorted(entries))
          actual_sha = hashlib.sha256(canonical.encode()).hexdigest()
          if len(entries) != int(expected_count) or actual_sha != expected_sha:
              raise SystemExit(
                  f"ABI lock mismatch: count={len(entries)} sha={actual_sha}"
              )
          print("ABI_LOCK=PASS")
          PY

      - name: "归档旧 LKG 并生成下一代 LKG"
        id: render
        shell: bash
        env:
          CAND: ${{ steps.source.outputs.candidate_dir }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_HEAD: ${{ steps.source.outputs.source_head }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          LKG=".github/config/pandora-os4-full-parity-lkg.env"
          source "$LKG"
          OLD_GEN="$LKG_PROMOTION_GENERATION"
          OLD_RUN="$LKG_SOURCE_RUN_ID"
          HISTORY_DIR=".github/config/lkg-history"
          mkdir -p "$HISTORY_DIR"
          HISTORY="$HISTORY_DIR/pandora-os4-r62-gen-${OLD_GEN}-run-${OLD_RUN}.env"
          [[ ! -e "$HISTORY" ]] || {
            echo "::error::LKG 历史快照已存在: $HISTORY"; exit 1;
          }
          cp "$LKG" "$HISTORY"

          PROMOTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/xiaomi-os4/promote-custom-run-to-lkg.py \
            --current-lkg "$HISTORY" \
            --candidate-dir "$CAND" \
            --source-run-id "$SOURCE_RUN_ID" \
            --promotion-run-id "$GITHUB_RUN_ID" \
            --source-run-head "$SOURCE_HEAD" \
            --artifact-id "$ARTIFACT_ID" \
            --promoted-at "$PROMOTED_AT" \
            --note "$NOTE" \
            --output "$LKG"

          source "$LKG"
          [[ "$LKG_PROMOTION_GENERATION" -eq $((OLD_GEN + 1)) ]]
          [[ "$LKG_SOURCE_RUN_ID" == "$SOURCE_RUN_ID" ]]
          [[ "$LKG_PROMOTION_RUN_ID" == "$GITHUB_RUN_ID" ]]
          echo "history=$HISTORY" >> "$GITHUB_OUTPUT"
          echo "generation=$LKG_PROMOTION_GENERATION" >> "$GITHUB_OUTPUT"

      - name: "静态校验新 LKG"
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/config/pandora-os4-full-parity-lkg.env
          python3 -m py_compile scripts/xiaomi-os4/promote-custom-run-to-lkg.py
          source .github/config/pandora-os4-full-parity-lkg.env
          for v in \
            LKG_SOURCE_RUN_ID LKG_PROMOTION_RUN_ID LKG_IMAGE_SHA256 LKG_SYMVERS_SHA256 \
            LKG_FINAL_CONFIG_SHA256 LKG_IMAGE_NORMALIZED_SHA256 \
            LKG_BAKASU_COMMIT LKG_SUSFS_COMMIT LKG_NOMOUNT_COMMIT \
            LKG_DROIDSPACES_COMMIT LKG_NTSYNC_PATCH_COMMIT LKG_BBG_COMMIT \
            LKG_REKERNEL_COMMIT; do
            [[ -n "${!v:-}" ]] || { echo "::error::新 LKG 字段为空: $v"; exit 1; }
          done

      - name: "晋升前强制检查上游文件隔离"
        shell: bash
        run: |
          set -euo pipefail
          # At this point the new LKG and history exist only in the worktree.
          # A normal committed-only PR diff would silently miss these changes.
          bash scripts/xiaomi-os4/check-upstream-isolation.sh HEAD --worktree

      - name: "创建 LKG 晋升 PR 并自动合并"
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          NOTE: ${{ inputs.note }}
          GENERATION: ${{ steps.render.outputs.generation }}
          HISTORY: ${{ steps.render.outputs.history }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          BRANCH="lkg/promote-run-${SOURCE_RUN_ID}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add \
            .github/config/pandora-os4-full-parity-lkg.env \
            .github/config/lkg-history/

          # Fail closed: this automation must never commit arbitrary files.
          mapfile -t STAGED < <(git diff --cached --name-only)
          [[ "${#STAGED[@]}" -eq 2 ]] || {
            echo "::error::晋升必须只修改 LKG 当前指针和一份历史快照"
            exit 1
          }
          printf '%s\n' "${STAGED[@]}" | grep -Fxq '.github/config/pandora-os4-full-parity-lkg.env'
          printf '%s\n' "${STAGED[@]}" | grep -Fxq "$HISTORY"

          git commit -m "xiaomi(os4): promote run $SOURCE_RUN_ID to current LKG"

          # Re-check the exact committed PR diff; do not depend on a
          # secondary workflow triggered by this job's GITHUB_TOKEN.
          bash scripts/xiaomi-os4/check-upstream-isolation.sh "$BASE_SHA" --committed
          git push origin "$BRANCH"
          HEAD_SHA="$(git rev-parse HEAD)"

          PR_URL="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base dev \
            --head "$BRANCH" \
            --title "xiaomi(os4): promote run $SOURCE_RUN_ID to current LKG" \
            --body "User-confirmed real-device stable candidate. Source run: $SOURCE_RUN_ID. Promotion generation: $GENERATION. Note: $NOTE. Old LKG archived at $HISTORY. Source artifact, ABI/KMI, worktree isolation and committed isolation were checked in this promotion workflow. Auto merge is allowed only after all checks pass.")"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          PR_NUMBER="${PR_URL##*/}"
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::PR 编号异常"; exit 1; }

          PR_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg branch "$BRANCH" --arg sha "$HEAD_SHA" '
            .state == "open" and .draft == false and
            .base.ref == "dev" and .head.ref == $branch and .head.sha == $sha
          ' <<<"$PR_JSON" >/dev/null || {
            echo "::error::PR head/base 不符合本次晋升，禁止合并"
            exit 1
          }

          # Verify the server-side PR diff, not merely the local git index.
          mapfile -t PR_PATHS < <(
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[].filename'
          )
          [[ "${#PR_PATHS[@]}" -eq 2 ]] || {
            echo "::error::PR 文件数不为 2，禁止合并"
            exit 1
          }
          printf '%s\n' "${PR_PATHS[@]}" | grep -Fxq '.github/config/pandora-os4-full-parity-lkg.env'
          printf '%s\n' "${PR_PATHS[@]}" | grep -Fxq "$HISTORY"

          # The source branch must not silently change during validation.
          CURRENT_DEV="$(gh api "/repos/$GITHUB_REPOSITORY/branches/dev" --jq '.commit.sha')"
          [[ "$CURRENT_DEV" == "$BASE_SHA" ]] || {
            echo "::error::dev 在晋升期间已更新，保留 PR 但拒绝自动合并；请重新晋升"
            exit 1
          }

          # GitHub may need a moment to calculate PR mergeability.
          MERGEABLE=null
          for attempt in {1..12}; do
            PR_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            MERGEABLE="$(jq -r '.mergeable' <<<"$PR_JSON")"
            [[ "$MERGEABLE" != "null" ]] && break
            sleep 3
          done
          [[ "$MERGEABLE" == "true" ]] || {
            echo "::error::PR 存在合并冲突或合并状态未就绪，禁止自动合并"
            exit 1
          }

          # GitHub enforces branch protection. Never bypass rules/checks.
          MERGE_JSON="$(gh api --method PUT \
            "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA" \
            -f commit_title="xiaomi(os4): promote run $SOURCE_RUN_ID to LKG generation $GENERATION")"
          jq -e '.merged == true and (.sha | length) == 40' <<<"$MERGE_JSON" >/dev/null || {
            echo "::error::GitHub 未确认合并成功"
            exit 1
          }
          MERGE_SHA="$(jq -r '.sha' <<<"$MERGE_JSON")"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "XIAOMI_LKG_PROMOTION=AUTO_MERGED"
          echo "LKG_MERGE_SHA=$MERGE_SHA"

          # Cleanup occurs only after GitHub has confirmed a successful merge.
          if ! gh api --method DELETE \
            "/repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" >/dev/null; then
            echo "::warning::LKG 已成功合并，但临时分支未自动删除：$BRANCH"
          fi

      - name: "摘要"
        shell: bash
        run: |
          {
            echo "## 当前 LKG 自动晋升成功"
            echo
            echo "- 来源 Run ID: ${{ inputs.source_run_id }}"
            echo "- 新 LKG 代次: ${{ steps.render.outputs.generation }}"
            echo "- 旧 LKG 归档: ${{ steps.render.outputs.history }}"
            echo "- 已合并 PR: ${{ steps.pr.outputs.url }}"
            echo "- dev 合并提交: ${{ steps.pr.outputs.merge_sha }}"
            echo "- 晋升 Workflow Run: $GITHUB_RUN_ID"
            echo "- 下一阶段：本晋升运行成功结束后自动触发同一代 LKG 精确复现；复现通过后自动发布 Gen ${{ steps.render.outputs.generation }} Release。"
            echo "- 无需再手动执行「当前 LKG 复现与打包」或 Release 归档工作流。"
            echo
            echo "来源产物、ABI/KMI、工作区及提交后的上游隔离检查均已通过，GitHub 已确认合并。无需人工再次合并。"
          } >> "$GITHUB_STEP_SUMMARY"
