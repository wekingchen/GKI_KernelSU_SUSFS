name: "Pandora OS4 SUSFS pinned-source diagnostic (temporary)"
on:
  push:
    branches: [fix/pandora-os4-susfs-unused-20261111]
    paths: [.github/workflows/pandora-os4-susfs-diagnostic-once.yml]
permissions:
  contents: read
jobs:
  susfs-diff:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Inspect pinned old and new SUSFS credentials helpers, without changing source"
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          git clone -q --depth 100 --single-branch --branch gki-android16-6.12 https://gitlab.com/simonpunk/susfs4ksu.git susfs
          cd susfs
          for sha in 15890c612d4a2ff37557a0aafe4189451859771b 395a8c0c88d348e9fe7c14f66a456fde4653287c; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then git fetch -q origin "$sha"; fi
            test "$(git rev-parse "$sha^{commit}")" = "$sha"
            git show "$sha:kernel_patches/fs/susfs.c" > "$RUNNER_TEMP/susfs-$sha.c"
          done
          python3 - <<'PY'
          from pathlib import Path
          old=Path('/home/runner/work/_temp/nonexisting')
          names=['susfs_switch_to_ksu_domain','susfs_restore_creds']
          import os
          base=Path(os.environ['RUNNER_TEMP'])
          for path in sorted(base.glob('susfs-*.c')):
              lines=path.read_text().splitlines()
              print('=== PINNED SRC',path.name,'lines',len(lines))
              for name in names:
                  hits=[i for i,line in enumerate(lines) if name in line]
                  print('SYMBOL',name,'OCCURRENCES',len(hits),'LINES',','.join(str(i+1) for i in hits))
                  for i in hits:
                      print('-----',name,'line',i+1)
                      for j in range(max(0,i-12),min(len(lines),i+25)):
                          print('%4d %s'%(j+1,lines[j]))
              print('FUNCTION-GUARDS at first 300 lines:')
              for i,line in enumerate(lines[:310]):
                  if line.lstrip().startswith(('#if','#else','#endif','#include')):print('%4d %s'%(i+1,line))
          PY
