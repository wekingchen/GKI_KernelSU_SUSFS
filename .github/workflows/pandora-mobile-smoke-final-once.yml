name: "一次性 / 手机 OTA Draft 附件负向接入验证（自动清理）"
on:
  push:
    branches: [dev]
    paths: [".github/workflows/pandora-mobile-smoke-final-once.yml"]
permissions:
  contents: write
  actions: read
jobs:
  smoke:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: "REST 创建 Draft、上传故意无效 ZIP、dispatch、检查旧输入不变、清理"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          R="$GITHUB_REPOSITORY"
          SELF=".github/workflows/pandora-mobile-smoke-final-once.yml"
          TAG="pandora-ota-capture-smoke-$GITHUB_RUN_ID"
          SRC="$RUNNER_TEMP/pandora-os4-capture-20261101-034500-000.zip"
          RID=""
          BEFORE="$(gh api "repos/$R/releases/tags/pandora-os4-stock-input" | jq -r '.assets[] | select(.name | endswith("xm.zip")) | .id')"
          START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cleanup() {
            if [[ "$RID" =~ ^[0-9]+$ ]]; then gh api -X DELETE "repos/$R/releases/$RID" >/dev/null 2>&1 || true; fi
            SHA="$(gh api "repos/$R/contents/$SELF?ref=dev" --jq .sha 2>/dev/null || true)"
            if [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]; then
              gh api -X DELETE "repos/$R/contents/$SELF" -f message="chore: self-prune mobile OTA smoke" -f sha="$SHA" -f branch=dev >/dev/null || true
            fi
          }
          trap cleanup EXIT
          python3 - "$SRC" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1],"w") as z:
              z.writestr("manifest.txt","schema=INTENTIONALLY_INVALID\ndevice=pandora\n")
          PY
          RELEASE="$(gh api -X POST "repos/$R/releases" -f tag_name="$TAG" -f target_commitish=dev -f name="TEMP mobile OTA negative smoke" -F draft=true -F prerelease=true)"
          RID="$(jq -r .id <<< "$RELEASE")"
          UPLOAD_URL="$(jq -r '.upload_url | split("{")[0]' <<< "$RELEASE")"
          curl -fsSL --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Content-Type: application/zip" --header "Accept: application/vnd.github+json" --data-binary "@$SRC" "$UPLOAD_URL?name=$(basename "$SRC")" > "$RUNNER_TEMP/mobile-asset.json"
          AID="$(jq -r .id "$RUNNER_TEMP/mobile-asset.json")"
          SHA256="$(sha256sum "$SRC" | cut -d" " -f1)"
          BYTES="$(stat -c %s "$SRC")"
          python3 - "$RUNNER_TEMP/mobile-dispatch.json" "$RID" "$AID" "$SHA256" "$BYTES" <<'PY'
          import json,sys
          target,rid,aid,sha,length=sys.argv[1:]
          with open(target,"w") as f:
              json.dump({"event_type":"pandora_ota_upload_v1","client_payload":{"schema":"pandora-ota-capture-v1","release_id":int(rid),"asset_id":int(aid),"sha256":sha,"bytes":int(length)}},f)
          PY
          gh api -X POST "repos/$R/dispatches" --input "$RUNNER_TEMP/mobile-dispatch.json"
          echo "已发送故意不完整的 ZIP；接入工作流必须拒绝。" >> "$GITHUB_STEP_SUMMARY"
          sleep 40
          AFTER="$(gh api "repos/$R/releases/tags/pandora-os4-stock-input" | jq -r '.assets[] | select(.name | endswith("xm.zip")) | .id')"
          [[ "$BEFORE" == "$AFTER" ]] || { echo "::error::负向测试错误地修改了固定 OTA 输入"; exit 3; }
          COUNT="$(gh api "repos/$R/actions/runs?event=repository_dispatch&per_page=25" | jq -r --arg since "$START" '[.workflow_runs[] | select(.name == "小米17 Pro OS4 / 手机 OTA 安全接收入库" and .created_at >= $since)] | length')"
          [[ "$COUNT" -ge 1 ]] || { echo "::error::没有观察到 repository_dispatch 运行"; exit 4; }
          echo "PASS：dispatch 已到达，故意无效的包已拒绝，固定 xm.zip Asset ID=$AFTER 未改变" >> "$GITHUB_STEP_SUMMARY"
