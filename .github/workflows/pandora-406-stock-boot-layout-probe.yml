name: "临时诊断 / pandora 4.0.6 stock boot AVB 布局"
on:
  push:
    branches:
      - experiment/pandora-406-rust-binder-blacklist-testboot
    paths:
      - .github/workflows/pandora-406-stock-boot-layout-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: "下载 SHA 锁定 stock 并只读解析 boot-v4/AVB 边界"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stock"
          gh release download pandora-os4-stock-input --repo "$GITHUB_REPOSITORY" --pattern "*xm.zip" --dir "$RUNNER_TEMP/stock"
          ZIP="$(find "$RUNNER_TEMP/stock" -maxdepth 1 -name "*xm.zip" -type f -print -quit)"
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "bebb8754c16dd30c724fdba3687694e615e03342d6f5f55918cd06f1dca8cbb8"
          python3 scripts/xiaomi-os4/inspect-pandora-stock-boot-layout.py \
            --stock-zip "$ZIP" --output "$RUNNER_TEMP/stock-boot-layout.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: pandora-406-stock-boot-layout-readonly
          path: ${{ runner.temp }}/stock-boot-layout.txt
          retention-days: 30
