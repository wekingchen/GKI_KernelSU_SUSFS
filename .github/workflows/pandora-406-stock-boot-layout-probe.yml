name: "临时诊断 / pandora 4.0.6 stock boot AVB 布局"
# rerun after full-partition fastboot-boot capacity rule
on:
  push:
    branches:
      - experiment/pandora-406-rust-binder-blacklist-testboot
    paths:
      - .github/workflows/pandora-406-stock-boot-layout-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: "下载 SHA 锁定 stock 并只读解析 boot-v4/AVB 边界"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stock"
          gh release download pandora-os4-stock-input --repo "$GITHUB_REPOSITORY" --pattern "*xm.zip" --dir "$RUNNER_TEMP/stock"
          ZIP="$(find "$RUNNER_TEMP/stock" -maxdepth 1 -name "*xm.zip" -type f -print -quit)"
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "bebb8754c16dd30c724fdba3687694e615e03342d6f5f55918cd06f1dca8cbb8"
          echo "STOCK_ZIP=$ZIP" >> "$GITHUB_ENV"
          python3 scripts/xiaomi-os4/inspect-pandora-stock-boot-layout.py --stock-zip "$ZIP" --output "$RUNNER_TEMP/stock-boot-layout.txt"
          unzip -p "$ZIP" boot.img > "$RUNNER_TEMP/boot.img"
          curl -fsSL "https://android.googlesource.com/platform/external/avb/+/refs/tags/android-cts-17.0_r1/avbtool.py?format=TEXT" | base64 -d > "$RUNNER_TEMP/avbtool.py"
          python3 "$RUNNER_TEMP/avbtool.py" info_image --image "$RUNNER_TEMP/boot.img" > "$RUNNER_TEMP/outer-avb-info.txt"
          python3 -c 'import struct,sys; b=open(sys.argv[1],"rb").read(); ks=struct.unpack_from("<I",b,8)[0]; p=4096; s=p+((ks+p-1)//p)*p; orig=struct.unpack(">4sIIQQQ28x",b[-64:])[3]; assert b[s:s+4]==b"AVB0"; open(sys.argv[2],"wb").write(b[s:orig])' "$RUNNER_TEMP/boot.img" "$RUNNER_TEMP/inner-avb.bin"
          python3 "$RUNNER_TEMP/avbtool.py" info_image --image "$RUNNER_TEMP/inner-avb.bin" > "$RUNNER_TEMP/inner-avb-info.txt"
          echo "inner_avb_parse=success" >> "$RUNNER_TEMP/stock-boot-layout.txt"
      - name: "官方 r74 Image 只验证真实 stock 打包布局；输出镜像随即删除"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          gh release download pandora-os4-ota-candidate-OS4.0.6.0.XBLCNXM --repo "$GITHUB_REPOSITORY" --pattern "Image" --pattern "build-metadata.txt" --pattern "stock-report.json" --dir "$RUNNER_TEMP/candidate"
          python3 scripts/xiaomi-os4/probe-pandora-406-real-stock-packager.py \
            --stock-zip "$STOCK_ZIP" \
            --stock-report "$RUNNER_TEMP/candidate/stock-report.json" \
            --candidate-image "$RUNNER_TEMP/candidate/Image" \
            --build-metadata "$RUNNER_TEMP/candidate/build-metadata.txt" \
            --output "$RUNNER_TEMP/real-stock-packager.txt"
          grep -q "^REAL_STOCK_LOGICAL_PACKAGING=PASS$" "$RUNNER_TEMP/real-stock-packager.txt"
          grep -q "^DELIVERABLE_BOOT=NO$" "$RUNNER_TEMP/real-stock-packager.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: pandora-406-stock-boot-layout-readonly
          path: |
            ${{ runner.temp }}/stock-boot-layout.txt
            ${{ runner.temp }}/outer-avb-info.txt
            ${{ runner.temp }}/inner-avb-info.txt
            ${{ runner.temp }}/real-stock-packager.txt
          retention-days: 30
