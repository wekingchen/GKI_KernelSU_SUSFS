name: "OS4 BakaSU main same-source validation"

on:
  push:
    branches:
      - os4-track-bakasu-main-20261031
    paths:
      - ".github/workflows/os4-bakasu-main-validation.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: "检出候选代码"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "静态检查"
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/xiaomi-os4/build-r62-features.sh
          bash -n scripts/xiaomi-os4/fetch-compatible-bakasu-manager.sh
          grep -Fq 'resolve-bakasu:' .github/workflows/xiaomi-sm8850-os4-custom.yml
          grep -Fq 'XIAOMI_OS4_BAKASU_COMMIT: ${{ needs.resolve-bakasu.outputs.sha }}' .github/workflows/xiaomi-sm8850-os4-custom.yml
          grep -Fq '"${{ needs.resolve-bakasu.outputs.sha }}"' .github/workflows/xiaomi-sm8850-os4-custom.yml
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0])' .github/workflows/xiaomi-sm8850-os4-custom.yml

      - name: "锁定并检查 BakaSU main"
        id: bakasu
        shell: bash
        run: |
          set -euo pipefail
          source .github/config/xiaomi-sm8850-os4-6.12.69.env
          git clone -q "$OS4_BAKASU_REPO" "$RUNNER_TEMP/BakaSU"
          LATEST_SHA="$(git -C "$RUNNER_TEMP/BakaSU" rev-parse "origin/$OS4_BAKASU_REF")"
          LATEST_TREE="$(git -C "$RUNNER_TEMP/BakaSU" rev-parse "$LATEST_SHA:kernel")"
          VALIDATED_TREE="$(git -C "$RUNNER_TEMP/BakaSU" rev-parse "$OS4_BAKASU_COMMIT:kernel")"
          echo "sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          echo "LATEST_SHA=$LATEST_SHA"
          echo "VALIDATED_REFERENCE=$OS4_BAKASU_COMMIT"
          echo "LATEST_KERNEL_TREE=$LATEST_TREE"
          echo "VALIDATED_KERNEL_TREE=$VALIDATED_TREE"
          if [[ "$LATEST_TREE" == "$VALIDATED_TREE" ]]; then
            echo "BAKASU_KERNEL_TREE_EQUIVALENT=1"
          else
            echo "BAKASU_KERNEL_TREE_EQUIVALENT=0"
          fi

      - name: "获取完全同提交的官方 BakaSU Manager"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="${{ steps.bakasu.outputs.sha }}"
          OUT="$RUNNER_TEMP/manager"
          bash scripts/xiaomi-os4/fetch-compatible-bakasu-manager.sh "$OUT" "$TARGET"
          grep -qx "BAKASU_TARGET_COMMIT=$TARGET" "$OUT/manager-metadata.txt"
          grep -qx "MANAGER_HEAD_SHA=$TARGET" "$OUT/manager-metadata.txt"
          KERNEL_VERSION="$(sed -n 's/^BAKASU_KERNEL_KSU_VERSION=//p' "$OUT/manager-metadata.txt")"
          MANAGER_VERSION="$(sed -n 's/^MANAGER_KSU_VERSION=//p' "$OUT/manager-metadata.txt")"
          [[ -n "$KERNEL_VERSION" && "$KERNEL_VERSION" == "$MANAGER_VERSION" ]]
          find "$OUT" -maxdepth 1 -type f -name '*-arm64-v8a-release.apk' -print -quit | grep -q .

      - name: "上传同源验证结果"
        uses: actions/upload-artifact@v6
        with:
          name: os4-bakasu-main-same-source-validation
          path: |
            ${{ runner.temp }}/manager/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
