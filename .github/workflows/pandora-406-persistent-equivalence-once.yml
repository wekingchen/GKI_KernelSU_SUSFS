name: "pandora OS4.0.6 persistent boot equivalence (one-off)"

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/pandora-406-persistent-equivalence-once.yml"
      - "scripts/xiaomi-os4/build-pandora-406-persistent-equivalent-boot.py"
      - "scripts/xiaomi-os4/test_pandora_406_persistent_equivalent_boot.py"
      - ".github/config/ota-verified/OS4.0.6.0.XBLCNXM/runtime-selected-oem-gate.json"
      - ".github/config/ota-verified/OS4.0.6.0.XBLCNXM/compatibility-fixture.json"

permissions:
  contents: read
  actions: read

jobs:
  byte-exact:
    name: "原厂 stock -> AnyKernel3 目标语义 -> #37 已测试 boot 字节一致"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: "脚本与 cmdline 单测"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/xiaomi-os4/build-pandora-406-persistent-equivalent-boot.py \
            scripts/xiaomi-os4/test_pandora_406_persistent_equivalent_boot.py
          python3 scripts/xiaomi-os4/test_pandora_406_persistent_equivalent_boot.py -v

      - name: "下载固定 stock 与标准工作流 #37 Artifact"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stock" "$RUNNER_TEMP/feature"
          gh release download pandora-os4-stock-input \
            --repo "$GITHUB_REPOSITORY" --pattern '*xm.zip' --dir "$RUNNER_TEMP/stock"
          gh run download 45047763911 --repo "$GITHUB_REPOSITORY" \
            --name pandora-OTA-COMPAT-NONFLASH-OS4.0.6.0.XBLCNXM-run-45047763911 \
            --dir "$RUNNER_TEMP/feature"
          mapfile -t STOCKS < <(find "$RUNNER_TEMP/stock" -maxdepth 1 -type f -name '*xm.zip' -print)
          mapfile -t TESTED_BOOTS < <(find "$RUNNER_TEMP/feature" -maxdepth 1 -type f -name '*FASTBOOT-BOOT-ONLY.img' -print)
          [[ "${#STOCKS[@]}" -eq 1 ]]
          [[ "${#TESTED_BOOTS[@]}" -eq 1 ]]
          [[ "$(sha256sum "${STOCKS[0]}" | awk '{print $1}')" == "bebb8754c16dd30c724fdba3687694e615e03342d6f5f55918cd06f1dca8cbb8" ]]
          [[ "$(sha256sum "$RUNNER_TEMP/feature/Image" | awk '{print $1}')" == "3daba0524738ab872ebf75653f25754433c36a624eb8002198440a4cb1cb1dc0" ]]
          [[ "$(sha256sum "${TESTED_BOOTS[0]}" | awk '{print $1}')" == "230a16fa271c3ccbaa14309adbd2905ae04430032a9f7b9d0853478aa7751d27" ]]
          echo "STOCK_ZIP=${STOCKS[0]}" >> "$GITHUB_ENV"
          echo "TESTED_BOOT=${TESTED_BOOTS[0]}" >> "$GITHUB_ENV"

      - name: "审计原厂 boot v4 尾部结构"
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$STOCK_ZIP" <<'PY' | tee "$RUNNER_TEMP/stock-boot-layout.txt"
          import hashlib, struct, sys, zipfile
          from pathlib import Path
          zpath = Path(sys.argv[1])
          with zipfile.ZipFile(zpath) as z:
              matches = [i for i in z.infolist()
                         if not i.is_dir() and i.filename.rsplit("/",1)[-1].startswith("boot")
                         and i.filename.rsplit("/",1)[-1].endswith(".img")]
              assert len(matches) == 1, [x.filename for x in matches]
              b = z.read(matches[0])
          page=4096
          ks=struct.unpack_from("<I",b,8)[0]
          rs=struct.unpack_from("<I",b,12)[0]
          hv=struct.unpack_from("<I",b,40)[0]
          hs=struct.unpack_from("<I",b,20)[0]
          ss=struct.unpack_from("<I",b,1580)[0]
          align=lambda n:(n+page-1)//page*page
          payload_end=page+align(ks)+align(rs)+align(ss)
          tail=b[payload_end:]
          print("stock_size",len(b))
          print("kernel_size",ks)
          print("ramdisk_size",rs)
          print("signature_size",ss)
          print("header_version",hv)
          print("header_size",hs)
          print("payload_end",payload_end)
          print("tail_size",len(tail))
          print("tail_sha256",hashlib.sha256(tail).hexdigest())
          print("tail_nonzero_bytes",sum(x!=0 for x in tail))
          print("last64_hex",b[-64:].hex())
          print("last64_magic",repr(b[-64:-60]))
          if b[-64:-60] == b"AVBf":
              magic, maj, minor, original_size, vbmeta_offset, vbmeta_size = struct.unpack_from(">4sIIQQQ", b, len(b)-64)
              print("avb_footer",magic,maj,minor,original_size,vbmeta_offset,vbmeta_size)
          PY

      - name: "从原厂 boot 重建持久安装目标语义"
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/persistent-equivalent.img"
          python3 scripts/xiaomi-os4/build-pandora-406-persistent-equivalent-boot.py \
            --stock-zip "$STOCK_ZIP" \
            --compat-fixture .github/config/ota-verified/OS4.0.6.0.XBLCNXM/compatibility-fixture.json \
            --runtime-gate .github/config/ota-verified/OS4.0.6.0.XBLCNXM/runtime-selected-oem-gate.json \
            --feature-metadata "$RUNNER_TEMP/feature/build-metadata.txt" \
            --image "$RUNNER_TEMP/feature/Image" \
            --output "$OUT" \
            --expected-output-sha256 230a16fa271c3ccbaa14309adbd2905ae04430032a9f7b9d0853478aa7751d27 \
            | tee "$RUNNER_TEMP/persistent-equivalence.txt"

          cmp -s "$OUT" "$TESTED_BOOT"
          echo "BYTE_EXACT_TO_TRUE_DEVICE_TESTED_RUN37_BOOT=PASS" | tee -a "$RUNNER_TEMP/persistent-equivalence.txt"
          stat -c 'PERSISTENT_EQUIVALENT_SIZE=%s' "$OUT" | tee -a "$RUNNER_TEMP/persistent-equivalence.txt"
          sha256sum "$OUT" | tee -a "$RUNNER_TEMP/persistent-equivalence.txt"

      - name: "用固定 AnyKernel3 magiskboot 实际重打包原厂 boot"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user-static file

          AK3="$RUNNER_TEMP/AnyKernel3"
          git clone -q --filter=blob:none --no-checkout https://github.com/osm0sis/AnyKernel3.git "$AK3"
          git -C "$AK3" fetch -q --depth=1 origin dca9dc370838d919d56c1f59ec78b27a14a72c68
          git -C "$AK3" checkout -q --detach dca9dc370838d919d56c1f59ec78b27a14a72c68
          [[ "$(git -C "$AK3" rev-parse HEAD)" == "dca9dc370838d919d56c1f59ec78b27a14a72c68" ]]

          python3 - "$STOCK_ZIP" "$RUNNER_TEMP/stock-boot.img" <<'PY'
          import sys, zipfile
          from pathlib import Path
          src, out = map(Path, sys.argv[1:])
          with zipfile.ZipFile(src) as z:
              m=[i for i in z.infolist() if not i.is_dir() and i.filename.rsplit("/",1)[-1]=="boot.img"]
              assert len(m)==1
              out.write_bytes(z.read(m[0]))
          PY

          MB="$AK3/tools/magiskboot"
          chmod +x "$MB"
          file "$MB" | tee "$RUNNER_TEMP/magiskboot-file.txt"

          RUN_MB=("$MB")
          if file "$MB" | grep -qiE 'ARM aarch64|ARM64|aarch64'; then
            RUN_MB=(qemu-aarch64-static "$MB")
          fi

          WORK="$RUNNER_TEMP/magiskboot-work"
          mkdir -p "$WORK"
          cp "$RUNNER_TEMP/stock-boot.img" "$WORK/boot.img"
          cd "$WORK"

          set +e
          "${RUN_MB[@]}" unpack -h boot.img >"$RUNNER_TEMP/magiskboot-unpack.stdout" 2>"$RUNNER_TEMP/magiskboot-unpack.stderr"
          URC=$?
          set -e
          echo "MAGISKBOOT_UNPACK_RC=$URC" | tee "$RUNNER_TEMP/magiskboot-repack-audit.txt"
          cat "$RUNNER_TEMP/magiskboot-unpack.stderr" >> "$RUNNER_TEMP/magiskboot-repack-audit.txt" || true
          [[ "$URC" -eq 0 ]]

          find . -maxdepth 2 -type f -printf '%P %s\n' | sort | tee -a "$RUNNER_TEMP/magiskboot-repack-audit.txt"

          # AnyKernel3 flash_boot copies the packaged Image over the unpacked
          # kernel, then patch_cmdline modifies cmdline.txt or header.
          cp "$RUNNER_TEMP/feature/Image" kernel

          python3 - <<'PY'
          from pathlib import Path
          want="module_blacklist=kernelsu pandora_rust_binder_eexist=1"
          cmd=Path("cmdline.txt")
          hdr=Path("header")
          if cmd.exists():
              original=cmd.read_text(errors="strict").strip()
              tokens=original.split()
              bl=[x for x in tokens if x.startswith("module_blacklist=")]
              assert len(bl)<=1
              if bl:
                  vals=[x for x in bl[0].split("=",1)[1].split(",") if x]
                  if "kernelsu" not in vals:
                      new=bl[0]+("," if vals else "")+"kernelsu"
                      tokens=[new if x==bl[0] else x for x in tokens]
              else:
                  tokens.append("module_blacklist=kernelsu")
              ex=[x for x in tokens if x.startswith("pandora_rust_binder_eexist=")]
              assert len(ex)<=1
              if ex:
                  assert ex[0]=="pandora_rust_binder_eexist=1"
              else:
                  tokens.append("pandora_rust_binder_eexist=1")
              cmd.write_text(" ".join(tokens)+"\n")
          else:
              lines=hdr.read_text().splitlines()
              indexes=[i for i,x in enumerate(lines) if x.startswith("cmdline=")]
              assert len(indexes)==1
              original=lines[indexes[0]].split("=",1)[1]
              tokens=original.split()
              bl=[x for x in tokens if x.startswith("module_blacklist=")]
              assert len(bl)<=1
              if bl:
                  vals=[x for x in bl[0].split("=",1)[1].split(",") if x]
                  if "kernelsu" not in vals:
                      new=bl[0]+("," if vals else "")+"kernelsu"
                      tokens=[new if x==bl[0] else x for x in tokens]
              else:
                  tokens.append("module_blacklist=kernelsu")
              ex=[x for x in tokens if x.startswith("pandora_rust_binder_eexist=")]
              assert len(ex)<=1
              if ex:
                  assert ex[0]=="pandora_rust_binder_eexist=1"
              else:
                  tokens.append("pandora_rust_binder_eexist=1")
              lines[indexes[0]]="cmdline="+" ".join(tokens)
              hdr.write_text("\n".join(lines)+"\n")
          PY

          export PATCHVBMETAFLAG=false
          set +e
          "${RUN_MB[@]}" repack boot.img boot-new.img >"$RUNNER_TEMP/magiskboot-repack.stdout" 2>"$RUNNER_TEMP/magiskboot-repack.stderr"
          RRC=$?
          set -e
          echo "MAGISKBOOT_REPACK_RC=$RRC" | tee -a "$RUNNER_TEMP/magiskboot-repack-audit.txt"
          cat "$RUNNER_TEMP/magiskboot-repack.stderr" >> "$RUNNER_TEMP/magiskboot-repack-audit.txt" || true
          [[ "$RRC" -eq 0 ]]
          [[ -s boot-new.img ]]
          [[ "$(stat -c %s boot-new.img)" -le 100663296 ]]

          # Re-unpack the result with the same pinned magiskboot and attest the
          # embedded Image plus cmdline actually stored in the repacked boot.
          mkdir verify
          cp boot-new.img verify/boot.img
          cd verify
          "${RUN_MB[@]}" unpack -h boot.img >"$RUNNER_TEMP/magiskboot-verify.stdout" 2>"$RUNNER_TEMP/magiskboot-verify.stderr"
          [[ "$(sha256sum kernel | awk '{print $1}')" == "3daba0524738ab872ebf75653f25754433c36a624eb8002198440a4cb1cb1dc0" ]]

          python3 - <<'PY'
          from pathlib import Path
          if Path("cmdline.txt").exists():
              cmd=Path("cmdline.txt").read_text().strip()
          else:
              vals=[x.split("=",1)[1] for x in Path("header").read_text().splitlines() if x.startswith("cmdline=")]
              assert len(vals)==1
              cmd=vals[0]
          toks=cmd.split()
          assert "pandora_rust_binder_eexist=1" in toks, cmd
          bl=[x for x in toks if x.startswith("module_blacklist=")]
          assert len(bl)==1 and "kernelsu" in bl[0].split("=",1)[1].split(","), cmd
          print("REPACKED_CMDLINE="+cmd)
          PY

          cd "$WORK"
          python3 - boot-new.img <<'PY' | tee -a "$RUNNER_TEMP/magiskboot-repack-audit.txt"
          import hashlib,struct,sys
          from pathlib import Path
          b=Path(sys.argv[1]).read_bytes()
          print("ANYKERNEL_REPACK_SIZE="+str(len(b)))
          print("ANYKERNEL_REPACK_SHA256="+hashlib.sha256(b).hexdigest())
          print("PARTITION_CAPACITY=100663296")
          print("PARTITION_MARGIN="+str(100663296-len(b)))
          print("LAST64_MAGIC="+repr(b[-64:-60]))
          if len(b)>=64 and b[-64:-60]==b"AVBf":
              magic,maj,minr,orig,off,size=struct.unpack_from(">4sIIQQQ",b,len(b)-64)
              print("REPACK_AVB_FOOTER=VALID_MAGIC")
              print("REPACK_AVB_VERSION=%d.%d"%(maj,minr))
              print("REPACK_AVB_ORIGINAL_IMAGE_SIZE="+str(orig))
              print("REPACK_AVB_VBMETA_OFFSET="+str(off))
              print("REPACK_AVB_VBMETA_SIZE="+str(size))
          else:
              print("REPACK_AVB_FOOTER=ABSENT")
          PY
          echo "PINNED_ANYKERNEL3_REPACK_AUDIT=PASS" | tee -a "$RUNNER_TEMP/magiskboot-repack-audit.txt"

      - name: "上传等价证明"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pandora-406-persistent-boot-equivalence
          path: |
            ${{ runner.temp }}/persistent-equivalence.txt
            ${{ runner.temp }}/stock-boot-layout.txt
            ${{ runner.temp }}/magiskboot-file.txt
            ${{ runner.temp }}/magiskboot-unpack.stdout
            ${{ runner.temp }}/magiskboot-unpack.stderr
            ${{ runner.temp }}/magiskboot-repack.stdout
            ${{ runner.temp }}/magiskboot-repack.stderr
            ${{ runner.temp }}/magiskboot-verify.stdout
            ${{ runner.temp }}/magiskboot-verify.stderr
            ${{ runner.temp }}/magiskboot-repack-audit.txt
          if-no-files-found: error
          retention-days: 30
