name: "小米内核 / 上游文件隔离门禁"

on:
  workflow_dispatch:
  push:
    branches:
      - "os4-*"
      - "xiaomi-*"
      - "pandora-*"
  pull_request:
    branches:
      - dev
    # LKG-only PRs are verified by the promotion workflow itself.
    # Development PRs touching other files still run this independent guard.
    paths-ignore:
      - ".github/config/pandora-os4-full-parity-lkg.env"
      - ".github/config/lkg-history/**"

permissions:
  contents: read

jobs:
  isolation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref || github.ref_name, 'os4-') ||
      startsWith(github.head_ref || github.ref_name, 'xiaomi-') ||
      startsWith(github.head_ref || github.ref_name, 'pandora-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "获取 fork dev"
        shell: bash
        run: git fetch -q --no-tags origin dev:refs/remotes/origin/dev

      - name: "确认 Xiaomi 改动不覆盖上游共用文件"
        shell: bash
        run: bash scripts/xiaomi-os4/check-upstream-isolation.sh origin/dev

  audit-retired-xiaomi-workflow-menu:
    name: "只读检查过期小米工作流及运行记录"
    needs: isolation
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS' && github.ref == 'refs/heads/xiaomi-os4-prune-obsolete-workflows-20261101' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - name: "列出旧实验工作流准确 ID、路径、状态与运行次数"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.name | contains("小米")) | [.id,.name,.path,.state] | @tsv' |
            while IFS=$'\t' read -r id name path state; do
              runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$id/runs?per_page=1" --jq '.total_count')"
              printf '%s\t%s\t%s\t%s\t%s\n' "$id" "$name" "$path" "$state" "$runs"
            done
