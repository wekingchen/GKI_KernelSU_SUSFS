name: "小米内核 / 上游文件隔离门禁"

on:
  workflow_dispatch:
  push:
    branches:
      - "os4-*"
      - "xiaomi-*"
      - "pandora-*"
      - "audit/os4-*"
  pull_request:
    branches:
      - dev
    # LKG-only PRs are verified by the promotion workflow itself.
    # Development PRs touching other files still run this independent guard.
    paths-ignore:
      - ".github/config/pandora-os4-full-parity-lkg.env"
      - ".github/config/lkg-history/**"

permissions:
  contents: read

jobs:
  isolation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref || github.ref_name, 'os4-') ||
      startsWith(github.head_ref || github.ref_name, 'xiaomi-') ||
      startsWith(github.head_ref || github.ref_name, 'pandora-') ||
      startsWith(github.head_ref || github.ref_name, 'audit/os4-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "获取 fork dev"
        shell: bash
        run: git fetch -q --no-tags origin dev:refs/remotes/origin/dev

      - name: "确认 Xiaomi 改动不覆盖上游共用文件"
        shell: bash
        run: bash scripts/xiaomi-os4/check-upstream-isolation.sh origin/dev

      - name: "OTA 真机反馈与 fixture 字节级复现单测"
        if: hashFiles('scripts/xiaomi-os4/test_ota_baseline_feedback.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/xiaomi-os4/finalize-ota-baseline.py scripts/xiaomi-os4/repack-fastboot-boot-v4-from-fixture.py
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_ota_baseline_feedback.py' -v
          python3 -m py_compile scripts/xiaomi-os4/ota-development-pointer.py \
            scripts/xiaomi-os4/check-ota-feature-abi.py
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_ota_development_switch.py' -v
          python3 -m py_compile scripts/xiaomi-os4/check-ota-anykernel-evidence.py
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_ota_anykernel_evidence.py' -v
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_os4_stock_collector_integrity.py' -v
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_os4_workflow_contracts.py' -v
          bash -n scripts/xiaomi-os4/package-validated-anykernel3.sh
          bash -n scripts/xiaomi-os4/build-r62-features.sh
          bash -n scripts/xiaomi-os4/apply-os3-parity-extras.sh
          bash -n scripts/xiaomi-os4/apply-os4-selected-extras.sh
