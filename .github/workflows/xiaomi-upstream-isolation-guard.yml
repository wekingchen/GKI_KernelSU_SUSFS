name: "小米内核 / 上游文件隔离门禁"

on:
  workflow_dispatch:
  push:
    branches:
      - "os4-*"
      - "xiaomi-*"
      - "pandora-*"
  pull_request:
    branches:
      - dev
    # LKG-only PRs are verified by the promotion workflow itself.
    # Development PRs touching other files still run this independent guard.
    paths-ignore:
      - ".github/config/pandora-os4-full-parity-lkg.env"
      - ".github/config/lkg-history/**"

permissions:
  contents: read

jobs:
  isolation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref || github.ref_name, 'os4-') ||
      startsWith(github.head_ref || github.ref_name, 'xiaomi-') ||
      startsWith(github.head_ref || github.ref_name, 'pandora-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "获取 fork dev"
        shell: bash
        run: git fetch -q --no-tags origin dev:refs/remotes/origin/dev

      - name: "确认 Xiaomi 改动不覆盖上游共用文件"
        shell: bash
        run: bash scripts/xiaomi-os4/check-upstream-isolation.sh origin/dev

  ota-oem-abi-static-tests:
    name: "新 OTA OEM module CRC / boot-v4 门禁模拟测试（无真机，无刷机）"
    needs: isolation
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS' && github.ref == 'refs/heads/os4-ota-abi-gated-testboot-20261101' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: "Python / Bash / YAML 语法及模拟 Android OEM 模块正反门禁"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-yaml zstd
          python3 -m py_compile \
            scripts/xiaomi-os4/check-ota-oem-abi.py \
            scripts/xiaomi-os4/package-ota-testboot-v4.py \
            scripts/xiaomi-os4/test-ota-abi-testboot.py
          bash -n scripts/xiaomi-os4/build-ota-gki-baseline-candidate.sh
          python3 scripts/xiaomi-os4/test-ota-abi-testboot.py -v
          python3 - <<'PY'
          import pathlib,yaml
          f=pathlib.Path('.github/workflows/xiaomi-sm8850-os4-ota-auto-candidate.yml')
          y=yaml.safe_load(f.read_text())
          jobs=y['jobs']
          assert 'oem-abi-and-testboot' in jobs and 'baseline' in jobs
          assert jobs['oem-abi-and-testboot']['needs']==['inspect','baseline']
          s=str(jobs['oem-abi-and-testboot'])
          assert "steps.abi.outputs.eligible == 'true'" in s
          assert 'package-ota-testboot-v4.py' in s
          assert 'check-ota-oem-abi.py' in s
          assert 'fastboot flash' not in s
          assert 'fastboot boot' in s
          assert y['concurrency']['cancel-in-progress'] is False
          print('OTA_ABI_AND_TESTBOOT_WORKFLOW_STATIC=PASS')
          PY
