name: "小米内核 / 上游文件隔离门禁"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  isolation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'os4-') ||
      startsWith(github.head_ref, 'xiaomi-') ||
      startsWith(github.head_ref, 'pandora-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "获取 fork dev"
        shell: bash
        run: git fetch -q --no-tags origin dev:refs/remotes/origin/dev

      - name: "确认 Xiaomi 改动不覆盖上游共用文件"
        shell: bash
        run: bash scripts/xiaomi-os4/check-upstream-isolation.sh origin/dev
