name: "临时清理 / OS4 跨 OTA LKG 已合并开发分支"
on:
  push:
    paths:
      - ".github/workflows/xiaomi-os4-one-time-cross-lkg-cleanup.yml"
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "核对 PR #40 已合并及分支原 SHA，删除后即移除此工作流"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/40" --jq '.merged')" == "true" ]] || exit 1
          REF="os4-cross-ota-lkg-lifecycle-20261101"
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$REF" --jq '.object.sha')"
          [[ "$CURRENT" == "fc37db744341988c78406422a4ed0ed60dd25bb5" ]] || {
            echo "::error::开发分支已变动；拒绝删除"; exit 1;
          }
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$REF" >/dev/null
          echo "已清理合并后的跨 OTA LKG 开发分支" >> "$GITHUB_STEP_SUMMARY"
