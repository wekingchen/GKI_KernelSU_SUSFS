name: "小米17 Pro OS4 / 已验证 Full 日用 AnyKernel3 打包"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "必须输入 PANDORA_OS4_FULL_VALIDATED"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: xiaomi-os4-pandora-validated-full-anykernel3
  cancel-in-progress: true

env:
  FULL_RUN_ID: "41027979653"
  FULL_ARTIFACT: "FASTBOOT-BOOT-ONLY-pandora-OS4-R62-DroidSpaces-FULL"
  FULL_BOOT_IMG: "pandora-OS4-R62-DroidSpaces-FULL-FASTBOOT-BOOT-ONLY.img"
  FULL_BOOT_SHA256: "6298fb802d543f1ff2a9f82ccb953b95e44ce6cf6e91d4469735c6bb892b3086"
  FULL_IMAGE_SHA256: "9b47f40a172ebe2ff0d7c5f6d2834db3fce2535379ea11277fcf010042f2db24"
  FULL_RELEASE: "6.12.69-android16-6-os4r62-dspids-dscore-full-kmi-4k"

jobs:
  package:
    name: "只打包已真机验证 Image，不重新编译"
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: "确认人工门禁"
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirm }}" == "PANDORA_OS4_FULL_VALIDATED" ]] || {
            echo "::error::Confirmation string mismatch"; exit 1;
          }

      - name: "检出固定 OS4 分支"
        uses: actions/checkout@v7

      - name: "检查打包脚本"
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/xiaomi-os4/package-validated-anykernel3.sh
          grep -Fq 'module_blacklist=' scripts/xiaomi-os4/package-validated-anykernel3.sh
          grep -Fq 'OS4.0.5.0.XBLCNXM' scripts/xiaomi-os4/package-validated-anykernel3.sh
          ! grep -Eq 'fastboot[[:space:]]+flash|dd[[:space:]].*of=/dev/block' scripts/xiaomi-os4/package-validated-anykernel3.sh

      - name: "下载已真机验证的 Full Extras fastboot artifact"
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.FULL_ARTIFACT }}
          run-id: ${{ env.FULL_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/validated-full

      - name: "核对 fastboot 镜像和 ABI 安全记录"
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ runner.temp }}/validated-full"
          test -s "$ROOT/$FULL_BOOT_IMG"
          printf '%s  %s\n' "$FULL_BOOT_SHA256" "$ROOT/$FULL_BOOT_IMG" | sha256sum -c -
          grep -qx 'SAFE_TO_FASTBOOT_BOOT=YES_EXPERIMENTAL' "$ROOT/droidspaces-full-safety.txt"
          grep -q '^MISSING_EXPORTS=0$' "$ROOT/droidspaces-full-abi-diff.txt"
          grep -q '^CRC_CONFLICTS=0$' "$ROOT/droidspaces-full-abi-diff.txt"
          grep -qx "KERNEL_RELEASE=$FULL_RELEASE" "$ROOT/build-metadata.txt"
          grep -qx "IMAGE_SHA256=$FULL_IMAGE_SHA256" "$ROOT/build-metadata.txt"

      - name: "从已验证 boot-v4 精确提取内核 Image"
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ runner.temp }}/validated-full"
          OUT="${{ runner.temp }}/validated-image"
          mkdir -p "$OUT"
          python3 - "$ROOT/$FULL_BOOT_IMG" "$OUT/Image" "$FULL_IMAGE_SHA256" "$FULL_RELEASE" <<'PY'
          import hashlib, struct, sys
          from pathlib import Path

          src, dst, expected_sha, release = sys.argv[1:]
          data=Path(src).read_bytes()
          if data[:8] != b"ANDROID!":
              raise SystemExit("not Android boot image")
          kernel_size=struct.unpack_from("<I", data, 8)[0]
          header_version=struct.unpack_from("<I", data, 40)[0]
          header_size=struct.unpack_from("<I", data, 20)[0]
          if header_version != 4 or header_size != 1584:
              raise SystemExit(f"unexpected boot header v={header_version} size={header_size}")
          kernel=data[4096:4096+kernel_size]
          digest=hashlib.sha256(kernel).hexdigest()
          if digest != expected_sha:
              raise SystemExit(f"Image SHA mismatch: {digest}")
          if release.encode() not in kernel:
              raise SystemExit("release marker missing from Image")
          Path(dst).write_bytes(kernel)
          print(f"EXTRACTED_IMAGE_SHA256={digest}")
          print(f"EXTRACTED_IMAGE_SIZE={len(kernel)}")
          PY

      - name: "安装打包依赖"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git unzip zip

      - name: "生成 OS4 日用 AnyKernel3 候选"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/package"
          bash scripts/xiaomi-os4/package-validated-anykernel3.sh \
            "${{ runner.temp }}/validated-image/Image" \
            "${{ runner.temp }}/package" | tee "${{ runner.temp }}/package/package-report.txt"

      - name: "最终包内容审计"
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ runner.temp }}/package"
          ZIP="$OUT/Xiaomi17Pro-pandora-OS4.0.5.0-R62-FULL-AnyKernel3.zip"
          test -s "$ZIP"
          unzip -t "$ZIP" >/dev/null
          unzip -p "$ZIP" Image | sha256sum | grep -q "^$FULL_IMAGE_SHA256 "
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'module_blacklist='
          unzip -p "$ZIP" anykernel.sh | grep -Fq 'OS4.0.5.0.XBLCNXM'
          if unzip -Z1 "$ZIP" | grep -Eq '(^|/)(boot|init_boot|vendor_boot|vendor_kernel_boot|dtbo|vbmeta)(_[ab])?\.img$'; then
            echo "::error::partition image leaked into AnyKernel3 ZIP"; exit 1
          fi
          {
            echo "SOURCE_FULL_RUN_ID=$FULL_RUN_ID"
            echo "SOURCE_BOOT_SHA256=$FULL_BOOT_SHA256"
            echo "SOURCE_IMAGE_SHA256=$FULL_IMAGE_SHA256"
            echo "SOURCE_RELEASE=$FULL_RELEASE"
            echo "TRUE_DEVICE_DROIDSPACES_REQUIREMENTS=PASS"
            echo "TRUE_DEVICE_WIFI=PASS"
            echo "TRUE_DEVICE_CELLULAR=PASS"
            echo "TRUE_DEVICE_DUAL_SIM=PASS"
            echo "TRUE_DEVICE_VOLTE_IMS=PASS"
            echo "TRUE_DEVICE_BLUETOOTH=PASS"
            echo "TRUE_DEVICE_CAMERA=PASS"
            echo "BUILTIN_NOMOUNT_API=PASS"
            echo "NOMOUNT_V2_2_0_METAMODULE_FLOCK=KNOWN_NONBLOCKING_FOR_CURRENT_USAGE"
            echo "FLASH_METHOD=AnyKernel3 active boot kernel replacement"
            echo "AUTO_FLASH=NO"
          } > "$OUT/validation-manifest.txt"

      - name: "上传日用候选包"
        uses: actions/upload-artifact@v6
        with:
          name: PERSISTENT-CANDIDATE-pandora-OS4.0.5.0-R62-FULL-AnyKernel3
          path: |
            ${{ runner.temp }}/package/Xiaomi17Pro-pandora-OS4.0.5.0-R62-FULL-AnyKernel3.zip
            ${{ runner.temp }}/package/Xiaomi17Pro-pandora-OS4.0.5.0-R62-FULL-AnyKernel3.zip.sha256
            ${{ runner.temp }}/package/package-report.txt
            ${{ runner.temp }}/package/validation-manifest.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: "摘要"
        shell: bash
        run: |
          OUT="${{ runner.temp }}/package"
          {
            echo "## Xiaomi 17 Pro OS4 validated Full AnyKernel3"
            echo
            cat "$OUT/package-report.txt"
            echo
            echo "This workflow only packages the already true-device-validated Image."
            echo "It does not rebuild or flash a device."
          } >> "$GITHUB_STEP_SUMMARY"
