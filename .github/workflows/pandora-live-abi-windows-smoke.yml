name: "Pandora ABI CMD smoke on Windows (temporary)"
on:
  push:
    branches: ["fix-pandora-live-abi-cmd-quoting"]
    paths:
      - ".github/workflows/pandora-live-abi-windows-smoke.yml"
      - "scripts/xiaomi-os4/collect-pandora-live-abi-evidence.cmd"
jobs:
  cmd-shell-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Mock adb (no real device)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mockadb'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @'
          using System;
          class MockAdb {
              static int Main(string[] a) {
                  string cmd = String.Join(" ", a);
                  switch (cmd) {
                      case "shell getprop ro.product.device":
                          Console.WriteLine("pandora"); return 0;
                      case "shell getprop ro.mi.os.version.incremental":
                          Console.WriteLine("OS4.0.6.0.XBLCNXM"); return 0;
                      case "shell getprop ro.boot.slot_suffix":
                          Console.WriteLine("_b"); return 0;
                      case "shell getprop sys.boot_completed":
                          Console.WriteLine("1"); return 0;
                      case "shell uname -r":
                          Console.WriteLine("6.12.69-android16-6-g43b5ab7e247d-abogki561813157-4k"); return 0;
                      case "shell su -c id":
                          Console.WriteLine("uid=0(root) gid=0(root) context=u:r:ksu:s0"); return 0;
                      case "shell su -c cat /proc/modules":
                          Console.WriteLine("zram 159744 1 - Live 0x0000000000000000 (O)");
                          Console.WriteLine("zsmalloc 45056 2 node_cache,zram, Live 0x0000000000000000 (O)");
                          Console.WriteLine("rust_binder 462848 0 - Live 0x0000000000000000 (O)");
                          return 0;
                      case "shell su -c cat /vendor_dlkm/lib/modules/modules.load":
                          Console.WriteLine("zram.ko\nzsmalloc.ko\nnode_cache.ko"); return 0;
                      case "shell su -c cat /system_dlkm/lib/modules/modules.load":
                          Console.WriteLine("kernel/mm/zsmalloc.ko\nkernel/drivers/android/rust_binder.ko"); return 0;
                      case "shell su -c cat /proc/kallsyms":
                          Console.WriteLine("0000000000000000 T qcom_smem_get");
                          Console.WriteLine("0000000000000000 T __ksymtab_qcom_smem_get");
                          Console.WriteLine("0000000000000000 T ipc_log_string");
                          Console.WriteLine("0000000000000000 T should_be_filtered");
                          return 0;
                      default:
                          Console.Error.WriteLine("Unexpected or device-changing adb call: " + cmd);
                          return 7;
                  }
              }
          }
          '@ | Set-Content -Encoding ascii (Join-Path $dir 'MockAdb.cs')
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $compiler)) { throw "Windows .NET Framework C# compiler unavailable" }
          & $compiler /nologo /target:exe "/out:$dir\adb.exe" (Join-Path $dir 'MockAdb.cs')
          if ($LASTEXITCODE -ne 0) { throw "Mock adb native EXE compilation failed" }
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Actual CMD batch run
        shell: cmd
        run: |
          call scripts\xiaomi-os4\collect-pandora-live-abi-evidence.cmd
          if errorlevel 1 exit /b 1
      - name: Verify no addresses leak and selected live modules are present
        shell: pwsh
        run: |
          $folders = @(Get-ChildItem -Directory -Filter "pandora-live-abi-*")
          if ($folders.Count -ne 1) { throw "Expected one capture folder, got $($folders.Count)" }
          $folder = $folders[0].FullName
          $modules = Get-Content (Join-Path $folder 'loaded-modules.txt') -Raw
          $loading = Get-Content (Join-Path $folder 'module-load-selection.txt') -Raw
          $symbols = Get-Content (Join-Path $folder 'kernel-symbol-names.txt') -Raw
          if ($modules -notmatch 'rust_binder') { throw "Missing loaded modules" }
          if ($loading -notmatch 'zsmalloc.ko') { throw "Missing actual module.load" }
          if ($symbols -notmatch 'qcom_smem_get' -or $symbols -notmatch 'ipc_log_string') { throw "Missing selected symbols" }
          if ($symbols -match '0000000000000000|should_be_filtered') { throw "Raw addresses or unrelated symbols leaked" }
          if (@(Get-Content (Join-Path $folder 'vendor_dlkm-modules.load')).Count -lt 2) { throw "Missing vendor loader evidence" }
          Write-Host 'WINDOWS_CMD_INTEGRATION=PASS (mock ADB, no phone touched)'
