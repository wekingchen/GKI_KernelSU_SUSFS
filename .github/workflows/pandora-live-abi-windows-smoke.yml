name: "Pandora ABI CMD smoke on Windows (temporary)"
on:
  push:
    branches: ["fix-pandora-live-abi-cmd-quoting"]
    paths:
      - ".github/workflows/pandora-live-abi-windows-smoke.yml"
      - "scripts/xiaomi-os4/collect-pandora-live-abi-evidence.cmd"
jobs:
  cmd-shell-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Mock adb (no real device)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mockadb'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @'
          import sys
          a=sys.argv[1:]
          if a==['shell','getprop','ro.product.device']: print('pandora')
          elif a==['shell','getprop','ro.mi.os.version.incremental']: print('OS4.0.6.0.XBLCNXM')
          elif a==['shell','getprop','ro.boot.slot_suffix']: print('_b')
          elif a==['shell','getprop','sys.boot_completed']: print('1')
          elif a==['shell','uname','-r']: print('6.12.69-android16-6-g43b5ab7e247d-abogki561813157-4k')
          elif a==['shell','su','-c','id']: print('uid=0(root) gid=0(root) context=u:r:ksu:s0')
          elif a==['shell','su','-c','cat /proc/modules']:
              print('zram 159744 1 - Live 0x0000000000000000 (O)')
              print('zsmalloc 45056 2 node_cache,zram, Live 0x0000000000000000 (O)')
              print('rust_binder 462848 0 - Live 0x0000000000000000 (O)')
          elif a==['shell','su','-c','cat /vendor_dlkm/lib/modules/modules.load']:
              print('zram.ko')
              print('zsmalloc.ko')
              print('node_cache.ko')
          elif a==['shell','su','-c','cat /system_dlkm/lib/modules/modules.load']:
              print('kernel/mm/zsmalloc.ko')
              print('kernel/drivers/android/rust_binder.ko')
          elif a==['shell','su','-c','cat /proc/kallsyms']:
              print('0000000000000000 T qcom_smem_get')
              print('0000000000000000 T __ksymtab_qcom_smem_get')
              print('0000000000000000 T ipc_log_string')
              print('0000000000000000 T should_be_filtered')
          else:
              print('unknown or device-mutating adb command: '+repr(a),file=sys.stderr)
              sys.exit(7)
          '@ | Set-Content -Encoding utf8 (Join-Path $dir 'fake_adb.py')
          @'
          @echo off
          python "%~dp0fake_adb.py" %*
          '@ | Set-Content -Encoding ascii (Join-Path $dir 'adb.cmd')
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Actual CMD batch run
        shell: cmd
        run: |
          call scripts\xiaomi-os4\collect-pandora-live-abi-evidence.cmd
          if errorlevel 1 exit /b 1
      - name: Verify no addresses leak and selected live modules are present
        shell: pwsh
        run: |
          $folders = @(Get-ChildItem -Directory -Filter "pandora-live-abi-*")
          if ($folders.Count -ne 1) { throw "Expected one capture folder, got $($folders.Count)" }
          $folder = $folders[0].FullName
          $modules = Get-Content (Join-Path $folder 'loaded-modules.txt') -Raw
          $loading = Get-Content (Join-Path $folder 'module-load-selection.txt') -Raw
          $symbols = Get-Content (Join-Path $folder 'kernel-symbol-names.txt') -Raw
          if ($modules -notmatch 'rust_binder') { throw "Missing loaded modules" }
          if ($loading -notmatch 'zsmalloc.ko') { throw "Missing actual module.load" }
          if ($symbols -notmatch 'qcom_smem_get' -or $symbols -notmatch 'ipc_log_string') { throw "Missing selected symbols" }
          if ($symbols -match '0000000000000000|should_be_filtered') { throw "Raw addresses or unrelated symbols leaked" }
          if (@(Get-Content (Join-Path $folder 'vendor_dlkm-modules.load')).Count -lt 2) { throw "Missing vendor loader evidence" }
          Write-Host 'WINDOWS_CMD_INTEGRATION=PASS (mock ADB, no phone touched)'
