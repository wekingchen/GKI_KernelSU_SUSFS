name: "仓库维护 / Pandora OTA V2 已合并临时分支精确清理（一次性）"

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/pandora-ota-v2-merged-branch-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pandora-ota-v2-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "只删除已合并 PR 的精确旧 SHA 分支；保护 dev 和仍在使用的开发分支"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "wekingchen/GKI_KernelSU_SUSFS" &&
             "$GITHUB_REF_NAME" == dev &&
             ( "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ) ]] || exit 2
          removed=0
          while IFS='|' read -r pr branch sha; do
            [[ "$pr" =~ ^[1-9][0-9]*$ && "$sha" =~ ^[a-f0-9]{40}$ &&
               "$branch" =~ ^(docs|feat|fix)/[A-Za-z0-9._/-]+$ ]] || exit 2
            PR="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")"
            jq -e --arg name "$branch" --arg sha "$sha" '
              .state == "closed" and .merged == true and .merged_at != null
              and .base.ref == "dev" and .head.ref == $name and .head.sha == $sha
            ' <<<"$PR" >/dev/null || {
              echo "::error::PR #$pr does not confirm exact merged branch $branch"; exit 1;
            }
            LIVE=""
            if ! LIVE="$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" 2>/dev/null)"; then
              echo "::notice::Already absent: $branch"; continue
            fi
            jq -e --arg name "$branch" --arg sha "$sha" '
              .name == $name and .protected == false and .commit.sha == $sha
            ' <<<"$LIVE" >/dev/null || {
              echo "::error::Branch changed/protected: $branch; do not delete"; exit 1;
            }
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            if gh api "repos/$GITHUB_REPOSITORY/branches/$branch" >/dev/null 2>&1; then
              echo "::error::Branch deletion not confirmed: $branch"; exit 1;
            fi
            echo "::notice::Deleted merged PR #$pr: $branch"
            removed=$((removed+1))
          done <<'MERGED_BRANCHES'
          134|docs/pandora-ota-v2-phase4-smoke-20261123|62d59e9717e83a6e1af15a8f698d0a575a84c0d2
          129|feat/pandora-406-compat-custom-lkg-promotion|cf932f4a53552238bc1e08ad9db3e4cff27ef068
          127|fix/pandora-406-anykernel-upgrade-blacklist-escape|d285b42e49d8d5fd0dbf713db771bacdf133b6be
          132|fix/pandora-lkg-draft-by-id-recovery|3cd94a8184d011b757efbf3e7fc15a7ccbcb9028
          133|fix/pandora-lkg-draft-repair-by-id|5d3a2867df2c2a9b25c52e62da5b8a4d5fa250c5
          131|fix/pandora-lkg-warm-cache-and-safe-dev-advance|a620ac2decd8b2618f15822c72a7165cf3ce5f2c
          128|fix/pandora-ota-ccache-warm-restore|301dafbde404c14d984cdb67f7b200ba7a8ba0e7
          136|fix/pandora-ota-v2-final-chain-audit|20b2d048181c09fc14785a1bde62c5e82dadadcc
          139|fix/pandora-ota-v2-freeze-draft-by-id|51b5a5fba23633aadaaefb0b077bb6fc2513bd56
          138|fix/pandora-ota-v2-freeze-os406-historical-input|2addaae1adafef4dcfb1cfe4aba80fe11ffdf294
          140|fix/pandora-ota-v2-replay-immutable-reference-finalize|ff60c20cf0983c6c0add86fb0914a7204d5c5780
          130|fix/pandora-ota-v2-resumable-diagnostic-draft|95595f25c5d7bc6701089dcb73f1fce9e49e527c
          137|fix/pandora-ota-v2-stage-gen7-priority|82d585617b95076aee2bf1afc040c9a3363185dd
          MERGED_BRANCHES

          # Also delete the cleanup PR's own head, only after its exact PR is merged.
          SELF="chore/pandora-ota-v2-merged-branch-cleanup"
          if LIVE="$(gh api "repos/$GITHUB_REPOSITORY/branches/$SELF" 2>/dev/null)"; then
            HEAD="$(jq -r .commit.sha <<<"$LIVE")"
            jq -e '.protected == false' <<<"$LIVE" >/dev/null || exit 1
            PRS="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100")"
            jq -e --arg name "$SELF" --arg sha "$HEAD" '
              [.[] | select(.merged_at != null and .base.ref == "dev"
                and .head.ref == $name and .head.sha == $sha)] | length == 1
            ' <<<"$PRS" >/dev/null || {
              echo "::error::Cleanup branch is not yet verified merged"; exit 1;
            }
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$SELF" >/dev/null
            echo "::notice::Deleted merged cleanup PR branch itself"
          fi
          {
            echo "### Exact merged Pandora OTA V2 branch cleanup"
            echo "- Deleted and verified $removed previously merged feature/documentation branches"
            echo "- Verified each PR was merged to dev with exact branch-tip SHA"
            echo "- Also deleted this cleanup PR's own branch after checking its merge"
            echo "- Never touched dev, tags, unmerged branches or upstream shared files"
          } >> "$GITHUB_STEP_SUMMARY"
