name: "一次性维护 / 全库冗余 Actions 日志安全清理"
on:
  push:
    branches:
      - "xiaomi-os4-k50pro-repo-log-hygiene-20261101"
      - dev
    paths:
      - ".github/workflows/one-time-hygiene-action-runs-20261101.yml"
      - "scripts/maintenance/prune_actions_runs.py"
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/one-time-hygiene-action-runs-20261101.yml"
      - "scripts/maintenance/prune_actions_runs.py"
permissions:
  contents: read
  actions: write
concurrency:
  group: once-clean-k50-os4-run-history
  cancel-in-progress: false
jobs:
  safe-prune:
    if: github.repository == 'wekingchen/GKI_KernelSU_SUSFS'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: "检查清理脚本与仓库关键工作流（只读）"
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/maintenance/prune_actions_runs.py
          ruby -ryaml -e 'ARGV.each { |p| YAML.parse_file(p) }' \
            .github/workflows/generic-custom-auto-sync.yml \
            .github/workflows/xiaomi-sm8850-os4-custom.yml \
            .github/workflows/xiaomi-sm8850-os4-promote-lkg.yml \
            .github/workflows/one-time-hygiene-action-runs-20261101.yml
      - name: "生成保留清单，预演删除，不触碰任何已有 Run"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintenance/prune_actions_runs.py
      - name: "仅合并后的 dev push 执行冗余日志清理"
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintenance/prune_actions_runs.py --apply
