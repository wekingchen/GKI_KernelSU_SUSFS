name: "pandora 4.0.6 ABI provider graph read-only check"
on:
  push:
    branches: ["pandora-ota-abi-provider-graph-406"]
    paths:
      - ".github/workflows/pandora-ota-provider-probe.yml"
      - "scripts/xiaomi-os4/check-ota-oem-abi.py"
      - "scripts/xiaomi-os4/test_ota_vendor_provider_graph.py"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: "下载固定 OTA + 永久候选并复验 SHA（只读）"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/abi/stock" "$RUNNER_TEMP/abi/gki"
          gh release download pandora-os4-stock-input --repo "$GITHUB_REPOSITORY" --pattern 'pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip' --dir "$RUNNER_TEMP/abi/stock"
          echo "bebb8754c16dd30c724fdba3687694e615e03342d6f5f55918cd06f1dca8cbb8  $RUNNER_TEMP/abi/stock/pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip" | sha256sum -c -
          gh release download pandora-os4-ota-candidate-OS4.0.6.0.XBLCNXM --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/abi/gki"
          (cd "$RUNNER_TEMP/abi/gki" && sha256sum -c RELEASE-SHA256SUMS.txt)
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_ota_vendor_provider_graph.py' -v
          python3 -m unittest discover -s scripts/xiaomi-os4 -p 'test_audit_ext_modversions.py' -v
      - name: "逐个 OEM 符号/CRC 原始字节比对；禁止生成 boot"
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/xiaomi-os4/check-ota-oem-abi.py \
            --stock-zip "$RUNNER_TEMP/abi/stock/pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip" \
            --stock-report "$RUNNER_TEMP/abi/gki/stock-report.json" \
            --candidate-report "$RUNNER_TEMP/abi/gki/gki-candidate.json" \
            --metadata "$RUNNER_TEMP/abi/gki/build-metadata.txt" \
            --symvers "$RUNNER_TEMP/abi/gki/Module.symvers" \
            --output "$RUNNER_TEMP/abi/ota-abi-report.json"
          jq '{gate,reason,eligible_for_fastboot_boot,module_count,imports_checked,core_imports_checked,oem_imports_checked,short_vermagic_modules,full_vermagic_modules,verified_oem_export_symbols,provider_graph_edge_count,failed_modules_count:(.failed_modules|length),crc_mismatches_count:(.crc_mismatches|length),unresolved_imports_count:(.unresolved_kernel_imports|length),ambiguous_provider_count:(.ambiguous_providers|length),failure_examples:(.failed_modules[:8]),unresolved_examples:(.unresolved_kernel_imports[:12]),mismatch_examples:(.crc_mismatches[:12])}' "$RUNNER_TEMP/abi/ota-abi-report.json"
          echo "Read-only report; NEVER produce a flashable or testboot image in this workflow" >> "$GITHUB_STEP_SUMMARY"
      - name: "保存只读安全证据"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pandora-406-provider-graph-diagnostic
          path: ${{ runner.temp }}/abi/ota-abi-report.json
          retention-days: 30
          if-no-files-found: warn
