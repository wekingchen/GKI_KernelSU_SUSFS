name: "pandora 4.0.6 ABI module provider read-only probe"
on:
  push:
    branches: ["pandora-ota-abi-provider-graph-406"]
    paths: [".github/workflows/pandora-ota-provider-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Inspect only already-pinned OTA archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oem"
          gh release download pandora-os4-stock-input --repo "$GITHUB_REPOSITORY" \
            --pattern 'pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip' --dir "$RUNNER_TEMP/oem"
          echo "bebb8754c16dd30c724fdba3687694e615e03342d6f5f55918cd06f1dca8cbb8  $RUNNER_TEMP/oem/pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip" | sha256sum -c -
          python3 - <<'PY'
          import collections, importlib.util, io, json, pathlib, re, subprocess, tempfile, zipfile
          spec=importlib.util.spec_from_file_location('abi','scripts/xiaomi-os4/check-ota-oem-abi.py')
          abi=importlib.util.module_from_spec(spec);spec.loader.exec_module(abi)
          file=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'oem/pandora-stock-OS4.0.6.0.XBLCNXM-_b-xm.zip'
          with zipfile.ZipFile(file) as outer:
              raw=outer.read('oem-modules.zip')
          details=[]
          with zipfile.ZipFile(io.BytesIO(raw)) as inner:
              for member in inner.infolist():
                  if member.is_dir() or not abi.KO_NAME.search(member.filename):continue
                  name=member.filename
                  data=abi.unpack_module(inner.read(member),name)
                  secs=abi.elf_sections(data)
                  with tempfile.NamedTemporaryFile(suffix='.ko') as f:
                      f.write(data);f.flush()
                      output=subprocess.run(['readelf','-W','-s',f.name],capture_output=True,text=True,check=True).stdout
                  symbols=[]
                  for line in output.splitlines():
                      fields=line.split()
                      if len(fields)>7 and fields[0].rstrip(':').isdigit():
                          sym=fields[7].split('@')[0]
                          if sym.startswith(('__crc_', '__ksymtab_', '__kstrtab_')):
                              symbols.append((sym,fields[1],fields[6]))
                  details.append(dict(name=name,imports=len(abi.imported_versions(secs)),
                      ksym=[s for s in symbols if s[0].startswith('__ksymtab_') and s[2]!='UND'],
                      crc=[s for s in symbols if s[0].startswith('__crc_') and s[2]!='UND'],
                      section_samples=[k for k in secs if k.startswith(('__kcrctab','__ksymtab'))][:12]))
          count=collections.Counter()
          names=[]
          for item in details:
              if item['ksym']:
                  count['modules_with_ksymtab']+=1
                  count['total_ksymtab']+=len(item['ksym'])
                  if len(names)<15:
                      names.append({k:item[k] for k in ['name','ksym','crc','section_samples']})
              if item['crc']:
                  count['modules_with_crc_abs']+=1
                  count['total_crc_symbols']+=len(item['crc'])
          print(json.dumps({'module_count':len(details),'counts':count,'sample_export_modules':names[:8],
               'sample_without_export':[{'name':x['name'],'section_samples':x['section_samples']} for x in details if not x['ksym']][:5]},
                ensure_ascii=False,indent=2,default=list))
          PY
