plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wekingchen.pandoraota'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wekingchen.pandoraota'
        minSdk 29
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 14
        versionName '0.10.0-dev'
    }

    signingConfigs {
        stable {
            def keyfile = System.getenv('PANDORA_OTA_STORE_FILE')
            if (keyfile) {
                storeFile file(keyfile)
                storePassword System.getenv('PANDORA_OTA_STORE_PASSWORD')
                keyAlias System.getenv('PANDORA_OTA_KEY_ALIAS')
                keyPassword System.getenv('PANDORA_OTA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('PANDORA_OTA_STORE_FILE')) {
                signingConfig signingConfigs.stable
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
